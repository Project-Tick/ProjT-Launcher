release_prepare:
  stage: release
  image: ubuntu:24.04
  tags:
    - $LINUX_RUNNER_TAG
  needs:
    - job: javacheck_build
      artifacts: true
    - job: launcher_linux
      artifacts: true
    - job: launcher_windows
      artifacts: true
    - job: launcher_macos_universal
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RELEASE_TAG'
  script:
    - |
      set -eu
      apt-get update
      apt-get install -y --no-install-recommends ca-certificates git zip xz-utils gnupg

      VERSION="${CI_COMMIT_TAG:-$RELEASE_TAG}"
      SRC_DIR="$CI_PROJECT_DIR"
      OUT_DIR="$CI_PROJECT_DIR/release-assets"
      mkdir -p "$OUT_DIR"

      libs="libnbtplusplus zlib quazip bzip2 launcherjava tomlplusplus libqrencode extra-cmake-modules cmark javacheck"

      sign_file() {
        local path="$1"
        if [ -n "${LINUX_GPG_KEY:-}" ]; then
          echo -n "$LINUX_GPG_KEY" | base64 -d | gpg --batch --yes --import
          if [ -n "${LINUX_GPG_ID:-}" ]; then
            gpg --batch --yes --armor --default-key "$LINUX_GPG_ID" --output "${path}.asc" --detach-sign "$path"
          else
            gpg --batch --yes --armor --output "${path}.asc" --detach-sign "$path"
          fi
        fi
      }

      for d in $libs; do
        base="${d}-${VERSION}"
        tar -C "$SRC_DIR" -czf "$OUT_DIR/${base}.tar.gz" "$d"
        tar -C "$SRC_DIR" -cJf "$OUT_DIR/${base}.tar.xz" "$d"
        (cd "$SRC_DIR" && zip -r "$OUT_DIR/${base}.zip" "$d")

        sign_file "$OUT_DIR/${base}.tar.gz"
        sign_file "$OUT_DIR/${base}.tar.xz"
        sign_file "$OUT_DIR/${base}.zip"
      done

      tar --exclude='.git' -czf "$OUT_DIR/ProjTLauncher-${VERSION}.tar.gz" -C "$SRC_DIR" .

      # Collect binary artifacts produced by build jobs when available.
      if [ -d "$CI_PROJECT_DIR/package" ]; then
        find "$CI_PROJECT_DIR/package" -maxdepth 1 -type f -exec cp {} "$OUT_DIR"/ \;
      fi
      find "$CI_PROJECT_DIR" -type f -path '*/package/*' -exec cp {} "$OUT_DIR"/ \; || true
      find "$CI_PROJECT_DIR" -type f -path '*/javacheck/build/*.jar' -exec cp {} "$OUT_DIR"/ \; || true
  artifacts:
    when: always
    paths:
      - release-assets/
    expire_in: 14 days

release_publish:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  tags:
    - $LINUX_RUNNER_TAG
  needs:
    - job: release_prepare
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RELEASE_TAG'
  script:
    - |
      set -eu
      TAG="${CI_COMMIT_TAG:-$RELEASE_TAG}"
      glab auth login --hostname "$CI_SERVER_HOST" --job-token "$CI_JOB_TOKEN"
      glab release create "$TAG" --name "ProjTLauncher $TAG" --notes "Automated release from GitLab CI" || true

      for file in release-assets/*; do
        [ -f "$file" ] || continue
        glab release upload "$TAG" "$file#$(basename "$file")" || true
      done

winget_release:
  stage: release
  image: python:3.11-bookworm
  tags:
    - $LINUX_RUNNER_TAG
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web" && $WINGET_TAG_NAME'
  script:
    - |
      set -eu
      VERSION="${CI_COMMIT_TAG:-$WINGET_TAG_NAME}"
      if [ -z "${WINGET_TOKEN:-}" ]; then
        echo "WINGET_TOKEN is required for winget publish."
        exit 1
      fi

      python -m pip install --upgrade pip
      python -m pip install winget-releaser

      if command -v winget-releaser >/dev/null 2>&1; then
        winget-releaser \
          --identifier ProjectTick.ProjTLauncher \
          --version "$VERSION" \
          --installers-regex 'ProjTLauncher-Windows-MSVC(:?-arm64|-Legacy)?-Setup-.+\\.exe$' \
          --token "$WINGET_TOKEN"
      else
        python -m winget_releaser \
          --identifier ProjectTick.ProjTLauncher \
          --version "$VERSION" \
          --installers-regex 'ProjTLauncher-Windows-MSVC(:?-arm64|-Legacy)?-Setup-.+\\.exe$' \
          --token "$WINGET_TOKEN"
      fi
