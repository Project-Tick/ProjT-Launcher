workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: never

stages:
  - prepare
  - scheduled
  - lint
  - build

variables:
  GIT_DEPTH: "1"
  GIT_SUBMODULE_DEPTH: "1"
  LAUNCHER_LINUX_IMAGE: "$CI_REGISTRY_IMAGE/ci/launcher-linux:trixie"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  CCACHE_DIR: "$CI_PROJECT_DIR/.cache/ccache"

default:
  cache:
    key: "$CI_JOB_NAME_SLUG-$CI_COMMIT_REF_SLUG"
    policy: pull-push
    paths:
      - .cache/npm/
      - .cache/pip/
      - .cache/ccache/

schedule_js_fuzz:
  stage: scheduled
  image: node:20-bookworm
  tags:
    - pt-rhel-runner-01
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - cd bot
    - npm install
    - npm install fast-check
    - node fuzz/fastcheck.test.js

schedule_python_fuzz:
  stage: scheduled
  image: python:3.11-bookworm
  tags:
    - pt-rhel-runner-01
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt atheris
    - python fuzz/meta/fuzz_meta_models.py -runs=2000

schedule_flatpak_update:
  stage: scheduled
  image: ghcr.io/flathub/flatpak-external-data-checker:latest
  tags:
    - pt-rhel-runner-01
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_FLATPAK == "weekly"'
  script:
    - |
      if ! command -v git >/dev/null 2>&1; then
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update && apt-get install -y git
        elif command -v apk >/dev/null 2>&1; then
          apk add --no-cache git
        elif command -v dnf >/dev/null 2>&1; then
          dnf -y install git
        fi
      fi
    - |
      if command -v flatpak-external-data-checker >/dev/null 2>&1; then
        flatpak-external-data-checker --update --edit-only flatpak/org.projecttick.ProjTLauncher.yml
      elif [ -x /app/flatpak-external-data-checker ]; then
        /app/flatpak-external-data-checker --update --edit-only flatpak/org.projecttick.ProjTLauncher.yml
      else
        echo "flatpak-external-data-checker not found in image."
        exit 1
      fi
    - |
      if git diff --quiet; then
        echo "No flatpak updates."
        exit 0
      fi
      git config user.name "Project Tick Bot"
      git config user.email "gitlab-bot@projecttick.org"
      git checkout -B update-modules
      git add flatpak/org.projecttick.ProjTLauncher.yml
      git commit -m "chore: update modules"
      if [ -n "${GITLAB_BOT_TOKEN:-}" ]; then
        git push "https://oauth2:${GITLAB_BOT_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:update-modules
      else
        echo "GITLAB_BOT_TOKEN not set; updated branch not pushed."
      fi

schedule_cfl:
  stage: scheduled
  image: ubuntu:24.04
  tags:
    - pt-rhel-runner-01
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - apt-get update
    - apt-get install -y clang cmake ninja-build build-essential
    - >
      cmake -S . -B build-fuzz -G Ninja
      -DCMAKE_BUILD_TYPE=RelWithDebInfo
      -DBUILD_TESTING=OFF
      -DBUILD_FUZZERS=ON
      -DCMAKE_C_COMPILER=clang
      -DCMAKE_CXX_COMPILER=clang++
    - cmake --build build-fuzz --target fuzz_nbt_reader
    - ./build-fuzz/fuzz_nbt_reader -runs=2000

schedule_flatpak_deploy:
  stage: scheduled
  image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
  resource_group: flatpak-deploy
  privileged: true
  tags:
    - $RUNNER_TAG
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_FLATPAK == "weekly"'
  script:
    - |
      if [ -z "${FLATPAK_SITE_REPO:-}" ] || [ -z "${FLATPAK_SITE_TOKEN:-}" ]; then
        echo "FLATPAK_SITE_REPO / FLATPAK_SITE_TOKEN required."
        exit 1
      fi
    - |
      if command -v apt-get >/dev/null 2>&1; then
        apt-get update
        apt-get install -y git rsync dbus-user-session
      fi
    - |
      flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
    - |
      if [ -n "${FLATPAK_GPG_KEY:-}" ] && [ -n "${FLATPAK_GPG_KEY_ID:-}" ]; then
        echo -n "$FLATPAK_GPG_KEY" | base64 -d | gpg --import
      fi
    - |
      REPO_DIR="$CI_PROJECT_DIR/flatpak-repo"
      BUILD_DIR="$CI_PROJECT_DIR/flatpak-build"
      rm -rf "$REPO_DIR" "$BUILD_DIR"
      mkdir -p "$REPO_DIR" "$BUILD_DIR"
    - |
      build_cmd="flatpak-builder --force-clean --repo=$REPO_DIR --arch=$FLATPAK_ARCH --default-branch=nightly $BUILD_DIR flatpak/org.projecttick.ProjTLauncher.yml"
      if command -v dbus-run-session >/dev/null 2>&1; then
        dbus-run-session -- bash -lc "$build_cmd"
      else
        bash -lc "$build_cmd"
      fi
    - |
      flatpak build-update-repo \
        ${FLATPAK_GPG_KEY_ID:+--gpg-sign="$FLATPAK_GPG_KEY_ID"} \
        --generate-static-deltas \
        --prune \
        "$REPO_DIR"
    - |
      git clone "https://oauth2:${FLATPAK_SITE_TOKEN}@${FLATPAK_SITE_REPO}" flatpak-site
      rsync -a --delete "$REPO_DIR"/ flatpak-site/
      cp -r flatpak/static/. flatpak-site/
      cd flatpak-site
      git add -A
      if git diff --cached --quiet; then
        echo "No changes to push."
        exit 0
      fi
      git config user.name "Project Tick Bot"
      git config user.email "gitlab-bot@projecttick.org"
      git commit -m "chore: update flatpak repository ($FLATPAK_ARCH)"
      git push
  variables:
    RUNNER_TAG: pt-rhel-runner-01
    FLATPAK_ARCH: x86_64

