workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - when: never

stages:
  - prepare
  - lint
  - build

variables:
  GIT_DEPTH: "1"
  GIT_SUBMODULE_DEPTH: "1"
  LAUNCHER_LINUX_IMAGE: "$CI_REGISTRY_IMAGE/ci/launcher-linux:bookworm"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  CCACHE_DIR: "$CI_PROJECT_DIR/.cache/ccache"

default:
  cache:
    key: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
    policy: pull-push
    paths:
      - .cache/npm/
      - .cache/pip/
      - .cache/ccache/

launcher_linux_image:
  stage: prepare
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  tags:
    - pt-rhel-runner-01
  variables:
    DOCKER_CONFIG: /kaniko/.docker
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: manual
      allow_failure: false
  script:
    - mkdir -p /kaniko/.docker
    - |
      printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}\n' \
        "$CI_REGISTRY" \
        "$CI_REGISTRY_USER" \
        "$CI_REGISTRY_PASSWORD" > /kaniko/.docker/config.json
    - >
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/.gitlab/docker/launcher-linux/Dockerfile"
      --destination "$LAUNCHER_LINUX_IMAGE"
      --destination "$CI_REGISTRY_IMAGE/ci/launcher-linux:$CI_COMMIT_SHORT_SHA"

.launcher_rules:
  rules: &launcher_rules
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: false
      variables:
        BUILD_TYPE: Debug
    - if: '$CI_COMMIT_TAG'
      variables:
        BUILD_TYPE: Release
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: manual
      allow_failure: false
      variables:
        BUILD_TYPE: Debug

markdown_lint:
  stage: lint
  image: node:20-bookworm
  tags:
    - pt-rhel-runner-01
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: manual
      allow_failure: false
  script:
    - npm install --global markdownlint-cli
    - markdownlint . --config .markdownlint.yaml --ignore-path .markdownlintignore

bot_smoke:
  stage: lint
  image: node:20-bookworm
  tags:
    - pt-rhel-runner-01
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: manual
      allow_failure: false
  script:
    - node -c bot/index.js

meta_smoke:
  stage: lint
  image: python:3.11-bookworm
  tags:
    - pt-rhel-runner-01
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: manual
      allow_failure: false
  script:
    - python -m compileall meta

javacheck_build:
  stage: build
  image: ubuntu:24.04
  tags:
    - pt-rhel-runner-01
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: manual
      allow_failure: false
  script:
    - apt-get -y update
    - >
      apt-get -y install
      dpkg-dev
      ninja-build
      scdoc
      appstream
      libxcb-cursor-dev
      openjdk-21-jdk
      libtiff6
      lcov
      cmake
      build-essential
    - cmake -S javacheck -B javacheck/build -G Ninja
    - cmake --build javacheck/build --parallel
  artifacts:
    when: always
    paths:
      - javacheck/build/*.jar
    expire_in: 3 days

.launcher_linux_template:
  stage: build
  image: $LAUNCHER_LINUX_IMAGE_JOB
  tags:
    - $RUNNER_TAG
  rules: *launcher_rules
  variables:
    BUILD_TYPE: Debug
    BUILD_PLATFORM: official
    CMAKE_PRESET: linux
    RUNNER_TAG: pt-rhel-runner-01
    LAUNCHER_LINUX_IMAGE_JOB: $LAUNCHER_LINUX_IMAGE
  script:
    - |
      set -eu
      if ! command -v cmake >/dev/null 2>&1; then
        apt-get -y update
        JAVA_PKG="openjdk-21-jdk"
        if ! apt-cache show "$JAVA_PKG" >/dev/null 2>&1; then
          JAVA_PKG="openjdk-17-jdk"
        fi
        apt-get -y install \
          build-essential \
          ccache \
          cmake \
          dpkg-dev \
          ninja-build \
          scdoc \
          appstream \
          "$JAVA_PKG" \
          lcov \
          libxcb-cursor-dev \
          libdbus-1-dev \
          libinih-dev \
          libsystemd-dev \
          libtiff6 \
          pkg-config
      fi

      if command -v ccache >/dev/null 2>&1; then
        export CCACHE_DIR="${CCACHE_DIR:-$CI_PROJECT_DIR/.cache/ccache}"
        export CCACHE_BASEDIR="$CI_PROJECT_DIR"
        export CCACHE_COMPRESS=1
        export CCACHE_MAXSIZE=2G
        ccache -z || true
      fi

      if command -v javac >/dev/null 2>&1; then
        JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
        export JAVA_HOME
        export PATH="$JAVA_HOME/bin:$PATH"
      fi

      rm -rf build
      if command -v ccache >/dev/null 2>&1; then
        cmake --preset "$CMAKE_PRESET" \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      else
        cmake --preset "$CMAKE_PRESET"
      fi
      cmake --build --preset "$CMAKE_PRESET" --config "$BUILD_TYPE"
      ctest --preset "$CMAKE_PRESET" --build-config "$BUILD_TYPE" --output-on-failure --no-tests=error
      PACKAGE_DIR="$CI_PROJECT_DIR/package"
      INSTALL_DIR="$CI_PROJECT_DIR/install"
      PORTABLE_DIR="$CI_PROJECT_DIR/install-portable"
      mkdir -p "$PACKAGE_DIR" "$INSTALL_DIR" "$PORTABLE_DIR"

      cmake --install build --config "$BUILD_TYPE" --prefix "$INSTALL_DIR"
      cmake --install build --config "$BUILD_TYPE" --prefix "$PORTABLE_DIR" --component portable || true

      tar -czf "$PACKAGE_DIR/ProjTLauncher-${ARTIFACT_NAME}-${BUILD_TYPE}.tar.gz" -C "$INSTALL_DIR" .
      if find "$PORTABLE_DIR" -mindepth 1 -print -quit | grep -q .; then
        tar -czf "$PACKAGE_DIR/ProjTLauncher-${ARTIFACT_NAME}-Portable-${BUILD_TYPE}.tar.gz" -C "$PORTABLE_DIR" .
      fi

      if [ -f build/CPackConfig.cmake ]; then
        cpack --config build/CPackConfig.cmake -G DEB -C "$BUILD_TYPE" -B "$PACKAGE_DIR" || true
      fi

      ccache -s || true
  artifacts:
    when: always
    name: "$CI_JOB_NAME-$CI_COMMIT_SHORT_SHA"
    paths:
      - build/
      - package/
    expire_in: 1 days

.launcher_macos_template:
  stage: build
  tags:
    - saas-macos-medium-m1
  rules: *launcher_rules
  variables:
    BUILD_TYPE: Debug
    BUILD_PLATFORM: official
    CMAKE_PRESET: macos_universal
  script:
    - |
      set -eu
      if command -v javac >/dev/null 2>&1; then
        JAVA_HOME="$(dirname "$(dirname "$(readlink "$(command -v javac)")")")"
        export JAVA_HOME
        export PATH="$JAVA_HOME/bin:$PATH"
      fi

      rm -rf build
      cmake --preset "$CMAKE_PRESET"
      cmake --build --preset "$CMAKE_PRESET" --config "$BUILD_TYPE"
      ctest --preset "$CMAKE_PRESET" --build-config "$BUILD_TYPE" --output-on-failure --no-tests=error

      PACKAGE_DIR="$CI_PROJECT_DIR/package"
      INSTALL_DIR="$CI_PROJECT_DIR/install"
      PORTABLE_DIR="$CI_PROJECT_DIR/install-portable"
      mkdir -p "$PACKAGE_DIR" "$INSTALL_DIR" "$PORTABLE_DIR"

      cmake --install build --config "$BUILD_TYPE" --prefix "$INSTALL_DIR"
      cmake --install build --config "$BUILD_TYPE" --prefix "$PORTABLE_DIR" --component portable || true

      tar -czf "$PACKAGE_DIR/ProjTLauncher-${ARTIFACT_NAME}-${BUILD_TYPE}.tar.gz" -C "$INSTALL_DIR" .
      if find "$PORTABLE_DIR" -mindepth 1 -print -quit | grep -q .; then
        tar -czf "$PACKAGE_DIR/ProjTLauncher-${ARTIFACT_NAME}-Portable-${BUILD_TYPE}.tar.gz" -C "$PORTABLE_DIR" .
      fi

      if [ -d "$INSTALL_DIR/ProjT Launcher.app" ]; then
        ditto -c -k --sequesterRsrc --keepParent "$INSTALL_DIR/ProjT Launcher.app" "$PACKAGE_DIR/ProjTLauncher-${ARTIFACT_NAME}-${BUILD_TYPE}.zip"
      elif [ -d "$INSTALL_DIR/ProjTLauncher.app" ]; then
        ditto -c -k --sequesterRsrc --keepParent "$INSTALL_DIR/ProjTLauncher.app" "$PACKAGE_DIR/ProjTLauncher-${ARTIFACT_NAME}-${BUILD_TYPE}.zip"
      fi
  artifacts:
    when: always
    name: "$CI_JOB_NAME-$CI_COMMIT_SHORT_SHA"
    paths:
      - build/
      - package/
    expire_in: 1 days

.launcher_windows_template:
  stage: build
  tags:
    - pt-windows-02
  rules: *launcher_rules
  variables:
    BUILD_TYPE: Debug
    BUILD_PLATFORM: official
  script:
    - '$ErrorActionPreference = "Stop"'
    - 'if (Test-Path "build") { Remove-Item -Path "build" -Recurse -Force }'
    - |
      if ($env:VCVARS_ARCH) {
        $candidates = @(
          "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat",
          "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\Professional\Common7\Tools\VsDevCmd.bat",
          "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\BuildTools\Common7\Tools\VsDevCmd.bat"
        )
        $vsdev = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
        if (-not $vsdev) {
          throw "VsDevCmd.bat not found for VCVARS_ARCH=$env:VCVARS_ARCH"
        }

        $configure = "cmake --preset `"$env:CMAKE_PRESET`" -Uqrencode_repo* -UWITH_TESTS -UWITH_TOOLS -UWITH_PNG -UBUILD_TESTING -DLauncher_OUTPUT_ROOT=`"$env:CI_PROJECT_DIR/build/out`""
        $build = "cmake --build --preset `"$env:CMAKE_PRESET`" --config `"$env:BUILD_TYPE`""
        $tests = "ctest --preset `"$env:CMAKE_PRESET`" --build-config `"$env:BUILD_TYPE`" --output-on-failure --no-tests=error"
        cmd /c "`"$vsdev`" -arch=$env:VCVARS_ARCH -host_arch=amd64 && $configure && $build && $tests"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      }
      else {
        cmake --preset "$env:CMAKE_PRESET" -Uqrencode_repo* -UWITH_TESTS -UWITH_TOOLS -UWITH_PNG -UBUILD_TESTING -DLauncher_OUTPUT_ROOT="$env:CI_PROJECT_DIR/build/out"
        cmake --build --preset "$env:CMAKE_PRESET" --config "$env:BUILD_TYPE"
        ctest --preset "$env:CMAKE_PRESET" --build-config "$env:BUILD_TYPE" --output-on-failure --no-tests=error
      }

      $packageDir = Join-Path $env:CI_PROJECT_DIR "package"
      $installDir = Join-Path $env:CI_PROJECT_DIR "install"
      $portableDir = Join-Path $env:CI_PROJECT_DIR "install-portable"
      New-Item -Path $packageDir -ItemType Directory -Force | Out-Null
      New-Item -Path $installDir -ItemType Directory -Force | Out-Null
      New-Item -Path $portableDir -ItemType Directory -Force | Out-Null

      cmake --install build --config "$env:BUILD_TYPE" --prefix "$installDir"
      try {
        cmake --install build --config "$env:BUILD_TYPE" --prefix "$portableDir" --component portable
      } catch {
        Write-Host "Portable component packaging skipped: $($_.Exception.Message)"
      }

      Compress-Archive -Path "$installDir\\*" -DestinationPath "$packageDir\\ProjTLauncher-$($env:ARTIFACT_NAME)-$($env:BUILD_TYPE).zip" -Force
      if ((Get-ChildItem -Path $portableDir -Recurse -File | Measure-Object).Count -gt 0) {
        Compress-Archive -Path "$portableDir\\*" -DestinationPath "$packageDir\\ProjTLauncher-$($env:ARTIFACT_NAME)-Portable-$($env:BUILD_TYPE).zip" -Force
      }
  artifacts:
    when: always
    name: "$CI_JOB_NAME-$CI_COMMIT_SHORT_SHA"
    paths:
      - build/
      - package/
    expire_in: 3 days

launcher_macos_universal:
  extends: .launcher_macos_template
  variables:
    ARTIFACT_NAME: macOS-universal
    CMAKE_PRESET: macos_universal

launcher_windows:
  extends: .launcher_windows_template
  parallel:
    matrix:
      - ARTIFACT_NAME: Windows-MSVC-amd64
        CMAKE_PRESET: windows_msvc
        VCVARS_ARCH: amd64
      - ARTIFACT_NAME: Windows-MSVC-arm64
        CMAKE_PRESET: windows_msvc
        VCVARS_ARCH: arm64
      - ARTIFACT_NAME: Windows-MinGW-amd64
        CMAKE_PRESET: windows_mingw
      - ARTIFACT_NAME: Windows-MinGW-arm64
        CMAKE_PRESET: windows_mingw

launcher_linux:
  extends: .launcher_linux_template
  parallel:
    matrix:
      - ARTIFACT_NAME: Linux-amd64
        RUNNER_TAG: pt-rhel-runner-01
        TARGET_ARCH: amd64
        CMAKE_PRESET: linux
      - ARTIFACT_NAME: Linux-arm64
        RUNNER_TAG: saas-linux-medium-arm64
        TARGET_ARCH: arm64
        LAUNCHER_LINUX_IMAGE_JOB: debian:trixie
        CMAKE_PRESET: linux
