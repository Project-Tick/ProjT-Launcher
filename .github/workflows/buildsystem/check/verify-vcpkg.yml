name: General Evaluation Process

on:
  workflow_call:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Debug
  workflow_dispatch:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Debug
      version:
        description: Launcher version
        required: false
      artifact-name:
        description: Name of the uploaded artifact
        required: false
        default: Linux
      qt-version:
        description: Version of Qt to use
        required: false
        default: 6.10.0
      qt-architecture:
        description: Qt architecture
        required: false
      gpg-private-key:
        description: Private key for AppImage signing
        required: false
      gpg-private-key-id:
        description: ID for the gpg-private-key, to select the signing key
        required: false
      apple-codesign-cert:
        description: Certificate for signing macOS builds
        required: false
      apple-codesign-password:
        description: Password for signing macOS builds
        required: false
      apple-codesign-id:
        description: Certificate ID for signing macOS builds
        required: false
      apple-notarize-apple-id:
        description: Apple ID used for notarizing macOS builds
        required: false
      apple-notarize-team-id:
        description: Team ID used for notarizing macOS builds
        required: false
      apple-notarize-password:
        description: Password used for notarizing macOS builds
        required: false
      sparkle-ed25519-key:
        description: Private key for signing Sparkle updates
        required: false
      msystem:
        description: MSYS2 subsystem to use
        required: false
      windows-codesign-cert:
        description: Certificate for signing Windows builds
        required: false
      windows-codesign-password:
        description: Password for signing Windows builds
        required: false
      vcvars-arch:
        description: Visual Studio architecture to use
        required: false
        default: amd64
      ref:
        description: 'Ref (branch, tag, or SHA) to check out'
        required: false
      path:
        description: 'Path to place the repository'
        required: false
      fetch-depth:
        description: 'Fetch depth (default 0 = full history)'
        required: false
        default: '0'
      submodules:
        description: 'Checkout submodules (true/false/recursive)'
        required: false
        default: 'true'
      app_id:
        description: 'Application ID'
        required: false
      git_ref:
        description: 'Git reference'
        required: false

permissions:
  contents: read

jobs:
  verify-vcpkg:
    name: Verify vcpkg Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate JSON files
        run: |
          echo "=== Validating JSON configuration files ==="
          
          # Check vcpkg.json
          if [ -f "vcpkg.json" ]; then
            if python3 -m json.tool vcpkg.json >/dev/null 2>&1; then
              echo "vcpkg.json is valid JSON"
            else
              echo "ERROR: vcpkg.json is invalid JSON"
              exit 1
            fi
          fi
          
          # Check vcpkg-configuration.json
          if [ -f "vcpkg-configuration.json" ]; then
            if python3 -m json.tool vcpkg-configuration.json >/dev/null 2>&1; then
              echo "vcpkg-configuration.json is valid JSON"
            else
              echo "ERROR: vcpkg-configuration.json is invalid JSON"
              exit 1
            fi
          fi
          
          # Check CMakePresets.json
          if [ -f "CMakePresets.json" ]; then
            if python3 -m json.tool CMakePresets.json >/dev/null 2>&1; then
              echo "CMakePresets.json is valid JSON"
            else
              echo "ERROR: CMakePresets.json is invalid JSON"
              exit 1
            fi
          fi

      - name: Check CMakeLists.txt for required dependencies
        run: |
          echo "=== Checking CMakeLists.txt dependencies ==="
          
          # Check for Qt6
          if grep -q "find_package(Qt6" CMakeLists.txt; then
            echo "Qt6 dependency declared"
          else
            echo "WARNING: Qt6 dependency not found (may be in subdirectory)"
          fi
          
          # Check for minimum CMake version
          if grep -q "cmake_minimum_required" CMakeLists.txt; then
            version=$(grep "cmake_minimum_required" CMakeLists.txt | head -1)
            echo "CMake minimum version: $version"
          fi
          
          # Check for project declaration
          if grep -q "project(" CMakeLists.txt; then
            project=$(grep "project(" CMakeLists.txt | head -1)
            echo "Project declaration: $project"
          fi

      - name: List declared vcpkg dependencies
        if: hashFiles('vcpkg.json') != ''
        run: |
          echo "=== vcpkg Dependencies ==="
          python3 -c "
          import json
          with open('vcpkg.json') as f:
              data = json.load(f)
          deps = data.get('dependencies', [])
          for dep in deps:
              if isinstance(dep, str):
                  print(f'  - {dep}')
              else:
                  name = dep.get('name', 'unknown')
                  features = dep.get('features', [])
                  if features:
                      print(f'  - {name} [{', '.join(features)}]')
                  else:
                      print(f'  - {name}')
          "
