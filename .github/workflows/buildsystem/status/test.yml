name: General Evaluation Process

on:
  workflow_call:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Debug
  workflow_dispatch:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Debug
      version:
        description: Launcher version
        required: false
      artifact-name:
        description: Name of the uploaded artifact
        required: false
        default: Linux
      qt-version:
        description: Version of Qt to use
        required: false
        default: 6.10.0
      qt-architecture:
        description: Qt architecture
        required: false
      gpg-private-key:
        description: Private key for AppImage signing
        required: false
      gpg-private-key-id:
        description: ID for the gpg-private-key, to select the signing key
        required: false
      apple-codesign-cert:
        description: Certificate for signing macOS builds
        required: false
      apple-codesign-password:
        description: Password for signing macOS builds
        required: false
      apple-codesign-id:
        description: Certificate ID for signing macOS builds
        required: false
      apple-notarize-apple-id:
        description: Apple ID used for notarizing macOS builds
        required: false
      apple-notarize-team-id:
        description: Team ID used for notarizing macOS builds
        required: false
      apple-notarize-password:
        description: Password used for notarizing macOS builds
        required: false
      sparkle-ed25519-key:
        description: Private key for signing Sparkle updates
        required: false
      msystem:
        description: MSYS2 subsystem to use
        required: false
      windows-codesign-cert:
        description: Certificate for signing Windows builds
        required: false
      windows-codesign-password:
        description: Password for signing Windows builds
        required: false
      vcvars-arch:
        description: Visual Studio architecture to use
        required: false
        default: amd64
      ref:
        description: 'Ref (branch, tag, or SHA) to check out'
        required: false
      path:
        description: 'Path to place the repository'
        required: false
      fetch-depth:
        description: 'Fetch depth (default 0 = full history)'
        required: false
        default: '0'
      submodules:
        description: 'Checkout submodules (true/false/recursive)'
        required: false
        default: 'true'
      app_id:
        description: 'Application ID'
        required: false
      git_ref:
        description: 'Git reference'
        required: false
      macos-result:
        description: Result of macOS job
        required: false
        type: string
      linux-result:
        description: Result of Linux job
        required: false
        type: string
      linux-arm64-result:
        description: Result of Linux ARM64 job
        required: false
        type: string
      windows-msvc-result:
        description: Result of Windows MSVC job
        required: false
        type: string
      windows-msvc-arm64-result:
        description: Result of Windows MSVC ARM64 job
        required: false
        type: string
      windows-mingw-result:
        description: Result of Windows MinGW job
        required: false
        type: string
      windows-mingw-arm64-result:
        description: Result of Windows MinGW ARM64 job
        required: false
        type: string

permissions:
  contents: read

jobs:
  test-status:
    name: Test Status Report
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Check test results
        id: check-results
        run: |
          echo "## Test Status Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow:** Test" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          macos_tests_result='${{ inputs.macos-result }}'
          linux_tests_result='${{ inputs.linux-result }}'
          linux_arm64_tests_result='${{ inputs.linux-arm64-result }}'
          windows_msvc_tests_result='${{ inputs.windows-msvc-result }}'
          windows_msvc_arm64_tests_result='${{ inputs.windows-msvc-arm64-result }}'
          windows_mingw_tests_result='${{ inputs.windows-mingw-result }}'
          windows_mingw_arm64_tests_result='${{ inputs.windows-mingw-arm64-result }}'

          echo "**macOS Unit Tests:** \`$macos_tests_result\`" >> $GITHUB_STEP_SUMMARY
          echo "**Linux Unit Tests:** \`$linux_tests_result\`" >> $GITHUB_STEP_SUMMARY
          echo "**Linux ARM64 Unit Tests:** \`$linux_tests_result\`" >> $GITHUB_STEP_SUMMARY
          echo "**Windows MSVC Unit Tests:** \`$windows_msvc_tests_result\`" >> $GITHUB_STEP_SUMMARY
          echo "**Windows MSVC ARM64 Unit Tests:** \`$windows_msvc_arm64_tests_result\`" >> $GITHUB_STEP_SUMMARY
          echo "**Windows MinGW Unit Tests:** \`$windows_mingw_tests_result\`" >> $GITHUB_STEP_SUMMARY
          echo "**Windows MinGW ARM64 Unit Tests:** \`$windows_mingw_arm64_tests_result\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "$macos_tests_result" == "failure" ]]; then
            status="failure"
            echo "**macOS Status:** Tests Failed" >> $GITHUB_STEP_SUMMARY
            exit_code=1
          elif [[ "$macos_tests_result" == "cancelled" ]]; then
            status="cancelled"
            echo "**macOS Status:** Tests Cancelled" >> $GITHUB_STEP_SUMMARY
            exit_code=1
          elif [[ "$macos_tests_result" == "success" ]]; then
            status="success"
            echo "**macOS Status:** Tests Successful" >> $GITHUB_STEP_SUMMARY
            exit_code=0
          else
            status="unknown"
            echo "**macOS Status:** Unknown" >> $GITHUB_STEP_SUMMARY
            exit_code=1
          fi

          if [[ "$linux_tests_result" == "failure" ]]; then
            status="failure"
            echo "**Linux Status:** Tests Failed" >> $GITHUB_STEP_SUMMARY
            exit_code=1
          elif [[ "$linux_tests_result" == "cancelled" ]]; then
            status="cancelled"
            echo "**Linux Status:** Tests Cancelled" >> $GITHUB_STEP_SUMMARY
            exit_code=1
          elif [[ "$linux_tests_result" == "success" ]]; then
            status="success"
            echo "**Linux Status:** Tests Successful" >> $GITHUB_STEP_SUMMARY
            exit_code=0
          else
            status="unknown"
            echo "**Linux Status:** Unknown" >> $GITHUB_STEP_SUMMARY
            exit_code=1
          fi
          
          if [[ "$windows_msvc_tests_result" == "failure" ]]; then
            status="failure"
            echo "**Windows MSVC Status:** Tests Failed" >> $GITHUB_STEP_SUMMARY
            exit_code=1
          elif [[ "$windows_msvc_tests_result" == "cancelled" ]]; then
            status="cancelled"
            echo "**Windows MSVC Status:** Tests Cancelled" >> $GITHUB_STEP_SUMMARY
            exit_code=1
          elif [[ "$windows_msvc_tests_result" == "success" ]]; then
            status="success"
            echo "**Windows MSVC Status:** Tests Successful" >> $GITHUB_STEP_SUMMARY
            exit_code=0
          else
            status="unknown"
            echo "**Windows MSVC Status:** Unknown" >> $GITHUB_STEP_SUMMARY
            exit_code=1
          fi

          if [[ "$windows_mingw_tests_result" == "failure" ]]; then
            status="failure"
            echo "**Windows MINGW Status:** Tests Failed" >> $GITHUB_STEP_SUMMARY
            exit_code=1
          elif [[ "$windows_mingw_tests_result" == "cancelled" ]]; then
            status="cancelled"
            echo "**Windows MINGW Status:** Tests Cancelled" >> $GITHUB_STEP_SUMMARY
            exit_code=1
          elif [[ "$windows_mingw_tests_result" == "success" ]]; then
            status="success"
            echo "**Windows MINGW Status:** Tests Successful" >> $GITHUB_STEP_SUMMARY
            exit_code=0
          else
            status="unknown"
            echo "**Windows MINGW Status:** Unknown" >> $GITHUB_STEP_SUMMARY
            exit_code=1
          fi

          if [[ "$windows_msvc_arm64_tests_result" == "failure" ]]; then
            status="failure"
            echo "**Windows MSVC ARM64 Status:** Tests Failed" >> $GITHUB_STEP_SUMMARY
            exit_code=1
          elif [[ "$windows_msvc_arm64_tests_result" == "cancelled" ]]; then
            status="cancelled"
            echo "**Windows MSVC ARM64 Status:** Tests Cancelled" >> $GITHUB_STEP_SUMMARY
            exit_code=1
          elif [[ "$windows_msvc_arm64_tests_result" == "success" ]]; then
            status="success"
            echo "**Windows MSVC ARM64 Status:** Tests Successful" >> $GITHUB_STEP_SUMMARY
            exit_code=0
          else
            status="unknown"
            echo "**Windows MSVC ARM64 Status:** Unknown" >> $GITHUB_STEP_SUMMARY
            exit_code=1
          fi

          if [[ "$windows_mingw_arm64_tests_result" == "failure" ]]; then
            status="failure"
            echo "**Windows MINGW ARM64 Status:** Tests Failed" >> $GITHUB_STEP_SUMMARY
            exit_code=1
          elif [[ "$windows_mingw_arm64_tests_result" == "cancelled" ]]; then
            status="cancelled"
            echo "**Windows MINGW ARM64 Status:** Tests Cancelled" >> $GITHUB_STEP_SUMMARY
            exit_code=1
          elif [[ "$windows_mingw_arm64_tests_result" == "success" ]]; then
            status="success"
            echo "**Windows MINGW ARM64 Status:** Tests Successful" >> $GITHUB_STEP_SUMMARY
            exit_code=0
          else
            status="unknown"
            echo "**Windows MINGW ARM64 Status:** Unknown" >> $GITHUB_STEP_SUMMARY
            exit_code=1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Full Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          
          echo "status=$status" >> $GITHUB_OUTPUT
          exit $exit_code
