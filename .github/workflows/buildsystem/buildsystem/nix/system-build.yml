name: General Evaluation Process

on:
  workflow_call:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Debug
  workflow_dispatch:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Debug
      version:
        description: Launcher version
        required: false
      artifact-name:
        description: Name of the uploaded artifact
        required: false
        default: Linux
      qt-version:
        description: Version of Qt to use
        required: false
        default: 6.10.0
      qt-architecture:
        description: Qt architecture
        required: false
      gpg-private-key:
        description: Private key for AppImage signing
        required: false
      gpg-private-key-id:
        description: ID for the gpg-private-key, to select the signing key
        required: false
      apple-codesign-cert:
        description: Certificate for signing macOS builds
        required: false
      apple-codesign-password:
        description: Password for signing macOS builds
        required: false
      apple-codesign-id:
        description: Certificate ID for signing macOS builds
        required: false
      apple-notarize-apple-id:
        description: Apple ID used for notarizing macOS builds
        required: false
      apple-notarize-team-id:
        description: Team ID used for notarizing macOS builds
        required: false
      apple-notarize-password:
        description: Password used for notarizing macOS builds
        required: false
      sparkle-ed25519-key:
        description: Private key for signing Sparkle updates
        required: false
      msystem:
        description: MSYS2 subsystem to use
        required: false
      windows-codesign-cert:
        description: Certificate for signing Windows builds
        required: false
      windows-codesign-password:
        description: Password for signing Windows builds
        required: false
      vcvars-arch:
        description: Visual Studio architecture to use
        required: false
        default: amd64
      ref:
        description: 'Ref (branch, tag, or SHA) to check out'
        required: false
      path:
        description: 'Path to place the repository'
        required: false
      fetch-depth:
        description: 'Fetch depth (default 0 = full history)'
        required: false
        default: '0'
      submodules:
        description: 'Checkout submodules (true/false/recursive)'
        required: false
        default: 'true'
      app_id:
        description: 'Application ID'
        required: false
      git_ref:
        description: 'Git reference'
        required: false

permissions:
  contents: read

jobs:
  nix-system-build:
    name: Build via Nix (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          - os: macos-latest
            system: aarch64-darwin
    
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build package via Nix (Debug)
        if: github.ref_type != 'tag'
        run: |
          nix build --no-link --print-build-logs .#packages.${{ matrix.system }}.projtlauncher-debug || \
          nix build --no-link --print-build-logs .#projtlauncher

      - name: Build package via Nix (Release)
        if: github.ref_type == 'tag'
        run: |
          nix build --no-link --print-build-logs .#packages.${{ matrix.system }}.projtlauncher || \
          nix build --no-link --print-build-logs .#projtlauncher

      - name: Install package for testing
        run: |
          nix profile install .#packages.${{ matrix.system }}.projtlauncher || \
          nix profile install .#projtlauncher || \
          echo "Package installation skipped or not available"

      - name: Run tests via Nix
        continue-on-error: true
        run: |
          nix build --no-link --print-build-logs .#checks.${{ matrix.system }}.default || \
          echo "No tests defined in flake"

      - name: Build package with result link
        id: build-result
        run: |
          # Build with result link for artifact upload
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            nix build --print-build-logs .#packages.${{ matrix.system }}.projtlauncher -o result || \
            nix build --print-build-logs .#projtlauncher -o result
          else
            nix build --print-build-logs .#packages.${{ matrix.system }}.projtlauncher-debug -o result || \
            nix build --print-build-logs .#projtlauncher -o result
          fi
          
          # Check if result exists
          if [ -L result ]; then
            echo "result-path=$(readlink -f result)" >> $GITHUB_OUTPUT
            echo "has-result=true" >> $GITHUB_OUTPUT
          else
            echo "has-result=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Nix package
        if: steps.build-result.outputs.has-result == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ProjTLauncher-Nix-${{ matrix.system }}-${{ github.sha }}
          path: result/**/*
          retention-days: 7
          if-no-files-found: warn
