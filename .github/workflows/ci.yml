            chost: s390x-linux-gnu
            packages: qemu-system qemu-user gcc-s390x-linux-gnu libc-dev-s390x-cross
            qemu-run: qemu-s390x -L /usr/s390x-linux-gnu
            cflags: -static
            ldflags: -static

          - name: macOS GCC 13
            os: macos-latest
            compiler: gcc-13
            configure-args: --warn

          - name: macOS GCC 14
            os: macos-latest
            compiler: gcc-14
            configure-args: --warn

          - name: macOS GCC 15
            os: macos-latest
            compiler: gcc-15
            configure-args: --warn

          - name: macOS Clang
            os: macos-latest
            compiler: clang
            configure-args: --warn

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install packages (Ubuntu)
      if: runner.os == 'Linux' && matrix.packages
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ matrix.packages }}

    - name: Generate project files
      run: |
        [ -d ${{ matrix.build-dir || '.' }} ] || mkdir ${{ matrix.build-dir || '.' }}
        cd ${{ matrix.build-dir || '.' }}
        ${{ matrix.src-dir || '.' }}/configure ${{ matrix.configure-args }}
      env:
        CC: ${{ matrix.compiler }}
        CFLAGS: ${{ matrix.cflags }}
        LDFLAGS: ${{ matrix.ldflags }}
        CHOST: ${{ matrix.chost }}

    - name: Compile source code
      run: make -j2
      working-directory: ${{ format('zlib/{0}', matrix.build-dir || '.') }}

    - name: Run test cases
      run: |
        make test
        make cover
      working-directory: ${{ format('zlib/{0}', matrix.build-dir || '.') }}
      env:
        QEMU_RUN: ${{ matrix.qemu-run }}

    - name: Upload build errors
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: ${{ matrix.name }} (configure)
        path: |
          ${{ matrix.build-dir || '.' }}/configure.log

  relabel:
    name: Re-apply labels on base change
    needs: [prepare]
    runs-on: ubuntu-latest
    if: >
      (github.event.changes.base.ref.from
        && github.event.changes.base.ref.from != github.event.pull_request.base.ref)
      || contains(needs.prepare.outputs.changed-files, '.github/pull_request_template.md')
    timeout-minutes: 2

    steps:
      - name: Sync labels
        uses: actions/labeler@v6
        with:
          repo-token: ${{ github.token }}
          configuration-path: .github/labeler.yml
          sync-labels: false

  eval:
    name: System Evaluation
    needs: prepare
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.is-schedule != 'true'
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run full evaluation
        id: eval
        env:
          NIX_PATH: nixpkgs=channel:nixos-unstable
        run: |
          set -euo pipefail
          result=$(nix-build --expr '
            let
              pkgs = import <nixpkgs> {};
              evalModule = import ./ci/eval {
                inherit (pkgs) lib runCommand cmake nix jq;
              };
              eval = evalModule {};
            in eval.full
          ')
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Publish evaluation summary
        if: steps.eval.outputs.result != ''
        run: |
          summary="${{ steps.eval.outputs.result }}/summary.md"
          if [ -f "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "CI evaluation succeeded (no summary file)." >> "$GITHUB_STEP_SUMMARY"
          fi

  build-zlib-MSys:
    runs-on: windows-latest
    needs: prepare
    if: needs.prepare.outputs.run-zlib == 'true'
    strategy:
      fail-fast: false
      matrix:
        sys: [mingw32, mingw64, ucrt64, clang64]
    name: MSys - ${{ matrix.sys }}
    defaults:
      run:
        shell: msys2 {0}
        working-directory: zlib
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.sys }}
        update: true
        install: >-
          make
        pacboy: >-
          toolchain:p
          cmake:p
    - name: Configure
      run: |
        cmake -G"Unix Makefiles" \
          -S "$(cygpath -u "$GITHUB_WORKSPACE")/zlib" \
          -B "$(cygpath -u "$GITHUB_WORKSPACE")/zlib/build" \
          -DCMAKE_VERBOSE_MAKEFILE=ON \
          -DCMAKE_BUILD_TYPE=Release \
          -DMINIZIP_ENABLE_BZIP2=ON
    - name: Build
      run: cmake --build "$(cygpath -u "$GITHUB_WORKSPACE")/zlib/build" --config Release
    - name: Run tests
      run: ctest --output-on-failure --test-dir "$(cygpath -u "$GITHUB_WORKSPACE")/zlib/build" -C Release

  build-zlib-cygwin:
    strategy:
      fail-fast: false
    runs-on: windows-latest
    needs: prepare
    if: needs.prepare.outputs.run-zlib == 'true'
    defaults:
      run:
        shell: C:\cygwin\bin\bash.exe --login -o igncr '{0}'
        working-directory: zlib
    name: Cygwin
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup cygwin
      uses: cygwin/cygwin-install-action@master
      with:
        packages: >-
          cmake
          cygwin-devel
          gcc-core
          gcc-g++
          ninja
    - name: Configure
      run: |
        cmake -S "$(cygpath -u "$GITHUB_WORKSPACE")/zlib" \
          -B "$(cygpath -u "$GITHUB_WORKSPACE")/zlib/build" \
          -DCMAKE_BUILD_TYPE=Release \
          -DZLIB_BUILD_MINIZIP=ON \
          -DMINIZIP_ENABLE_BZIP2=OFF \
          -G Ninja
    - name: Build
      run: cmake --build "$(cygpath -u "$GITHUB_WORKSPACE")/zlib/build" --config Release -v -j1
    - name: Run tests
      run: ctest --output-on-failure --test-dir "$(cygpath -u "$GITHUB_WORKSPACE")/zlib/build" -C Release
