  winget:
    name: Winget
    needs: prepare
    if: needs.prepare.outputs.is-release == 'true'
    runs-on: windows-latest

    steps:
      - name: Publish on Winget
        uses: vedantmgoyal2009/winget-releaser@19e706d4c9121098010096f9c495a70a7518b30f
        with:
          identifier: ProjectTick.ProjTLauncher
          version: ${{ github.event.release.tag_name }}
          installers-regex: 'ProjTLauncher-Windows-MSVC(:?-arm64|-Legacy)?-Setup-.+\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}

  process-review:
    needs: prepare
    name: Process Review
    if: needs.prepare.outputs.is-pr-review == 'true' || needs.prepare.outputs.event-name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false
          sparse-checkout: |
            ci/github-script

      - name: Setup Node.js
        uses: actions/setup-node@65d868f8d4d85d7d4abb7de0875cde3fcc8798f5
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd ci/github-script
          npm install
          npm ci --omit=dev

      - name: Process review
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          github-token: ${{ github.token }}
          retries: 3
          script: |
            const { handleMergeComment } = require('./ci/github-script/merge.js');
            
            // Get PR information
            let pull_request;
            
            if (context.eventName === 'workflow_run') {
              // Get PR from workflow run
              const { head_sha, repository } = context.payload.workflow_run;
              
              const prs = await github.rest.pulls.list({
                owner: repository.owner.login,
                repo: repository.name,
                head: `${repository.owner.login}:${head_sha}`,
                state: 'open',
              });
              
              if (prs.data.length === 0) {
                core.info('No open PR found for this commit');
                return;
              }
              
              pull_request = prs.data[0];
            } else if (context.eventName === 'pull_request_review') {
              pull_request = context.payload.pull_request;
              const review = context.payload.review;
              
              // Handle merge command in review
              await handleMergeComment({
                github,
                body: review.body,
                node_id: review.node_id,
                reaction: review.state === 'approved' ? 'ROCKET' : 'EYES',
              });
            }
            
            if (!pull_request) {
              core.info('No PR to process');
              return;
            }
            
            core.info(`Processing review for PR #${pull_request.number}`);
            
            // Update labels based on review state
            const reviews = await github.rest.pulls.listReviews({
              ...context.repo,
              pull_number: pull_request.number,
            });
            
            const hasApproval = reviews.data.some(r => r.state === 'APPROVED');
            const hasChangesRequested = reviews.data.some(r => r.state === 'CHANGES_REQUESTED');
            
            const labelsToAdd = [];
            const labelsToRemove = [];
            
            if (hasApproval && !hasChangesRequested) {
              labelsToAdd.push('40.approved');
              labelsToRemove.push('40.needs-review', '40.changes-requested');
            } else if (hasChangesRequested) {
              labelsToAdd.push('40.changes-requested');
              labelsToRemove.push('40.approved', '40.needs-review');
            } else {
              labelsToAdd.push('40.needs-review');
              labelsToRemove.push('40.approved', '40.changes-requested');
            }
            
            // Apply label changes
            const currentLabels = pull_request.labels.map(l => l.name);
            
            for (const label of labelsToAdd) {
              if (!currentLabels.includes(label)) {
                try {
                  await github.rest.issues.addLabels({
                    ...context.repo,
                    issue_number: pull_request.number,
                    labels: [label],
                  });
                } catch (e) {
                  core.warning(`Could not add label ${label}: ${e.message}`);
                }
              }
            }
            
            for (const label of labelsToRemove) {
              if (currentLabels.includes(label)) {
                try {
                  await github.rest.issues.removeLabel({
                    ...context.repo,
                    issue_number: pull_request.number,
                    name: label,
                  });
                } catch (e) {
                  // Label might not exist
                }
              }
            }
            
            core.info('Review processing complete');

  stale-label:
    timeout-minutes: 5
    name: Label stale issues and PRs
    if: needs.prepare.outputs.schedule-cron == '0 * * * *'
    needs: prepare
    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@a21a0816299b11691f9592ef0d63d08e02f06d9d
        with:
          days-before-stale: 60
          days-before-close: -1 # Don't close anything
          exempt-issue-labels: rfc,nostale,help wanted
          exempt-all-milestones: true
          exempt-all-assignees: true
          operations-per-run: 1000
          stale-issue-label: inactive
          stale-pr-label: inactive

  update-contributors:
    timeout-minutes: 10
    needs: prepare
    if: github.repository_owner == 'Project-Tick' && needs.prepare.outputs.schedule-cron == '0 * * * *'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      
      - name: Configure Git
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Use Node.js
        uses: actions/setup-node@65d868f8d4d85d7d4abb7de0875cde3fcc8798f5

      - uses: pnpm/action-setup@1e1c8eafbd745f64b1ef30a7d7ed7965034c486c
        name: Install pnpm

      - name: Clean working tree before commit
        run: |
          git reset --hard
          git clean -fdx

      - name: Install dependencies & update contributors
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_MEMBERS_TOKEN }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run update-contributors

      - name: Commit files
        run: |
          git config --local user.email "gitbot@yongdohyun.org.tr"
          git config --local user.name "Project-Tick-Bot"
          git add ./website/_data/contributors.json
          git commit -m "chore: Update contributors" || true

      - name: Create PR
        id: cpr
        uses: peter-evans/create-pull-request@2271f1ddcf09437ed8f019733eb5cfba58ac76f0
        with:
          base: "develop"
          branch: "update-contributors"
          delete-branch: false
          title: "chore: Update Contributors"
          body: "Automated pull request to update contributors"

      - name: Enable Pull Request Automerge
        if: steps.cpr.outputs.pull-request-operation == 'created'
        uses: peter-evans/enable-pull-request-automerge@23c09f60046c64f1b0079b44af614bfa411395b9
        with:
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: merge

  update-flake:
    timeout-minutes: 10
    needs: prepare
    if: github.repository_owner == 'Project-Tick' && needs.prepare.outputs.schedule-cron == '0 */5 * * *'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15

      - name: Use PAT
        run: echo "GITHUB_TOKEN=${{ secrets.TOKEN }}" >> $GITHUB_ENV

      - uses: DeterminateSystems/update-flake-lock@2235257b90962ba68499d64da5b0d1eaa3b46c1e
        with:
          commit-msg: "chore(nix): update lockfile"
          pr-title: "chore(nix): update lockfile"
          pr-labels: |
            41.changelog:omit

  # cmark CI tests
  cmark-linter:
    if: needs.prepare.outputs.run-cmark == 'true'
    needs: [prepare]
    defaults:
      run:
        working-directory: cmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install clang-tidy
        run: |
          sudo apt-get install -y clang-tidy
      - name: lint with clang-tidy
        run: |
          make lint
        env:
          CC: clang
          CXX: clang++

  cmark-posix:
    if: needs.prepare.outputs.run-cmark == 'true'
    needs: [prepare]
    defaults:
      run:
        working-directory: cmark
    strategy:
      fail-fast: false
      matrix:
        os: [linux, macos]
        cc: [clang, gcc]
        build_type: [shared, static]
        sanitizers: ['', ASan]
        include:
          - os: 'linux'
            image: 'ubuntu-latest'
          - os: 'macos'
            image: 'macos-latest'
          - cc: 'clang'
            cxx: 'clang++'
          - cc: 'gcc'
            cxx: 'g++'
          - build_type: 'shared'
            cmake_shared: 'YES'
          - build_type: 'static'
            cmake_shared: 'NO'
          - sanitizers: 'ASan'
            san_cflags: '-fsanitize=address,undefined -fno-sanitize-recover=all'
          - sanitizers: 'ASan'
            os: 'linux'
            cc: 'gcc'
            build_type: 'shared'
            test_env: 'LD_PRELOAD=$(gcc -print-file-name=libasan.so)'
          - sanitizers: 'ASan'
            os: 'linux'
            cc: 'clang'
            build_type: 'shared'
            asan_cflags: '-shared-libasan'
            test_env: 'LD_PRELOAD=$(clang -print-file-name=libclang_rt.asan-x86_64.so)'
          - sanitizers: 'ASan'
            build_type: 'shared'
            asan_opts: 'detect_leaks=0'
          - sanitizers: 'ASan'
            cc: 'gcc'
            build_type: 'static'
            asan_cflags: '-static-libasan'
        exclude:
          - os: 'macos'
            cc: 'gcc'
          - os: 'macos'
            sanitizers: 'ASan'
            build_type: 'shared'
    runs-on: ${{ matrix.image }}
    env:
       ASAN_OPTIONS: ${{ matrix.asan_opts }}
       CC: ${{ matrix.cc }}
       CXX: ${{ matrix.cxx }}
       CFLAGS: '${{ matrix.san_cflags }} ${{ matrix.asan_cflags }}'
       CXXFLAGS: '${{ matrix.san_cflags }} ${{ matrix.asan_cflags }}'
    steps:
      - uses: actions/checkout@v6
      - name: Build and test
        run: |
           cmake \
              -DBUILD_SHARED_LIBS=${{ matrix.cmake_shared }} \
              -DCMAKE_BUILD_TYPE=Debug \
              -S . -B build
           cmake --build build
           ${{ matrix.test_env }} ctest --test-dir build --output-on-failure

  cmark-windows:
    if: needs.prepare.outputs.run-cmark == 'true'
    needs: [prepare]
    defaults:
      run:
        working-directory: cmark
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [shared, static]
        include:
          - build_type: 'shared'
            cmake_shared: 'YES'
          - build_type: 'static'
            cmake_shared: 'NO'
    steps:
      - uses: actions/checkout@v6
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build and test
        run: |
          cmake ^
              -DBUILD_SHARED_LIBS=${{ matrix.cmake_shared }} ^
              -DCMAKE_BUILD_TYPE=Debug ^
              -S . -B build
          cmake --build build
          ctest --test-dir build -C Debug --output-on-failure
        shell: cmd
      - name: Upload artifact
        if: ${{ matrix.build_type == 'static' }}
        uses: actions/upload-artifact@v6
        with:
          name: cmark windows ${{ matrix.build_type }}
          path: build/src/Debug/cmark.exe
          if-no-files-found: error

  # toml++ CI tests
  tomlplusplus-linux:
    if: needs.prepare.outputs.run-tomlplusplus == 'true'
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc]
        linker: [lld]
        type: [debug, release]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: tomlplusplus
    env:
      clang_version: "14"
      gcc_version: "11"
    steps:
      - uses: actions/checkout@v3
      - name: Install base dependencies
        run: |
          sudo apt -y update
          sudo apt -y install --no-install-recommends git ninja-build libstdc++-${{ env.gcc_version }}-dev locales-all
      - name: Install python dependencies
        run: |
          pip3 install --user --no-cache-dir --upgrade meson
          pip3 install --user --no-cache-dir --upgrade -r tools/requirements.txt
      - name: Check toml.hpp
        run: |
          cd tools
          python3 ci_single_header_check.py
      - name: Install lld
        if: ${{ startsWith(matrix.linker, 'lld') }}
        run: |
          sudo apt -y install --no-install-recommends lld-${{ env.clang_version }}
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-${{ env.clang_version }} 1000
      - name: Install clang
        if: ${{ startsWith(matrix.compiler, 'clang') }}
        run: |
          sudo apt -y install --no-install-recommends clang-${{ env.clang_version }}
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/clang++-${{ env.clang_version }} 1000
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/clang-${{ env.clang_version }} 1000
      - name: Install gcc
        if: ${{ startsWith(matrix.compiler, 'gcc') }}
        run: |
          sudo apt -y install --no-install-recommends gcc-${{ env.gcc_version }} g++-${{ env.gcc_version }}
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/g++-${{ env.gcc_version }} 1000
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/gcc-${{ env.gcc_version }} 1000
      - name: Configure locales
        run: |
          sudo locale-gen 'en_US.utf8' 'ja_JP.utf8' 'de_DE.utf8' 'it_IT.utf8' 'tr_TR.utf8' 'fi_FI.utf8' 'fr_FR.utf8' 'zh_CN.utf8'
      - name: Configure Meson
        run: |
          CXX=c++ CXX_LD=${{ matrix.linker }} meson setup build --buildtype=${{ matrix.type }} -Ddevel=true -Db_lto=false
      - name: Build
        run: meson compile -C build
      - name: Test
        run: meson test -C build --verbose

  tomlplusplus-windows:
    if: needs.prepare.outputs.run-tomlplusplus == 'true'
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        type: [debug, release]
        permissive: [false, true]
    runs-on: windows-2022
    defaults:
      run:
        shell: cmd
        working-directory: tomlplusplus
    steps:
      - name: Install dependencies
        run: |
          python3 -m pip install -U pip
          pip3 install meson ninja
      - uses: actions/checkout@v3
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure Meson
        run: meson setup build --vsenv --buildtype=${{ matrix.type }} -Ddevel=true -Db_lto=false -Dpermissive=${{ matrix.permissive }}
      - name: Build
        run: meson compile -C build
      - name: Test
        run: meson test -C build --verbose

  # libqrencode configure CI
  libqrencode-configure:
    if: needs.prepare.outputs.run-libqrencode == 'true'
    needs: [prepare]
    defaults:
      run:
        working-directory: libqrencode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: generate configure script
        run: ./autogen.sh
      - name: configure
        run: ./configure --with-tests
      - name: make
        run: make
      - name: make check
        run: make check
      - name: make distcheck
        run: make distcheck

  # libqrencode cmake Windows CI
  libqrencode-cmake-windows:
    if: needs.prepare.outputs.run-libqrencode == 'true'
    needs: [prepare]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: libqrencode
    env:
      BUILD_TYPE: Release
    steps:
      - uses: actions/checkout@v2
      - name: run vcpkg
        uses: lukka/run-vcpkg@v3
        with:
          vcpkgArguments: getopt:x64-windows libiconv:x64-windows libpng:x64-windows
          vcpkgDirectory: '${{ github.workspace }}/libqrencode/vcpkg'
          vcpkgGitCommitId: 'fca18ba3572f8aebe3b8158c359db62a7e26134e'
      - name: Create Build Environment
        run: cmake -E make_directory ${{runner.workspace}}/build
      - name: Configure CMake
        shell: bash
        working-directory: ${{runner.workspace}}/build
        run: cmake $GITHUB_WORKSPACE/libqrencode -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake -DWITH_TESTS=yes
      - name: Build
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: cmake --build . --config $BUILD_TYPE
      - name: Test
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: ctest -C $BUILD_TYPE

  # libqrencode cmake Linux CI
  libqrencode-cmake-linux:
    if: needs.prepare.outputs.run-libqrencode == 'true'
    needs: [prepare]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libqrencode
    env:
      BUILD_TYPE: Release
    steps:
      - uses: actions/checkout@v2
      - name: Create Build Environment
        run: cmake -E make_directory ${{runner.workspace}}/build
      - name: Configure CMake
        shell: bash
        working-directory: ${{runner.workspace}}/build
        run: cmake $GITHUB_WORKSPACE/libqrencode -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DWITH_TESTS=yes -DBUILD_SHARED_LIBS=on
      - name: Build
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: cmake --build . --config $BUILD_TYPE
      - name: Test
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: ctest -C $BUILD_TYPE

  unlock:
    if: (needs.prepare.outputs.is-merge-group == 'true' || needs.prepare.outputs.is-pr == 'true') && always()
    # Modify this list to add or remove jobs from required status checks.
    needs: [prepare]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          RUN_ZLIB: ${{ needs.prepare.outputs.run-zlib }}
          RUN_BZIP2: ${{ needs.prepare.outputs.run-bzip2 }}
          RUN_QUAZIP: ${{ needs.prepare.outputs.run-quazip }}
          RUN_WEBSITE: ${{ needs.prepare.outputs.run-website }}
          RUN_NIX: ${{ needs.prepare.outputs.run-nix }}
          RUN_BOT: ${{ needs.prepare.outputs.run-bot }}
          RUN_META: ${{ needs.prepare.outputs.run-meta }}
          RUN_BRANDING: ${{ needs.prepare.outputs.run-branding }}
          RUN_CMARK: ${{ needs.prepare.outputs.run-cmark }}
          RUN_TOMLPLUSPLUS: ${{ needs.prepare.outputs.run-tomlplusplus }}
          RUN_LIBQRENCODE: ${{ needs.prepare.outputs.run-libqrencode }}
          RUN_RELEASE_BUILD: ${{ needs.prepare.outputs.run-release-build }}
          RUN_REGULAR_BUILD: ${{ needs.prepare.outputs.run-regular-build }}
          SHOULD_BUILD: ${{ needs.prepare.outputs.should-build }}
          SHOULD_TEST: ${{ needs.prepare.outputs.should-test }}
          IS_PR: ${{ needs.prepare.outputs.is-pr }}
          IS_PR_REVIEW: ${{ needs.prepare.outputs.is-pr-review }}
          IS_WORKFLOW_RUN: ${{ needs.prepare.outputs.is-workflow-run }}
          IS_MERGE_GROUP: ${{ needs.prepare.outputs.is-merge-group }}
          IS_SCHEDULE: ${{ needs.prepare.outputs.is-schedule }}
          IS_RELEASE: ${{ needs.prepare.outputs.is-release }}
          IS_PR_CLOSED: ${{ needs.prepare.outputs.is-pr-closed }}
        with:
          script: |
            const { serverUrl, repo, runId, payload, job, eventName } = context;
            const target_url = `${serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${runId}`;

            const runFlags = {
              zlib: process.env.RUN_ZLIB === 'true',
              bzip2: process.env.RUN_BZIP2 === 'true',
              quazip: process.env.RUN_QUAZIP === 'true',
              website: process.env.RUN_WEBSITE === 'true',
              nix: process.env.RUN_NIX === 'true',
              bot: process.env.RUN_BOT === 'true',
              meta: process.env.RUN_META === 'true',
              branding: process.env.RUN_BRANDING === 'true',
              cmark: process.env.RUN_CMARK === 'true',
              tomlplusplus: process.env.RUN_TOMLPLUSPLUS === 'true',
              libqrencode: process.env.RUN_LIBQRENCODE === 'true',
              release_build: process.env.RUN_RELEASE_BUILD === 'true',
              regular_build: process.env.RUN_REGULAR_BUILD === 'true',
              should_build: process.env.SHOULD_BUILD === 'true',
              should_test: process.env.SHOULD_TEST === 'true',
              run_schedule: process.env.RUN_SCHEDULE === 'true' || eventName === 'schedule',
              is_pr: process.env.IS_PR === 'true',
              is_schedule: process.env.IS_SCHEDULE === 'true',
              is_pr_review: process.env.IS_PR_REVIEW === 'true',
              is_workflow_run: process.env.IS_WORKFLOW_RUN === 'true',
              is_release: process.env.IS_RELEASE === 'true',
              is_pr_closed: process.env.IS_PR_CLOSED === 'true',
            };
            const isPr = process.env.IS_PR === 'true';
            const isMergeGroup = process.env.IS_MERGE_GROUP === 'true';

            const slugify = value =>
              (value || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
            const currentJobSlug = slugify(job);
            const currentJobName = process.env.GITHUB_JOB || job;
            const currentJobId = Number(process.env.GITHUB_JOB_ID || 0);

            const listJobs = async () => {
              const jobs = [];
              let page = 1;
              while (true) {
                const res = await github.rest.actions.listJobsForWorkflowRun({
                  owner: repo.owner,
                  repo: repo.repo,
                  run_id: runId,
                  per_page: 100,
                  page,
                });
                jobs.push(...res.data.jobs);
                if (res.data.jobs.length < 100) break;
                page += 1;
              }
              return jobs;
            };

            const waitForJobs = async () => {
              const maxMinutes = 120;
              const intervalMs = 60_000;
              const iterations = Math.ceil((maxMinutes * 60_000) / intervalMs);
              for (let i = 0; i < iterations; i++) {
                const jobs = await listJobs();
                const pending = jobs.filter(j => {
                  const jobSlug = slugify(j.name);
                  const isSelf =
                    jobSlug === currentJobSlug ||
                    j.name === currentJobName ||
                    (currentJobId !== 0 && j.id === currentJobId);
                  return !isSelf && (j.status !== 'completed' || !j.conclusion);
                });
                if (pending.length === 0) {
                  return jobs;
                }
                await new Promise(resolve => setTimeout(resolve, intervalMs));
              }
              return await listJobs();
            };

            const jobs = await waitForJobs();

            // Filter jobs to only keep the latest attempt for each job name.
            // This is crucial because re-running jobs creates new job entries in the API,
            // and we only care about the most recent result.
            const latestJobsMap = new Map();
            for (const j of jobs) {
              const existing = latestJobsMap.get(j.name);
              if (!existing || j.id > existing.id) {
                latestJobsMap.set(j.name, j);
              }
            }
            const latestJobs = Array.from(latestJobsMap.values());

            const statusCounts = { success: 0, failure: 0, cancelled: 0, skipped: 0, neutral: 0, timed_out: 0, action_required: 0, unknown: 0 };
            const failedJobs = [];
            const skippedJobs = [];
            const neutralJobs = [];
            const cancelledJobs = [];
            const timedOutJobs = [];
            const actionRequiredJobs = [];
            const pendingOrMissing = [];
            const failedRequired = [];

            for (const j of latestJobs) {
              const jobSlug = slugify(j.name);
              if (
                jobSlug === currentJobSlug ||
                j.name === currentJobName ||
                (currentJobId !== 0 && j.id === currentJobId)
              )
                continue; // skip self
              const conclusion = j.conclusion || 'unknown';
              if (statusCounts[conclusion] === undefined) statusCounts[conclusion] = 0;
              statusCounts[conclusion] += 1;
              if (conclusion === 'failure') failedJobs.push(j.name);
              else if (conclusion === 'skipped') skippedJobs.push(j.name);
              else if (conclusion === 'neutral') neutralJobs.push(j.name);
              else if (conclusion === 'cancelled') cancelledJobs.push(j.name);
              else if (conclusion === 'timed_out') timedOutJobs.push(j.name);
              else if (conclusion === 'action_required') actionRequiredJobs.push(j.name);
            }

            const isNormalTest = runFlags.should_test && !runFlags.is_schedule && !runFlags.is_release && !runFlags.is_pr_closed;

            const requiredJobs = [
              { name: 'Clang Lint', needed: isNormalTest },
              { name: 'Markdown Lint', needed: isNormalTest },
              { name: 'Bot Smoke', needed: runFlags.bot },
              { name: 'Meta Smoke', needed: runFlags.meta },
              { name: 'Branding Check', needed: runFlags.branding },
              { name: 'Check', needed: isNormalTest && runFlags.is_pr },
              { name: 'Build ProjT Launcher ( DEBUG )', needed: runFlags.regular_build },
              { name: 'Build ProjT Launcher ( RELEASE )', needed: runFlags.release_build && !runFlags.is_pr && !isMergeGroup },
              { name: 'Create Release', needed: runFlags.release_build && !isPr && !isMergeGroup },
              { name: 'Winget', needed: runFlags.release_build && !isPr && !isMergeGroup },
              { name: 'System Evaluation', needed: isNormalTest },
            ];

            for (const req of requiredJobs) {
              if (!req.needed) continue;
              const reqSlug = slugify(req.name);
              
              const matchingJobs = latestJobs.filter(j => {
                const jSlug = slugify(j.name);
                return (
                  jSlug === reqSlug || 
                  jSlug.startsWith(reqSlug + "-") || 
                  j.name === req.name || 
                  j.name.startsWith(req.name + " / ")
                );
              });

              if (matchingJobs.length === 0) {
                pendingOrMissing.push(req.name);
              } else {
                const nonSuccess = matchingJobs.filter(j => 
                  j.conclusion && 
                  j.conclusion !== 'success' && 
                  j.conclusion !== 'skipped' &&
                  j.conclusion !== 'neutral'
                );
                if (nonSuccess.length > 0) {
                  failedRequired.push(req.name);
                }
              }
            }

            const hasFailure =
              failedJobs.length > 0 ||
              timedOutJobs.length > 0 ||
              actionRequiredJobs.length > 0 ||
              pendingOrMissing.length > 0 ||
              failedRequired.length > 0;

            const state = hasFailure ? 'error' : 'success';
            const summaryLines = [
              `- Results: ${JSON.stringify(statusCounts)}`,
              `- Failed jobs: ${failedJobs.length ? failedJobs.join(', ') : 'none'}`,
              `- Timed out jobs: ${timedOutJobs.length ? timedOutJobs.join(', ') : 'none'}`,
              `- Action required jobs: ${actionRequiredJobs.length ? actionRequiredJobs.join(', ') : 'none'}`,
              `- Skipped jobs: ${skippedJobs.length ? skippedJobs.join(', ') : 'none'}`,
              `- Neutral jobs: ${neutralJobs.length ? neutralJobs.join(', ') : 'none'}`,
              `- Cancelled jobs: ${cancelledJobs.length ? cancelledJobs.join(', ') : 'none'}`,
              `- Required jobs not successful: ${failedRequired.length ? failedRequired.join(', ') : 'none'}`,
              `- Pending/missing required jobs: ${pendingOrMissing.length ? pendingOrMissing.join(', ') : 'none'}`,
              `- Run flags: ${JSON.stringify(runFlags)}`,
              `- Decision: ${state === 'success' ? 'no PR failures' : 'failures detected'}`,
            ];

            await core.summary
              .addHeading('Unlock Status')
              .addList(summaryLines)
              .write();

            const sha =
              (payload.merge_group && payload.merge_group.head_sha) ||
              (payload.pull_request && payload.pull_request.head && payload.pull_request.head.sha) ||
              github.sha;

            const isForkPr =
              payload.pull_request &&
              payload.pull_request.head &&
              payload.pull_request.head.repo &&
              payload.pull_request.head.repo.full_name &&
              payload.pull_request.head.repo.full_name.toLowerCase() !== `${repo.owner}/${repo.repo}`.toLowerCase();

            if (!sha) {
              core.warning('No SHA found for status reporting; skipping status update.');
            } else if (isForkPr) {
              console.log("info", "Skipping status update for fork PR (no permissions)", { sha });
            } else {
              await github.rest.repos.createCommitStatus({
                ...repo,
                sha,
                // WARNING:
                // Do NOT change the name of this, otherwise the rule will not catch it anymore.
                // This would prevent all PRs from merging.
                context: 'no PR failures',
                state,
                target_url,
              });
            }
