name: Project Tick CI

on:
  merge_group:
  push:
    tags:
      - "*"
    branches:
      - "develop"
      - "release-*"
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *" # Every hour
    - cron: "30 0 * * *" # Daily at 00:30 UTC
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened, edited, closed]
  release:
    types: [released]
  workflow_run:
    workflows:
      - Reviewed
    types: [completed]
  pull_request_review:
    types: [submitted]
  branch_protection_rule:

concurrency:
  group: ${{ github.event_name == 'schedule'
    && format('projt-schedule-{0}', github.run_id)
    || format('projt-{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare Workflow Context
    runs-on: ubuntu-latest
    outputs:
      should-test: ${{ steps.decide.outputs.should-test }}
      should-build: ${{ steps.decide.outputs.should-build }}
      event-name: ${{ steps.trigger.outputs.event-name }}
      is-pr: ${{ steps.trigger.outputs.is-pr }}
      is-push: ${{ steps.trigger.outputs.is-push }}
      is-tag-push: ${{ steps.trigger.outputs.is-tag-push }}
      is-branch-push: ${{ steps.trigger.outputs.is-branch-push }}
      is-merge-group: ${{ steps.trigger.outputs.is-merge-group }}
      is-dispatch: ${{ steps.trigger.outputs.is-dispatch }}
      is-schedule: ${{ steps.trigger.outputs.is-schedule }}
      is-issue-comment: ${{ steps.trigger.outputs.is-issue-comment }}
      is-release: ${{ steps.trigger.outputs.is-release }}
      is-workflow-run: ${{ steps.trigger.outputs.is-workflow-run }}
      is-pr-review: ${{ steps.trigger.outputs.is-pr-review }}
      is-branch-protection: ${{ steps.trigger.outputs.is-branch-protection }}
      is-pr-closed: ${{ steps.trigger.outputs.is-pr-closed }}
      schedule-cron: ${{ steps.trigger.outputs.schedule-cron }}
      ref-name: ${{ steps.trigger.outputs.ref-name }}
      ref-type: ${{ steps.trigger.outputs.ref-type }}
      build-type: ${{ steps.decide.outputs.build-type }}
      run-release-build: ${{ steps.decide.outputs.run-release-build }}
      run-regular-build: ${{ steps.decide.outputs.run-regular-build }}
      run-zlib: ${{ steps.decide.outputs.run-zlib }}
      run-bzip2: ${{ steps.decide.outputs.run-bzip2 }}
      run-quazip: ${{ steps.decide.outputs.run-quazip }}
      run-website: ${{ steps.decide.outputs.run-website }}
      run-nix: ${{ steps.decide.outputs.run-nix }}
      run-schedule: ${{ steps.decide.outputs.run-schedule }}
      changed-files: ${{ steps.collect.outputs.changed-files }}
      base-ref: ${{ steps.base.outputs.base }}
      head-ref: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine base ref
        id: base
        run: |
          if [ -n "${{ github.event.pull_request.base.sha || '' }}" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before || '' }}" ]; then
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect changed files
        id: collect
        run: |
          base="${{ steps.base.outputs.base }}"
          git fetch --no-tags --prune --depth=200 origin +refs/heads/*:refs/remotes/origin/* || true
          git diff --name-only "$base"...HEAD > changed.txt || true
          changed_files=$(cat changed.txt | tr '\n' ',' | sed 's/,$//')
          echo "changed-files=$changed_files" >> "$GITHUB_OUTPUT"

      - name: Detect trigger context
        id: trigger
        run: |
          event="${{ github.event_name }}"
          action="${{ github.event.action || '' }}"
          ref="${{ github.ref }}"
          ref_name="${{ github.ref_name }}"
          ref_type="${{ github.ref_type }}"
          schedule_cron="${{ github.event.schedule || '' }}"

          is_pr=false
          is_pr_closed=false
          is_push=false
          is_tag_push=false
          is_branch_push=false
          is_merge_group=false
          is_dispatch=false
          is_schedule=false
          is_issue_comment=false
          is_release=false
          is_workflow_run=false
          is_pr_review=false
          is_branch_protection=false

          case "$event" in
            pull_request)
              is_pr=true
              if [ "$action" = "closed" ]; then is_pr_closed=true; fi
              ;;
            push)
              is_push=true
              if [ "$ref_type" = "tag" ]; then is_tag_push=true; else is_branch_push=true; fi
              ;;
            merge_group) is_merge_group=true ;;
            workflow_dispatch) is_dispatch=true ;;
            schedule) is_schedule=true ;;
            issue_comment) is_issue_comment=true ;;
            release) is_release=true ;;
            workflow_run) is_workflow_run=true ;;
            pull_request_review) is_pr_review=true ;;
            branch_protection_rule) is_branch_protection=true ;;
          esac

          {
            echo "event-name=$event"
            echo "ref-name=$ref_name"
            echo "ref-type=$ref_type"
            echo "is-pr=$is_pr"
            echo "is-push=$is_push"
            echo "is-tag-push=$is_tag_push"
            echo "is-branch-push=$is_branch_push"
            echo "is-merge-group=$is_merge_group"
            echo "is-dispatch=$is_dispatch"
            echo "is-schedule=$is_schedule"
            echo "is-issue-comment=$is_issue_comment"
            echo "is-release=$is_release"
            echo "is-workflow-run=$is_workflow_run"
            echo "is-pr-review=$is_pr_review"
            echo "is-branch-protection=$is_branch_protection"
            echo "is-pr-closed=$is_pr_closed"
            echo "schedule-cron=$schedule_cron"
          } >> "$GITHUB_OUTPUT"

      - name: Parse PR scope checklist
        id: scope
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 <<'PY'
          import json, os, re

          event_path = os.environ.get("GITHUB_EVENT_PATH")
          body = ""
          if event_path and os.path.isfile(event_path):
            with open(event_path, "r", encoding="utf-8") as f:
              payload = json.load(f)
              body = payload.get("pull_request", {}).get("body") or ""

          scopes = {
            "launcher": r"- \[[xX]\]\s+Launcher\b",
            "website": r"- \[[xX]\]\s+Website\b",
            "quazip": r"- \[[xX]\]\s+Quazip\b",
            "bzip2": r"- \[[xX]\]\s+bzip2\b",
            "zlib": r"- \[[xX]\]\s+Zlib\b",
            "packages": r"- \[[xX]\]\s+Packages\b",
          }

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
            for key, pattern in scopes.items():
              selected = bool(re.search(pattern, body, flags=re.IGNORECASE))
              f.write(f"{key}={'true' if selected else 'false'}\n")
          PY

      - name: Decide scope
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          IS_PR: ${{ steps.trigger.outputs.is-pr }}
          IS_PUSH: ${{ steps.trigger.outputs.is-push }}
          IS_MERGE_GROUP: ${{ steps.trigger.outputs.is-merge-group }}
          IS_SCHEDULE: ${{ steps.trigger.outputs.is-schedule }}
          IS_TAG: ${{ steps.trigger.outputs.is-tag-push }}
          IS_RELEASE_EVENT: ${{ steps.trigger.outputs.is-release }}
          IS_PR_CLOSED: ${{ steps.trigger.outputs.is-pr-closed }}
          SCOPE_LAUNCHER: ${{ steps.scope.outputs.launcher || 'false' }}
          SCOPE_WEBSITE: ${{ steps.scope.outputs.website || 'false' }}
          SCOPE_QUAZIP: ${{ steps.scope.outputs.quazip || 'false' }}
          SCOPE_BZIP2: ${{ steps.scope.outputs.bzip2 || 'false' }}
          SCOPE_ZLIB: ${{ steps.scope.outputs.zlib || 'false' }}
          SCOPE_PACKAGES: ${{ steps.scope.outputs.packages || 'false' }}
        run: |
          changed="$(cat changed.txt || true)"

          is_pr=false
          if [ -n "${{ github.event.pull_request.number || '' }}" ]; then
            is_pr=true
          fi

          match() {
            echo "$changed" | grep -E "$1" >/dev/null 2>&1
          }

          scope_selected=false
          if [ "$IS_PR" = "true" ] && { [ "$SCOPE_LAUNCHER" = "true" ] || [ "$SCOPE_WEBSITE" = "true" ] || [ "$SCOPE_QUAZIP" = "true" ] || [ "$SCOPE_BZIP2" = "true" ] || [ "$SCOPE_ZLIB" = "true" ] || [ "$SCOPE_PACKAGES" = "true" ]; }; then
            scope_selected=true
          fi

          if [ "$IS_RELEASE_EVENT" = "true" ]; then
            should_test=false
            should_build=false
          elif [ "$IS_PR_CLOSED" = "true" ]; then
            should_test=false
            should_build=false
          elif [ "$IS_SCHEDULE" = "true" ]; then
            should_test=false
            should_build=false
          elif [ "$IS_PUSH" = "true" ] || [ "$IS_MERGE_GROUP" = "true" ]; then
            should_test=true
            should_build=true
          elif $is_pr || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            should_test=true
            should_build=true
          elif [ "$ACTOR" = "dependabot[bot]" ]; then
            should_test=true
            should_build=true
          elif match '^(launcher|libraries|tests|buildconfig|cmake|program_info|zlib|quazip|bzip2)/|CMakeLists.txt|\\.cpp$|\\.h$|\\.ui$'; then
            should_test=true
            should_build=true
          elif $scope_selected; then
            should_test=true
            should_build=true
          else
            should_test=false
            should_build=false
          fi

          run_zlib=false
          run_bzip2=false
          run_quazip=false
          run_website=false
          run_nix=false
          run_schedule=false
          build_type="Debug"
          run_release_build=false
          run_regular_build=false

          if [ "$IS_TAG" = "true" ]; then
            build_type="Release"
          fi

          if [ "$IS_RELEASE_EVENT" = "true" ] || [ "$IS_PR_CLOSED" = "true" ]; then
            # release events are handled elsewhere; do not run component jobs
            :
          elif [ "$IS_PUSH" = "true" ] || [ "$IS_MERGE_GROUP" = "true" ]; then
            # On push/merge_group run everything
            run_zlib=true
            run_bzip2=true
            run_quazip=true
            run_website=true
            run_nix=true
          elif [ "$IS_SCHEDULE" = "true" ]; then
            run_schedule=true
          elif [ "$IS_SCHEDULE" != "true" ]; then
            match '^zlib/' && run_zlib=true
            match '^bzip2/' && run_bzip2=true
            match '^quazip/' && run_quazip=true
            match '^website/' && run_website=true
            match '^flake\.nix$|^shell\.nix$|^nix/' && run_nix=true
          fi

          if [ "$IS_PR" = "true" ]; then
            if [ "$SCOPE_ZLIB" = "true" ]; then run_zlib=true; fi
            if [ "$SCOPE_BZIP2" = "true" ]; then run_bzip2=true; fi
            if [ "$SCOPE_QUAZIP" = "true" ]; then run_quazip=true; fi
            if [ "$SCOPE_WEBSITE" = "true" ]; then run_website=true; fi
            if [ "$SCOPE_PACKAGES" = "true" ]; then run_nix=true; fi
          fi

          if [ "$IS_TAG" = "true" ]; then
            run_release_build=true
          elif [ "$should_build" = "true" ]; then
            run_regular_build=true
          fi

          echo "should-test=$should_test" >> "$GITHUB_OUTPUT"
          echo "should-build=$should_build" >> "$GITHUB_OUTPUT"
          echo "run-zlib=$run_zlib" >> "$GITHUB_OUTPUT"
          echo "run-bzip2=$run_bzip2" >> "$GITHUB_OUTPUT"
          echo "run-quazip=$run_quazip" >> "$GITHUB_OUTPUT"
          echo "run-website=$run_website" >> "$GITHUB_OUTPUT"
          echo "run-nix=$run_nix" >> "$GITHUB_OUTPUT"
          echo "run-schedule=$run_schedule" >> "$GITHUB_OUTPUT"
          echo "build-type=$build_type" >> "$GITHUB_OUTPUT"
          echo "run-release-build=$run_release_build" >> "$GITHUB_OUTPUT"
          echo "run-regular-build=$run_regular_build" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "## Prepare Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Base ref: \`${{ steps.base.outputs.base }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Head ref: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Event: \`${{ steps.trigger.outputs.event-name }}\` (ref: `${{ steps.trigger.outputs.ref-name }}` type: `${{ steps.trigger.outputs.ref-type }}`)" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.trigger.outputs.is-schedule }}" = "true" ]; then
            echo "- Schedule cron: \`${{ steps.trigger.outputs.schedule-cron }}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Trigger flags: pr=${{ steps.trigger.outputs.is-pr }} (closed=${{ steps.trigger.outputs.is-pr-closed }}), push=${{ steps.trigger.outputs.is-push }}, merge_group=${{ steps.trigger.outputs.is-merge-group }}, dispatch=${{ steps.trigger.outputs.is-dispatch }}, schedule=${{ steps.trigger.outputs.is-schedule }}, issue_comment=${{ steps.trigger.outputs.is-issue-comment }}, release=${{ steps.trigger.outputs.is-release }}, workflow_run=${{ steps.trigger.outputs.is-workflow-run }}, pr_review=${{ steps.trigger.outputs.is-pr-review }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Should test: \`${{ steps.decide.outputs.should-test }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Should build: \`${{ steps.decide.outputs.should-build }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build type: \`${{ steps.decide.outputs.build-type }}\` (Release if tag push, else Debug)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run release build: \`${{ steps.decide.outputs.run-release-build }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run regular build: \`${{ steps.decide.outputs.run-regular-build }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run zlib: \`${{ steps.decide.outputs.run-zlib }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run bzip2: \`${{ steps.decide.outputs.run-bzip2 }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run quazip: \`${{ steps.decide.outputs.run-quazip }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run website: \`${{ steps.decide.outputs.run-website }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run nix: \`${{ steps.decide.outputs.run-nix }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run schedule-specific: \`${{ steps.decide.outputs.run-schedule }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.trigger.outputs.is-pr }}" = "true" ]; then
            echo "- Scope flags: launcher=${{ steps.scope.outputs.launcher || 'false' }}, website=${{ steps.scope.outputs.website || 'false' }}, quazip=${{ steps.scope.outputs.quazip || 'false' }}, bzip2=${{ steps.scope.outputs.bzip2 || 'false' }}, zlib=${{ steps.scope.outputs.zlib || 'false' }}, packages=${{ steps.scope.outputs.packages || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Scope flags: n/a (non-PR event)" >> "$GITHUB_STEP_SUMMARY"
          fi

  meta-update:
    name: Update Meta Files
    needs: prepare
    if: needs.prepare.outputs.run-schedule == 'true'
    uses: ./.github/workflows/meta-update.yml
    permissions:
      contents: write
    with:
      ref: ${{ github.sha }}

  build-projt-launcher-debug:
    name: Build ProjT Launcher ( DEBUG )
    needs: prepare
    if: needs.prepare.outputs.run-regular-build == 'true'
    uses: ./.github/workflows/build-projt-launcher.yml
    permissions:
      contents: read
      packages: write
      pages: write
      id-token: write
    with:
      ref: ${{ github.sha }}
      build-type: Debug
      
  build-projt-launcher-release:
    name: Build ProjT Launcher ( RELEASE )
    needs: prepare
    if: needs.prepare.outputs.run-release-build == 'true'
    uses: ./.github/workflows/build-projt-launcher.yml
    permissions:
      contents: read
      packages: write
      pages: write
      id-token: write
    with:
      ref: ${{ github.sha }}
      build-type: Release

  quazip-ubuntu:
    if: true && needs.prepare.outputs.run-quazip == 'true'
    needs: [prepare]
    name: Ubuntu-${{ matrix.os_version }}-Qt-${{ matrix.qt_version }}-shared-${{ matrix.shared }}
    strategy:
      fail-fast: false
      matrix:
        os_version: [22.04, 24.04]
        qt_version: [5.15.2, 6.8.2]
        shared: [ON, OFF]
    uses: ./.github/workflows/reusable.yml
    with:
        runs_on: ubuntu-${{ matrix.os_version }}
        os_version: ${{ matrix.os_version }}
        qt_version: ${{ matrix.qt_version }}
        shared: ${{ matrix.shared }}
        ref: ${{ inputs.ref }}
        working_directory: quazip

  quazip-ubuntu-zlibconst:
    if: true && needs.prepare.outputs.run-quazip == 'true'
    needs: [prepare]
    name: Ubuntu-${{ matrix.os_version }}-Qt-${{ matrix.qt_version }}-shared-zlibconst
    strategy:
      fail-fast: false
      matrix:
        os_version: [ 24.04 ]
        qt_version: [ 6.8.2 ]
    uses: ./.github/workflows/reusable.yml
    with:
      runs_on: ubuntu-${{ matrix.os_version }}
      os_version: ${{ matrix.os_version }}
      qt_version: ${{ matrix.qt_version }}
      shared: "ON"
      zlib_const: "ON"
      ref: ${{ inputs.ref }}
      working_directory: quazip

  quazip-ubuntu-no-qtextcodec:
    if: true && needs.prepare.outputs.run-quazip == 'true'
    needs: [prepare]
    name: Ubuntu-${{ matrix.os_version }}-Qt-${{ matrix.qt_version }}-shared-no-qtextcodec
    strategy:
      fail-fast: true
      matrix:
        os_version: [ 24.04 ]
        qt_version: [ 6.8.2 ]
    uses: ./.github/workflows/reusable.yml
    with:
      runs_on: ubuntu-${{ matrix.os_version }}
      os_version: ${{ matrix.os_version }}
      qt_version: ${{ matrix.qt_version }}
      shared: "ON"
      qtextcodec: 'OFF'
      ref: ${{ inputs.ref }}
      working_directory: quazip

  quazip-macos:
    if: true && needs.prepare.outputs.run-quazip == 'true'
    needs: [prepare]
    name: macos-${{ matrix.os_version }}-Qt-${{ matrix.qt_version }}-shared-${{ matrix.shared }}
    strategy:
      fail-fast: false
      matrix:
        os_version: [15, 14, 15-intel]
        qt_version: [6.8.2, 5.15.2]
        shared: [ON, OFF]
        exclude:
          - os_version: 14
            qt_version: 5.15.2 #Not available due to ARM arch
          - os_version: 15
            qt_version: 5.15.2 #Not available due to ARM arch
    uses: ./.github/workflows/reusable.yml
    with:
      runs_on: macos-${{ matrix.os_version }}
      os_version: ${{ matrix.os_version }}
      qt_version: ${{ matrix.qt_version }}
      shared: ${{ matrix.shared }}
      ref: ${{ inputs.ref }}
      working_directory: quazip

  quazip-alpine:
    if: true && needs.prepare.outputs.run-quazip == 'true'
    needs: [prepare]
    name: "${{ matrix.qt_version }} on ${{ matrix.runner }}"
    runs-on: "ubuntu-22.04"
    container:
      image: "${{ matrix.runner }}"
    strategy:
      matrix:
        runner:
          - "alpine:3.21"
        qt_version:
          - "qt5"
          - "qt6"
    env:
      DEBIAN_FRONTEND: noninteractive
      TEST_ZIP_UNZIP_LARGE: true
    steps:
      - name: Show OS info
        run: cat /etc/os-release
      - uses: actions/checkout@v4

      - name: Install build tools
        working-directory: quazip
        run: apk add --update g++ make cmake ${{ matrix.qt_version }}-qtbase-dev
      - name: Install compat
        if: ${{ matrix.qt_version == 'qt6' }}
        working-directory: quazip
        run: apk add qt6-qt5compat-dev
      - name: Show cmake version
        working-directory: quazip
        run: cmake --version
      - name: Run cmake
        working-directory: quazip
        run: cmake -B build -DQUAZIP_ENABLE_TESTS=ON
      - name: Build quazip
        working-directory: quazip
        run: cd build && VERBOSE=1 make -j8
      - name: Build tests
        working-directory: quazip
        run: cd build/qztest && VERBOSE=1 make -j8
      - name: Run tests
        working-directory: quazip
        run: build/qztest/qztest

  quazip-windows-x64:
    if: true && needs.prepare.outputs.run-quazip == 'true'
    needs: [prepare]
    name: Win-Qt-${{ matrix.qt_version }}-preset-${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        preset: [ conan, vcpkg ]
        qt_version: [ 5.15.2, 6.8.2 ]
    uses: ./.github/workflows/reusable-win.yml
    with:
      runs_on: "win-x64"
      arch: x64
      qt_version: ${{ matrix.qt_version }}
      preset: ${{ matrix.preset }}
      pe_str: "x86-64"
      ref: ${{ inputs.ref }}
      working_directory: quazip

  quazip-windows-x86:
    if: true && needs.prepare.outputs.run-quazip == 'true'
    needs: [prepare]
    name: Win-Qt-${{ matrix.qt_version }}-preset-${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        preset: [ conan_x86, vcpkg_x86 ]
        qt_version: [ 5.15.2 ]
    uses: ./.github/workflows/reusable-win.yml
    with:
      runs_on: "win-x86"
      arch: x86
      qt_version: ${{ matrix.qt_version }}
      preset: ${{ matrix.preset }}
      pe_str: "i386"
      ref: ${{ inputs.ref }}
      working_directory: quazip

  quazip-ubuntu-ci-extract:
    if: true && needs.prepare.outputs.run-quazip == 'true'
    name: extract-Ubuntu-${{ matrix.os_version }}-Qt-${{ matrix.qt_version }}-shared-${{ matrix.shared }}
    strategy:
      fail-fast: false
      matrix:
        os_version: [ 24.04 ]
        qt_version: [ 6.8.2 ]
        shared: [ ON ]
    uses: ./.github/workflows/reusable.yml
    needs: [ quazip-ubuntu, quazip-macos, quazip-windows-x64, quazip-windows-x86 ]
    with:
      runs_on: ubuntu-${{ matrix.os_version }}
      os_version: ${{ matrix.os_version }}
      qt_version: ${{ matrix.qt_version }}
      shared: ${{ matrix.shared }}
      cross_extract: true
      ref: ${{ inputs.ref }}
      working_directory: quazip

  quazip-macos-ci-extract:
    if: true && needs.prepare.outputs.run-quazip == 'true'
    name: extract-macos-${{ matrix.os_version }}-Qt-${{ matrix.qt_version }}-shared-${{ matrix.shared }}
    strategy:
      fail-fast: false
      matrix:
        os_version: [ 15 ]
        qt_version: [ 6.8.2 ]
        shared: [ ON ]
    uses: ./.github/workflows/reusable.yml
    needs: [ quazip-ubuntu, quazip-macos, quazip-windows-x64, quazip-windows-x86 ]
    with:
      runs_on: macos-${{ matrix.os_version }}
      os_version: ${{ matrix.os_version }}
      qt_version: ${{ matrix.qt_version }}
      shared: ${{ matrix.shared }}
      cross_extract: true
      ref: ${{ inputs.ref }}
      working_directory: quazip

  quazip-windows-x64-ci-extract:
    if: true && needs.prepare.outputs.run-quazip == 'true'
    name: extract-Win-Qt-${{ matrix.qt_version }}-preset-${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        preset: [ vcpkg ]
        qt_version: [ 6.8.2 ]
    uses: ./.github/workflows/reusable-win.yml
    needs: [ quazip-ubuntu, quazip-macos, quazip-windows-x64, quazip-windows-x86 ]
    with:
      runs_on: "win-x64"
      arch: x64
      qt_version: ${{ matrix.qt_version }}
      preset: ${{ matrix.preset }}
      pe_str: "x86-64"
      cross_extract: true
      ref: ${{ inputs.ref }}
      working_directory: quazip

  quazip-fedora:
    if: true && needs.prepare.outputs.run-quazip == 'true'
    name: "${{ matrix.qt_version }} on ${{ matrix.runner }}"
    runs-on: "ubuntu-22.04"
    defaults:
      run:
        working-directory: quazip
    container:
      image: "${{ matrix.runner }}"
    strategy:
      matrix:
        runner:
          - "fedora:42"
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: dnf -y install g++ make cmake qt6-qtbase-devel qt6-qt5compat-devel zlib-ng-devel zlib-ng-compat-devel
      - name: Run cmake
        run: cmake -B build -DQUAZIP_ENABLE_TESTS=ON
      - name: Build quazip
        run: cd build && VERBOSE=1 make -j8
      - name: Run tests
        run: build/qztest/qztest

  build-quazip-use-qt-zlib-ubuntu:
    env:
      BUILD_TYPE: Release
    if: true && needs.prepare.outputs.run-quazip == 'true'
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: quazip
    name: use-qt-zlib-ubuntu-${{ matrix.qt_version }}
    container: ghcr.io/cen1/qt:${{ matrix.qt_version }}
    strategy:
      fail-fast: false
      matrix:
        qt_version: [ 5.15.12, 6.4.3, 6.8.2 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -DCMAKE_BUILD_TYPE="${{env.BUILD_TYPE}}" -DBUILD_SHARED_LIBS=OFF -DQUAZIP_ENABLE_TESTS=ON -DQUAZIP_USE_QT_ZLIB=ON -DCMAKE_PREFIX_PATH="/usr/local/Qt-${{ matrix.qt_version }}" -B build

      - name: Build
        run: cmake --build build --config ${{env.BUILD_TYPE}}

      - name: Run tests
        working-directory: ${{ github.workspace }}/quazip/build
        run: ctest --verbose -C Release

  build-quazip-use-qt6-zlib-windows:
    if: true && needs.prepare.outputs.run-quazip == 'true'
    env:
      BUILD_TYPE: Release
    runs-on: windows-latest
    defaults:
      run:
        working-directory: quazip
    name: use-qt6-zlib-windows-${{ matrix.qt_version }}
    strategy:
      fail-fast: false
      matrix:
        qt_version: [ 6.8.2 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: TheMrMilchmann/setup-msvc-dev@v3
        with:
          arch: x64

      - name: Restore Qt build cache
        id: cache-qt-restore
        uses: actions/cache@v4
        with:
          key: windows-qt-${{ matrix.qt_version }}
          path: qt-everywhere-src-${{ matrix.qt_version }}

      - name: Restore Qt zip
        if: steps.cache-qt-restore.outputs.cache-hit != 'true'
        id: cache-qt-zip-restore
        uses: actions/cache@v4
        with:
          key: windows-qt-${{ matrix.qt_version }}-zip
          path: qt-everywhere-src-${{ matrix.qt_version }}.zip

      - name: Download Qt 6
        if: steps.cache-qt-restore.outputs.cache-hit != 'true' && steps.cache-qt-zip-restore.outputs.cache-hit != 'true'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          curl https://ftp.fau.de/qtproject/archive/qt/6.8/${{ matrix.qt_version }}/single/qt-everywhere-src-${{ matrix.qt_version }}.zip --output qt-everywhere-src-${{ matrix.qt_version }}.zip

      - name: Save Qt zip
        if: steps.cache-qt-restore.outputs.cache-hit != 'true' && steps.cache-qt-zip-restore.outputs.cache-hit != 'true'
        id: cache-qt-zip-save
        uses: actions/cache/save@v4
        with:
          path: qt-everywhere-src-${{ matrix.qt_version }}.zip
          key: windows-qt-${{ matrix.qt_version }}-zip

      - name: Extract Qt zip
        if: steps.cache-qt-restore.outputs.cache-hit != 'true'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf qt-everywhere-src-${{ matrix.qt_version }}
          unzip -oq qt-everywhere-src-${{ matrix.qt_version }}.zip
          ls -la

      - name: Configure Qt
        if: steps.cache-qt-restore.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: qt-everywhere-src-${{ matrix.qt_version }}
        run: ./configure.bat -prefix "${{github.workspace}}/Qt" -qt-zlib ^
          -static ^
          -opensource ^
          -confirm-license ^
          -optimize-size ^
          -nomake examples ^
          -nomake tests ^
          -no-dbus ^
          -no-icu ^
          -no-fontconfig ^
          -no-opengl ^
          -no-openssl ^
          -no-gui ^
          -skip qtconnectivity ^
          -skip qtdatavis3d ^
          -skip qtdeclarative ^
          -skip qtdoc ^
          -skip qtactiveqt ^
          -skip qt3d ^
          -skip qtgraphs ^
          -skip qtgrpc ^
          -skip qtimageformats ^
          -skip qtlanguageserver ^
          -skip qtlocation ^
          -skip qthttpserver ^
          -skip qtmultimedia ^
          -skip qtopcua ^
          -skip qtpositioning ^
          -skip qtremoteobjects ^
          -skip qtscxml ^
          -skip qtsensors ^
          -skip qtserialbus ^
          -skip qtserialport ^
          -skip qtshadertools ^
          -skip qtspeech ^
          -skip qtsvg ^
          -skip qttools ^
          -skip qttranslations ^
          -skip qtwebchannel ^
          -skip qtwebengine ^
          -skip qtwebsockets ^
          -skip qtwebview ^
          -skip qtcharts ^
          -skip qtcoap ^
          -skip qtlottie ^
          -skip qtmqtt ^
          -skip qtnetworkauth ^
          -skip qtquick3d ^
          -skip qtquick3dphysics ^
          -skip qtquickeffectmaker ^
          -skip qtquicktimeline ^
          -skip qtvirtualkeyboard ^
          -skip qtwayland ^
          -skip qtcanvas3d ^
          -skip qtgamepad ^
          -skip qtpurchasing ^
          -skip qtscript

      - name: Build Qt
        if: steps.cache-qt-restore.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: qt-everywhere-src-${{ matrix.qt_version }}
        run: cmake --build . --parallel

      - name: Cache Qt
        if: steps.cache-qt-restore.outputs.cache-hit != 'true'
        id: cache-qt
        uses: actions/cache/save@v4
        with:
          path: qt-everywhere-src-${{ matrix.qt_version }}
          key: windows-qt-${{ matrix.qt_version }}

      - name: Install Qt
        shell: cmd
        working-directory: qt-everywhere-src-${{ matrix.qt_version }}
        run: cmake --install .

      - name: Configure CMake
        run: cmake -DCMAKE_BUILD_TYPE="${{env.BUILD_TYPE}}" -DQUAZIP_QT_MAJOR_VERSION=6 -DBUILD_SHARED_LIBS=OFF -DQUAZIP_ENABLE_TESTS=ON -DQUAZIP_USE_QT_ZLIB=ON -B "${{github.workspace}}/build" -DCMAKE_PREFIX_PATH="${{github.workspace}}\Qt"

      - name: Build
        shell: cmd
        working-directory: ${{github.workspace}}\build
        run: cmake --build . --config ${{env.BUILD_TYPE}}

      - name: Run tests
        shell: cmd
        working-directory: ${{github.workspace}}\build
        run: ctest --verbose --output-on-failure -C Release

