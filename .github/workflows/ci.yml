  build-zlib-MSys:
    timeout-minutes: 10
    runs-on: windows-latest
    needs: prepare
    if: needs.prepare.outputs.run-zlib == 'true'
    strategy:
      fail-fast: false
      matrix:
        sys: [mingw32, mingw64, ucrt64, clang64]
    name: MSys - ${{ matrix.sys }}
    defaults:
      run:
        shell: msys2 {0}
        working-directory: zlib
    steps:
    - name: Checkout
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      with:
        fetch-depth: 0
    - name: Setup MSYS2
      uses: msys2/setup-msys2@4f806de0a5a7294ffabaff804b38a9b435a73bda
      with:
        msystem: ${{ matrix.sys }}
        update: true
        install: >-
          make
        pacboy: >-
          toolchain:p
          cmake:p
    - name: Configure
      run: |
        rm -rf "$(cygpath -u "$GITHUB_WORKSPACE")/zlib/build"
        cmake -G"Unix Makefiles" \
          -S "$(cygpath -u "$GITHUB_WORKSPACE")/zlib" \
          -B "$(cygpath -u "$GITHUB_WORKSPACE")/zlib/build" \
          -DCMAKE_VERBOSE_MAKEFILE=ON \
          -DCMAKE_BUILD_TYPE=Release \
          -DMINIZIP_ENABLE_BZIP2=ON \
          -DCMAKE_C_FLAGS="" \
          -DCMAKE_CXX_FLAGS=""
    - name: Build
      run: cmake --build "$(cygpath -u "$GITHUB_WORKSPACE")/zlib/build" --config Release
    - name: Run tests
      run: ctest --output-on-failure --test-dir "$(cygpath -u "$GITHUB_WORKSPACE")/zlib/build" -C Release

  build-zlib-cygwin:
    timeout-minutes: 10
    strategy:
      fail-fast: false
    runs-on: windows-latest
    needs: prepare
    if: needs.prepare.outputs.run-zlib == 'true'
    defaults:
      run:
        shell: C:\cygwin\bin\bash.exe --login -o igncr '{0}'
        working-directory: zlib
    name: Cygwin
    steps:
    - name: Checkout
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      with:
        fetch-depth: 0
    - name: Setup cygwin
      uses: cygwin/cygwin-install-action@7d2dc1e241644c3318bed9ec74115d1929baa681
      with:
        packages: >-
          cmake
          cygwin-devel
          gcc-core
          gcc-g++
          ninja
    - name: Configure
      run: |
        rm -rf "$(cygpath -u "$GITHUB_WORKSPACE")/zlib/build"
        cmake -S "$(cygpath -u "$GITHUB_WORKSPACE")/zlib" \
          -B "$(cygpath -u "$GITHUB_WORKSPACE")/zlib/build" \
          -DCMAKE_BUILD_TYPE=Release \
          -DZLIB_BUILD_MINIZIP=ON \
          -DMINIZIP_ENABLE_BZIP2=OFF \
          -DCMAKE_C_FLAGS="" \
          -DCMAKE_CXX_FLAGS="" \
          -G Ninja
    - name: Build
      run: cmake --build "$(cygpath -u "$GITHUB_WORKSPACE")/zlib/build" --config Release -v -j1
    - name: Run tests
      run: ctest --output-on-failure --test-dir "$(cygpath -u "$GITHUB_WORKSPACE")/zlib/build" -C Release

  winget:
    name: Winget
    needs: prepare
    if: needs.prepare.outputs.is-release == 'true'
    runs-on: windows-latest

    steps:
      - name: Publish on Winget
        uses: vedantmgoyal2009/winget-releaser@19e706d4c9121098010096f9c495a70a7518b30f
        with:
          identifier: ProjectTick.ProjTLauncher
          version: ${{ github.event.release.tag_name }}
          installers-regex: 'ProjTLauncher-Windows-MSVC(:?-arm64|-Legacy)?-Setup-.+\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}

  update-contributors:
    timeout-minutes: 10
    needs: prepare
    if: github.repository_owner == 'Project-Tick' && needs.prepare.outputs.schedule-cron == '0 * * * *'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Use Node.js
        uses: actions/setup-node@65d868f8d4d85d7d4abb7de0875cde3fcc8798f5

      - uses: pnpm/action-setup@1e1c8eafbd745f64b1ef30a7d7ed7965034c486c
        name: Install pnpm

      - name: Install dependencies & update contributors
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_MEMBERS_TOKEN }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run update-contributors

      - name: Commit files
        run: |
          git config --local user.email "gitbot@yongdohyun.org.tr"
          git config --local user.name "Project-Tick-Bot"
          git add :/
          git commit -m "chore: Update contributors" || true

      - name: Create PR
        id: cpr
        uses: peter-evans/create-pull-request@2271f1ddcf09437ed8f019733eb5cfba58ac76f0
        with:
          base: "develop"
          branch: "update-contributors"
          delete-branch: false
          title: "chore: Update Contributors"
          body: "Automated pull request to update contributors"

      - name: Enable Pull Request Automerge
        if: steps.cpr.outputs.pull-request-operation == 'created'
        uses: peter-evans/enable-pull-request-automerge@23c09f60046c64f1b0079b44af614bfa411395b9
        with:
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: merge

  update-flake:
    timeout-minutes: 10
    needs: prepare
    if: github.repository_owner == 'Project-Tick' && needs.prepare.outputs.schedule-cron == '0 */5 * * *'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15

      - name: Use PAT
        run: echo "GITHUB_TOKEN=${{ secrets.TOKEN }}" >> $GITHUB_ENV

      - uses: DeterminateSystems/update-flake-lock@2235257b90962ba68499d64da5b0d1eaa3b46c1e
        with:
          commit-msg: "chore(nix): update lockfile"
          pr-title: "chore(nix): update lockfile"
          pr-labels: |
            41.changelog:omit
