name: Project Tick Infra

on:
  push:
    tags:
      - "*"
    branches:
      - "develop"
      - "release-*"
  workflow_dispatch:
  release:
    types: [released]

concurrency:
  group: ${{ (github.event_name == 'schedule' || github.event_name == 'merge_group')
    && format('projt-infra-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: true

env:
  NODE_NO_WARNINGS: 1

jobs:
  prepare:
    timeout-minutes: 5
    name: Prepare Workflow Context
    runs-on: ubuntu-latest
    outputs:
      should-test: ${{ steps.decide.outputs.should-test }}
      should-build: ${{ steps.decide.outputs.should-build }}
      event-name: ${{ steps.trigger.outputs.event-name }}
      is-pr: ${{ steps.trigger.outputs.is-pr }}
      is-push: ${{ steps.trigger.outputs.is-push }}
      is-tag-push: ${{ steps.trigger.outputs.is-tag-push }}
      is-branch-push: ${{ steps.trigger.outputs.is-branch-push }}
      is-merge-group: ${{ steps.trigger.outputs.is-merge-group }}
      is-dispatch: ${{ steps.trigger.outputs.is-dispatch }}
      is-schedule: ${{ steps.trigger.outputs.is-schedule }}
      is-issue-comment: ${{ steps.trigger.outputs.is-issue-comment }}
      is-release: ${{ steps.trigger.outputs.is-release }}
      is-workflow-run: ${{ steps.trigger.outputs.is-workflow-run }}
      is-pr-review: ${{ steps.trigger.outputs.is-pr-review }}
      is-branch-protection: ${{ steps.trigger.outputs.is-branch-protection }}
      is-pr-closed: ${{ steps.trigger.outputs.is-pr-closed }}
      schedule-cron: ${{ steps.trigger.outputs.schedule-cron }}
      ref-name: ${{ steps.trigger.outputs.ref-name }}
      ref-type: ${{ steps.trigger.outputs.ref-type }}
      build-type: ${{ steps.decide.outputs.build-type }}
      run-release-build: ${{ steps.decide.outputs.run-release-build }}
      run-regular-build: ${{ steps.decide.outputs.run-regular-build }}
      run-zlib: ${{ steps.decide.outputs.run-zlib }}
      run-bzip2: ${{ steps.decide.outputs.run-bzip2 }}
      run-quazip: ${{ steps.decide.outputs.run-quazip }}
      run-website: ${{ steps.decide.outputs.run-website }}
      run-nix: ${{ steps.decide.outputs.run-nix }}
      run-bot: ${{ steps.decide.outputs.run-bot }}
      run-meta: ${{ steps.decide.outputs.run-meta }}
      run-branding: ${{ steps.decide.outputs.run-branding }}
      run-schedule: ${{ steps.decide.outputs.run-schedule }}
      dominant-scope: ${{ steps.decide.outputs.dominant-scope }}
      changed-files: ${{ steps.collect.outputs.changed-files }}
      base-ref: ${{ steps.base.outputs.base }}
      head-ref: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0

      - name: Determine base ref
        id: base
        run: |
          if [ -n "${{ github.event.pull_request.base.sha || '' }}" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before || '' }}" ]; then
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect changed files
        id: collect
        run: |
          base="${{ steps.base.outputs.base }}"
          git fetch --no-tags --prune --depth=200 origin +refs/heads/*:refs/remotes/origin/* || true
          git diff --name-only "$base"...HEAD > changed.txt || true
          changed_files=$(cat changed.txt | tr '\n' ',' | sed 's/,$//')
          echo "changed-files=$changed_files" >> "$GITHUB_OUTPUT"

      - name: Detect trigger context
        id: trigger
        run: |
          event="${{ github.event_name }}"
          action="${{ github.event.action || '' }}"
          ref="${{ github.ref }}"
          ref_name="${{ github.ref_name }}"
          ref_type="${{ github.ref_type }}"
          schedule_cron="${{ github.event.schedule || '' }}"

          is_pr=false
          is_pr_closed=false
          is_push=false
          is_tag_push=false
          is_branch_push=false
          is_merge_group=false
          is_dispatch=false
          is_schedule=false
          is_issue_comment=false
          is_release=false
          is_workflow_run=false
          is_pr_review=false
          is_branch_protection=false

          case "$event" in
            pull_request)
              is_pr=true
              if [ "$action" = "closed" ]; then is_pr_closed=true; fi
              ;;
            push)
              is_push=true
              if [ "$ref_type" = "tag" ]; then is_tag_push=true; else is_branch_push=true; fi
              ;;
            merge_group) is_merge_group=true ;;
            workflow_dispatch) is_dispatch=true ;;
            schedule) is_schedule=true ;;
            issue_comment) is_issue_comment=true ;;
            release) is_release=true ;;
            workflow_run) is_workflow_run=true ;;
            pull_request_review) is_pr_review=true ;;
            branch_protection_rule) is_branch_protection=true ;;
          esac

          {
            echo "event-name=$event"
            echo "ref-name=$ref_name"
            echo "ref-type=$ref_type"
            echo "is-pr=$is_pr"
            echo "is-push=$is_push"
            echo "is-tag-push=$is_tag_push"
            echo "is-branch-push=$is_branch_push"
            echo "is-merge-group=$is_merge_group"
            echo "is-dispatch=$is_dispatch"
            echo "is-schedule=$is_schedule"
            echo "is-issue-comment=$is_issue_comment"
            echo "is-release=$is_release"
            echo "is-workflow-run=$is_workflow_run"
            echo "is-pr-review=$is_pr_review"
            echo "is-branch-protection=$is_branch_protection"
            echo "is-pr-closed=$is_pr_closed"
            echo "schedule-cron=$schedule_cron"
          } >> "$GITHUB_OUTPUT"

      - name: Parse PR scope checklist
        id: scope
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 <<'PY'
          import json, os, re

          event_path = os.environ.get("GITHUB_EVENT_PATH")
          body = ""
          if event_path and os.path.isfile(event_path):
            with open(event_path, "r", encoding="utf-8") as f:
              payload = json.load(f)
              body = payload.get("pull_request", {}).get("body") or ""

          scope_body = body
          m = re.search(r"##\s*Scope\s*(.*?)(?:\n##\s|\Z)", body, flags=re.IGNORECASE | re.DOTALL)
          if m:
            scope_body = m.group(1)

          scopes = {
            "launcher": r"- \[[xX]\]\s+Launcher\b",
            "website": r"- \[[xX]\]\s+Website\b",
            "bot": r"- \[[xX]\]\s+Bot\b",
            "meta": r"- \[[xX]\]\s+Metadata Generator\b",
            "quazip": r"- \[[xX]\]\s+Quazip\b",
            "bzip2": r"- \[[xX]\]\s+bzip2\b",
            "zlib": r"- \[[xX]\]\s+Zlib\b",
            "packages": r"- \[[xX]\]\s+Packages\b",
            "docs": r"- \[[xX]\]\s+Docs\b",
            "tools": r"- \[[xX]\]\s+Tools\b",
            "ci": r"- \[[xX]\]\s+CI\b",
            "branding": r"- \[[xX]\]\s+Branding\b",
            "launcherjava": r"- \[[xX]\]\s+Launcher Java System\b",
            "javacheck": r"- \[[xX]\]\s+JavaCheck\b",
            "libnbtplusplus": r"- \[[xX]\]\s+libnbtplusplus\b",
          }

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
            for key, pattern in scopes.items():
              selected = bool(re.search(pattern, scope_body, flags=re.IGNORECASE))
              f.write(f"{key}={'true' if selected else 'false'}\n")
          PY

      - name: Decide scope
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          IS_PR: ${{ steps.trigger.outputs.is-pr }}
          IS_PUSH: ${{ steps.trigger.outputs.is-push }}
          IS_MERGE_GROUP: ${{ steps.trigger.outputs.is-merge-group }}
          IS_SCHEDULE: ${{ steps.trigger.outputs.is-schedule }}
          IS_TAG: ${{ steps.trigger.outputs.is-tag-push }}
          IS_RELEASE_EVENT: ${{ steps.trigger.outputs.is-release }}
          IS_PR_CLOSED: ${{ steps.trigger.outputs.is-pr-closed }}
          SCOPE_LAUNCHER: ${{ steps.scope.outputs.launcher || 'false' }}
          SCOPE_WEBSITE: ${{ steps.scope.outputs.website || 'false' }}
          SCOPE_BOT: ${{ steps.scope.outputs.bot || 'false' }}
          SCOPE_META: ${{ steps.scope.outputs.meta || 'false' }}
          SCOPE_QUAZIP: ${{ steps.scope.outputs.quazip || 'false' }}
          SCOPE_BZIP2: ${{ steps.scope.outputs.bzip2 || 'false' }}
          SCOPE_ZLIB: ${{ steps.scope.outputs.zlib || 'false' }}
          SCOPE_PACKAGES: ${{ steps.scope.outputs.packages || 'false' }}
          SCOPE_DOCS: ${{ steps.scope.outputs.docs || 'false' }}
          SCOPE_TOOLS: ${{ steps.scope.outputs.tools || 'false' }}
          SCOPE_CI: ${{ steps.scope.outputs.ci || 'false' }}
          SCOPE_BRANDING: ${{ steps.scope.outputs.branding || 'false' }}
          SCOPE_LAUNCHERJAVA: ${{ steps.scope.outputs.launcherjava || 'false' }}
          SCOPE_JAVACHECK: ${{ steps.scope.outputs.javacheck || 'false' }}
          SCOPE_LIBNBT: ${{ steps.scope.outputs.libnbtplusplus || 'false' }}
        run: |
          changed="$(cat changed.txt || true)"

          is_pr=false
          if [ -n "${{ github.event.pull_request.number || '' }}" ]; then
            is_pr=true
          fi

          match() {
            echo "$changed" | grep -E "$1" >/dev/null 2>&1
          }

          scope_selected=false
          if [ "$IS_PR" = "true" ] && { [ "$SCOPE_LAUNCHER" = "true" ] || [ "$SCOPE_WEBSITE" = "true" ] || [ "$SCOPE_BOT" = "true" ] || [ "$SCOPE_META" = "true" ] || [ "$SCOPE_QUAZIP" = "true" ] || [ "$SCOPE_BZIP2" = "true" ] || [ "$SCOPE_ZLIB" = "true" ] || [ "$SCOPE_PACKAGES" = "true" ] || [ "$SCOPE_DOCS" = "true" ] || [ "$SCOPE_TOOLS" = "true" ] || [ "$SCOPE_CI" = "true" ] || [ "$SCOPE_BRANDING" = "true" ]; }; then
            scope_selected=true
          fi

          if [ "$IS_RELEASE_EVENT" = "true" ]; then
            should_test=false
            should_build=false
          elif [ "$IS_PR_CLOSED" = "true" ]; then
            should_test=false
            should_build=false
          elif [ "$IS_SCHEDULE" = "true" ]; then
            should_test=false
            should_build=false
          elif [ "$IS_PUSH" = "true" ] || [ "$IS_MERGE_GROUP" = "true" ]; then
            should_test=true
            should_build=true
          elif $is_pr || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            should_test=true
            should_build=true
          elif [ "$ACTOR" = "dependabot[bot]" ]; then
            should_test=true
            should_build=true
          elif match '^(launcher|libraries|tests|buildconfig|cmake|program_info|zlib|quazip|bzip2)/|CMakeLists.txt|\\.cpp$|\\.h$|\\.ui$'; then
            should_test=true
            should_build=true
          elif $scope_selected; then
            should_test=true
            should_build=true
          else
            should_test=false
            should_build=false
          fi

          run_zlib=false
          run_bzip2=false
          run_quazip=false
          run_website=false
          run_nix=false
          run_bot=false
          run_meta=false
          run_branding=false
          run_schedule=false
          build_type="Debug"
          run_release_build=false
          run_regular_build=false
          dominant_scope="none"

          # Pick a dominant scope (highest priority wins) for summary/routing
          if [ "$SCOPE_CI" = "true" ]; then
            dominant_scope="ci"
          elif [ "$SCOPE_LAUNCHER" = "true" ]; then
            dominant_scope="launcher"
          elif [ "$SCOPE_LAUNCHERJAVA" = "true" ]; then
            dominant_scope="launcher-java"
          elif [ "$SCOPE_JAVACHECK" = "true" ]; then
            dominant_scope="javacheck"
          elif [ "$SCOPE_LIBNBT" = "true" ]; then
            dominant_scope="libnbtplusplus"
          elif [ "$SCOPE_ZLIB" = "true" ]; then
            dominant_scope="zlib"
          elif [ "$SCOPE_BZIP2" = "true" ]; then
            dominant_scope="bzip2"
          elif [ "$SCOPE_QUAZIP" = "true" ]; then
            dominant_scope="quazip"
          elif [ "$SCOPE_PACKAGES" = "true" ]; then
            dominant_scope="packages"
          elif [ "$SCOPE_WEBSITE" = "true" ]; then
            dominant_scope="website"
          elif [ "$SCOPE_BOT" = "true" ]; then
            dominant_scope="bot"
          elif [ "$SCOPE_META" = "true" ]; then
            dominant_scope="meta"
          elif [ "$SCOPE_TOOLS" = "true" ]; then
            dominant_scope="tools"
          elif [ "$SCOPE_DOCS" = "true" ]; then
            dominant_scope="docs"
          elif [ "$SCOPE_BRANDING" = "true" ]; then
            dominant_scope="branding"
          fi

          if [ "$IS_TAG" = "true" ]; then
            build_type="Release"
          fi

          if [ "$IS_RELEASE_EVENT" = "true" ] || [ "$IS_PR_CLOSED" = "true" ]; then
            # release events are handled elsewhere; do not run component jobs
            :
          elif [ "$IS_PUSH" = "true" ] || [ "$IS_MERGE_GROUP" = "true" ]; then
            # On push/merge_group run everything
            run_zlib=true
            run_bzip2=true
            run_quazip=true
            run_website=true
            run_nix=true
            run_bot=true
            run_meta=true
            run_branding=true
          elif [ "$IS_SCHEDULE" = "true" ]; then
            run_schedule=true
          elif [ "$IS_SCHEDULE" != "true" ]; then
            match '^zlib/' && run_zlib=true
            match '^bzip2/' && run_bzip2=true
            match '^quazip/' && run_quazip=true
            match '^website/' && run_website=true
            match '^bot/' && run_bot=true
            match '^meta/' && run_meta=true
            match '^program_info/|^public/|^website/img/' && run_branding=true
            match '^flake\.nix$|^shell\.nix$|^nix/' && run_nix=true
          fi

          if [ "$IS_PR" = "true" ]; then
            if [ "$SCOPE_ZLIB" = "true" ]; then run_zlib=true; fi
            if [ "$SCOPE_BZIP2" = "true" ]; then run_bzip2=true; fi
            if [ "$SCOPE_QUAZIP" = "true" ]; then run_quazip=true; fi
            if [ "$SCOPE_WEBSITE" = "true" ]; then run_website=true; fi
            if [ "$SCOPE_BOT" = "true" ]; then run_bot=true; fi
            if [ "$SCOPE_META" = "true" ]; then run_meta=true; fi
            if [ "$SCOPE_BRANDING" = "true" ]; then run_branding=true; fi
            if [ "$SCOPE_PACKAGES" = "true" ]; then run_nix=true; fi
            if [ "$SCOPE_CI" = "true" ]; then
              run_zlib=true
              run_bzip2=true
              run_quazip=true
              run_website=true
              run_nix=true
              run_bot=true
              run_meta=true
              run_branding=true
              should_test=true
              should_build=true
            fi
            if [ "$SCOPE_LAUNCHERJAVA" = "true" ] || [ "$SCOPE_JAVACHECK" = "true" ] || [ "$SCOPE_LIBNBT" = "true" ]; then
              should_test=true
              should_build=true
              run_regular_build=true
            fi
            if [ "$SCOPE_DOCS" = "true" ] || [ "$SCOPE_TOOLS" = "true" ] || [ "$SCOPE_BOT" = "true" ] || [ "$SCOPE_META" = "true" ] || [ "$SCOPE_BRANDING" = "true" ]; then
              if [ "$SCOPE_LAUNCHER" != "true" ] && [ "$SCOPE_CI" != "true" ] && [ "$SCOPE_LAUNCHERJAVA" != "true" ] && [ "$SCOPE_JAVACHECK" != "true" ] && [ "$SCOPE_LIBNBT" != "true" ] && [ "$SCOPE_ZLIB" != "true" ] && [ "$SCOPE_BZIP2" != "true" ] && [ "$SCOPE_QUAZIP" != "true" ] && [ "$SCOPE_WEBSITE" != "true" ] && [ "$SCOPE_PACKAGES" != "true" ]; then
                should_test=true
                should_build=false
                run_zlib=false
                run_bzip2=false
                run_quazip=false
                run_website=false
                run_nix=false
                run_regular_build=false
              fi
            fi

            # If scopes are explicitly selected on a PR, clamp component runs to those scopes (docs/tools/branding remain no-op)
            if [ "$scope_selected" = "true" ]; then
              run_zlib=$([ "$SCOPE_ZLIB" = "true" ] && echo true || echo false)
              run_bzip2=$([ "$SCOPE_BZIP2" = "true" ] && echo true || echo false)
              run_quazip=$([ "$SCOPE_QUAZIP" = "true" ] && echo true || echo false)
              run_website=$([ "$SCOPE_WEBSITE" = "true" ] && echo true || echo false)
              run_nix=$([ "$SCOPE_PACKAGES" = "true" ] && echo true || echo false)
              run_bot=$([ "$SCOPE_BOT" = "true" ] && echo true || echo false)
              run_meta=$([ "$SCOPE_META" = "true" ] && echo true || echo false)
              run_branding=$([ "$SCOPE_BRANDING" = "true" ] && echo true || echo false)
            fi
          fi

          if [ "$IS_TAG" = "true" ]; then
            run_release_build=true
          elif [ "$should_build" = "true" ]; then
            run_regular_build=true
          fi

          # If no scope was explicitly selected, infer a dominant area from the jobs we plan to run
          if [ "$dominant_scope" = "none" ]; then
            if [ "$run_regular_build" = "true" ]; then
              dominant_scope="launcher"
            elif [ "$run_zlib" = "true" ]; then
              dominant_scope="zlib"
            elif [ "$run_bzip2" = "true" ]; then
              dominant_scope="bzip2"
            elif [ "$run_quazip" = "true" ]; then
              dominant_scope="quazip"
            elif [ "$run_website" = "true" ]; then
              dominant_scope="website"
            elif [ "$run_bot" = "true" ]; then
              dominant_scope="bot"
            elif [ "$run_meta" = "true" ]; then
              dominant_scope="meta"
            elif [ "$run_nix" = "true" ]; then
              dominant_scope="packages"
            elif [ "$run_branding" = "true" ]; then
              dominant_scope="branding"
            fi
          fi

          echo "should-test=$should_test" >> "$GITHUB_OUTPUT"
          echo "should-build=$should_build" >> "$GITHUB_OUTPUT"
          echo "run-zlib=$run_zlib" >> "$GITHUB_OUTPUT"
          echo "run-bzip2=$run_bzip2" >> "$GITHUB_OUTPUT"
          echo "run-quazip=$run_quazip" >> "$GITHUB_OUTPUT"
          echo "run-website=$run_website" >> "$GITHUB_OUTPUT"
          echo "run-nix=$run_nix" >> "$GITHUB_OUTPUT"
          echo "run-bot=$run_bot" >> "$GITHUB_OUTPUT"
          echo "run-meta=$run_meta" >> "$GITHUB_OUTPUT"
          echo "run-branding=$run_branding" >> "$GITHUB_OUTPUT"
          echo "run-schedule=$run_schedule" >> "$GITHUB_OUTPUT"
          echo "build-type=$build_type" >> "$GITHUB_OUTPUT"
          echo "run-release-build=$run_release_build" >> "$GITHUB_OUTPUT"
          echo "run-regular-build=$run_regular_build" >> "$GITHUB_OUTPUT"
          echo "dominant-scope=$dominant_scope" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "## Prepare Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Base ref: \`${{ steps.base.outputs.base }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Head ref: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Event: \`${{ steps.trigger.outputs.event-name }}\` (ref: `${{ steps.trigger.outputs.ref-name }}` type: `${{ steps.trigger.outputs.ref-type }}`)" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.trigger.outputs.is-schedule }}" = "true" ]; then
            echo "- Schedule cron: \`${{ steps.trigger.outputs.schedule-cron }}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Trigger flags: pr=${{ steps.trigger.outputs.is-pr }} (closed=${{ steps.trigger.outputs.is-pr-closed }}), push=${{ steps.trigger.outputs.is-push }}, merge_group=${{ steps.trigger.outputs.is-merge-group }}, dispatch=${{ steps.trigger.outputs.is-dispatch }}, schedule=${{ steps.trigger.outputs.is-schedule }}, issue_comment=${{ steps.trigger.outputs.is-issue-comment }}, release=${{ steps.trigger.outputs.is-release }}, workflow_run=${{ steps.trigger.outputs.is-workflow-run }}, pr_review=${{ steps.trigger.outputs.is-pr-review }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Should test: \`${{ steps.decide.outputs.should-test }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Should build: \`${{ steps.decide.outputs.should-build }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build type: \`${{ steps.decide.outputs.build-type }}\` (Release if tag push, else Debug)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run release build: \`${{ steps.decide.outputs.run-release-build }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run regular build: \`${{ steps.decide.outputs.run-regular-build }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run zlib: \`${{ steps.decide.outputs.run-zlib }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run bzip2: \`${{ steps.decide.outputs.run-bzip2 }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run quazip: \`${{ steps.decide.outputs.run-quazip }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run website: \`${{ steps.decide.outputs.run-website }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run nix: \`${{ steps.decide.outputs.run-nix }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run schedule-specific: \`${{ steps.decide.outputs.run-schedule }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dominant scope: \`${{ steps.decide.outputs.dominant-scope || 'none' }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.trigger.outputs.is-pr }}" = "true" ]; then
            echo "- Scope flags: launcher=${{ steps.scope.outputs.launcher || 'false' }}, launcher-java=${{ steps.scope.outputs.launcherjava || 'false' }}, javacheck=${{ steps.scope.outputs.javacheck || 'false' }}, libnbtplusplus=${{ steps.scope.outputs.libnbtplusplus || 'false' }}, website=${{ steps.scope.outputs.website || 'false' }}, bot=${{ steps.scope.outputs.bot || 'false' }}, meta=${{ steps.scope.outputs.meta || 'false' }}, quazip=${{ steps.scope.outputs.quazip || 'false' }}, bzip2=${{ steps.scope.outputs.bzip2 || 'false' }}, zlib=${{ steps.scope.outputs.zlib || 'false' }}, packages=${{ steps.scope.outputs.packages || 'false' }}, docs=${{ steps.scope.outputs.docs || 'false' }}, tools=${{ steps.scope.outputs.tools || 'false' }}, ci=${{ steps.scope.outputs.ci || 'false' }}, branding=${{ steps.scope.outputs.branding || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Scope flags: n/a (non-PR event)" >> "$GITHUB_STEP_SUMMARY"
          fi

  clang-lint:
    timeout-minutes: 5
    name: Clang Lint
    needs: prepare
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.should-test == 'true' && needs.prepare.outputs.is-schedule != 'true' && needs.prepare.outputs.is-release != 'true' && needs.prepare.outputs.is-pr-closed != 'true'
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: ${{ needs.prepare.outputs.head-ref }}

      - name: Check C++ formatting
        run: |
          if command -v clang-format &> /dev/null; then
            find launcher libraries -name "*.cpp" -o -name "*.h" | head -100 | while read file; do
              if ! clang-format --dry-run --Werror "$file" 2>/dev/null; then
                echo "Format issue: $file"
              fi
            done
          fi

  markdown-lint:
    timeout-minutes: 5
    name: Markdown Lint
    needs: prepare
    if: needs.prepare.outputs.should-test == 'true' && needs.prepare.outputs.is-schedule != 'true' && needs.prepare.outputs.is-release != 'true' && needs.prepare.outputs.is-pr-closed != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: nosborn/github-action-markdown-cli@1a79194d2cebd7ebdf9f8079ab17f7761b14aec0
        with:
          files: .

  build-projt-launcher-debug:
    name: Build ProjT Launcher ( DEBUG )
    needs: prepare
    if: needs.prepare.outputs.run-regular-build == 'true'
    uses: ./.github/workflows/build-projt-launcher.yml
    permissions:
      contents: read
      packages: write
      pages: write
      id-token: write
    with:
      ref: ${{ github.sha }}
      build-type: Debug
      
  build-projt-launcher-release:
    name: Build ProjT Launcher ( RELEASE )
    needs: prepare
    if: needs.prepare.outputs.run-release-build == 'true'
    uses: ./.github/workflows/build-projt-launcher.yml
    permissions:
      contents: read
      packages: write
      pages: write
      id-token: write
    with:
      ref: ${{ github.sha }}
      build-type: Release
      force-prepare-yes: true
    secrets: inherit

  create-release:
    timeout-minutes: 10
    name: Create Release
    needs: build-projt-launcher-release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          submodules: "true"
          path: "ProjTLauncher-source"

      - name: Free disk space (Linux)
        shell: bash
        run: |
          echo "Disk usage before cleanup:"
          df -h
          SUDO=""
          if command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          fi
          $SUDO swapoff -a || true
          $SUDO rm -rf /swapfile || true

          $SUDO rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/.ghcup || true
          $SUDO rm -rf /opt/hostedtoolcache/CodeQL || true
          $SUDO rm -rf /usr/local/share/boost /usr/local/share/powershell || true

          $SUDO apt-get clean || true
          $SUDO rm -rf /var/lib/apt/lists/* || true
          echo "Disk usage after cleanup:"
          df -h

      - name: Download artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
      - name: Grab and store version
        run: |
          tag_name=$(echo ${{ github.ref }} | grep -oE "[^/]+$")
          echo "VERSION=$tag_name" >> $GITHUB_ENV
      - name: Package source libraries
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd "${{ github.workspace }}"
          SRC_DIR="ProjTLauncher-source"
          libs=(libnbtplusplus zlib quazip bzip2 launcherjava)

          sign_file() {
            local path="$1"
            if [ -n "${GPG_PRIVATE_KEY}" ] && [ -n "${GPG_PASSPHRASE}" ]; then
              echo "${GPG_PRIVATE_KEY}" | gpg --batch --yes --import
              gpg --batch --yes --armor --pinentry-mode loopback --passphrase "${GPG_PASSPHRASE}" --output "${path}.asc" --detach-sign "${path}"
            fi
          }

          for d in "${libs[@]}"; do
            base="${d}-${{ env.VERSION }}"
            tar -C "${SRC_DIR}" -czf "${base}.tar.gz" "${d}"
            tar -C "${SRC_DIR}" -cJf "${base}.tar.xz" "${d}"
            (cd "${SRC_DIR}" && zip -r "../${base}.zip" "${d}")

            sign_file "${base}.tar.gz"
            sign_file "${base}.tar.xz"
            sign_file "${base}.zip"
          done
      - name: Package artifacts properly
        run: |
          mv ${{ github.workspace }}/ProjTLauncher-source ProjTLauncher-${{ env.VERSION }}
          mv ProjTLauncher-Linux-Qt6-Portable*/ProjTLauncher-portable.tar.gz ProjTLauncher-Linux-Qt6-Portable-${{ env.VERSION }}.tar.gz
          mv ProjTLauncher-*.AppImage/ProjTLauncher-*-x86_64.AppImage ProjTLauncher-Linux-x86_64.AppImage
          mv ProjTLauncher-*.AppImage.zsync/ProjTLauncher-*-x86_64.AppImage.zsync ProjTLauncher-Linux-x86_64.AppImage.zsync
          mv ProjTLauncher-*.AppImage/ProjTLauncher-*-aarch64.AppImage ProjTLauncher-Linux-aarch64.AppImage
          mv ProjTLauncher-*.AppImage.zsync/ProjTLauncher-*-aarch64.AppImage.zsync ProjTLauncher-Linux-aarch64.AppImage.zsync
          mv ProjTLauncher-macOS*/ProjTLauncher.zip ProjTLauncher-macOS-${{ env.VERSION }}.zip

          tar --exclude='.git' -czf ProjTLauncher-${{ env.VERSION }}.tar.gz ProjTLauncher-${{ env.VERSION }}

          for d in ProjTLauncher-Windows-MSVC*; do
            cd "${d}" || continue
            LEGACY="$(echo -n ${d} | grep -o Legacy || true)"
            ARM64="$(echo -n ${d} | grep -o arm64 || true)"
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="ProjTLauncher-Windows-MSVC"
            test -z "${LEGACY}" || NAME="${NAME}-Legacy"
            test -z "${ARM64}" || NAME="${NAME}-arm64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv ProjTLauncher-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

          for d in ProjTLauncher-Windows-MinGW-w64*; do
            cd "${d}" || continue
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="ProjTLauncher-Windows-MinGW-w64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv ProjTLauncher-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

          for d in ProjTLauncher-Windows-MinGW-arm64*; do
            cd "${d}" || continue
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="ProjTLauncher-Windows-MinGW-arm64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv ProjTLauncher-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@5122b4edc95f85501a71628a57dc180a03ec7588
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref }}
          name: ProjTLauncher ${{ env.VERSION }}
          draft: true
          prerelease: false
          files: |
            ProjTLauncher-Linux-x86_64.AppImage
            ProjTLauncher-Linux-x86_64.AppImage.zsync
            ProjTLauncher-Linux-aarch64.AppImage
            ProjTLauncher-Linux-aarch64.AppImage.zsync
            ProjTLauncher-Linux-Qt6-Portable-${{ env.VERSION }}.tar.gz
            ProjTLauncher-Linux-aarch64-Qt6-Portable-${{ env.VERSION }}.tar.gz
            ProjTLauncher-Windows-MinGW-w64-${{ env.VERSION }}.zip
            ProjTLauncher-Windows-MinGW-w64-Portable-${{ env.VERSION }}.zip
            ProjTLauncher-Windows-MinGW-w64-Setup-${{ env.VERSION }}.exe
            ProjTLauncher-Windows-MinGW-arm64-${{ env.VERSION }}.zip
            ProjTLauncher-Windows-MinGW-arm64-Portable-${{ env.VERSION }}.zip
            ProjTLauncher-Windows-MinGW-arm64-Setup-${{ env.VERSION }}.exe
            ProjTLauncher-Windows-MSVC-arm64-${{ env.VERSION }}.zip
            ProjTLauncher-Windows-MSVC-arm64-Portable-${{ env.VERSION }}.zip
            ProjTLauncher-Windows-MSVC-arm64-Setup-${{ env.VERSION }}.exe
            ProjTLauncher-Windows-MSVC-${{ env.VERSION }}.zip
            ProjTLauncher-Windows-MSVC-Portable-${{ env.VERSION }}.zip
            ProjTLauncher-Windows-MSVC-Setup-${{ env.VERSION }}.exe
            ProjTLauncher-macOS-${{ env.VERSION }}.zip
            ProjTLauncher-${{ env.VERSION }}.tar.gz
            libnbtplusplus-${{ env.VERSION }}.zip
            libnbtplusplus-${{ env.VERSION }}.tar.gz
            libnbtplusplus-${{ env.VERSION }}.tar.xz
            libnbtplusplus-${{ env.VERSION }}.zip.asc
            libnbtplusplus-${{ env.VERSION }}.tar.gz.asc
            libnbtplusplus-${{ env.VERSION }}.tar.xz.asc
            zlib-${{ env.VERSION }}.zip
            zlib-${{ env.VERSION }}.tar.gz
            zlib-${{ env.VERSION }}.tar.xz
            zlib-${{ env.VERSION }}.zip.asc
            zlib-${{ env.VERSION }}.tar.gz.asc
            zlib-${{ env.VERSION }}.tar.xz.asc
            quazip-${{ env.VERSION }}.zip
            quazip-${{ env.VERSION }}.tar.gz
            quazip-${{ env.VERSION }}.tar.xz
            quazip-${{ env.VERSION }}.zip.asc
            quazip-${{ env.VERSION }}.tar.gz.asc
            quazip-${{ env.VERSION }}.tar.xz.asc
            bzip2-${{ env.VERSION }}.zip
            bzip2-${{ env.VERSION }}.tar.gz
            bzip2-${{ env.VERSION }}.tar.xz
            bzip2-${{ env.VERSION }}.zip.asc
            bzip2-${{ env.VERSION }}.tar.gz.asc
            bzip2-${{ env.VERSION }}.tar.xz.asc
            launcherjava-${{ env.VERSION }}.zip
            launcherjava-${{ env.VERSION }}.tar.gz
            launcherjava-${{ env.VERSION }}.tar.xz
            launcherjava-${{ env.VERSION }}.zip.asc
            launcherjava-${{ env.VERSION }}.tar.gz.asc
            launcherjava-${{ env.VERSION }}.tar.xz.asc

  build-quazip-ubuntu:
    if: true && needs.prepare.outputs.run-quazip == 'true'
    needs: [prepare]
    name: Ubuntu-${{ matrix.os_version }}-Qt-${{ matrix.qt_version }}-shared-${{ matrix.shared }}
    strategy:
      fail-fast: false
      matrix:
        os_version: [22.04, 24.04]
        qt_version: [5.15.2, 6.8.2]
        shared: [ON, OFF]
    uses: ./.github/workflows/reusable.yml
    with:
        runs_on: ubuntu-${{ matrix.os_version }}
        os_version: ${{ matrix.os_version }}
        qt_version: ${{ matrix.qt_version }}
        shared: ${{ matrix.shared }}
        ref: ${{ inputs.ref }}
        working_directory: quazip

  build-quazip-ubuntu-zlibconst:
    if: true && needs.prepare.outputs.run-quazip == 'true'
    needs: [prepare]
    name: Ubuntu-${{ matrix.os_version }}-Qt-${{ matrix.qt_version }}-shared-zlibconst
    strategy:
      fail-fast: false
      matrix:
        os_version: [ 24.04 ]
        qt_version: [ 6.8.2 ]
    uses: ./.github/workflows/reusable.yml
    with:
      runs_on: ubuntu-${{ matrix.os_version }}
      os_version: ${{ matrix.os_version }}
      qt_version: ${{ matrix.qt_version }}
      shared: "ON"
      zlib_const: "ON"
      ref: ${{ inputs.ref }}
      working_directory: quazip

  build-quazip-ubuntu-no-qtextcodec:
    if: true && needs.prepare.outputs.run-quazip == 'true'
    needs: [prepare]
    name: Ubuntu-${{ matrix.os_version }}-Qt-${{ matrix.qt_version }}-shared-no-qtextcodec
    strategy:
      fail-fast: true
      matrix:
        os_version: [ 24.04 ]
        qt_version: [ 6.8.2 ]
    uses: ./.github/workflows/reusable.yml
    with:
      runs_on: ubuntu-${{ matrix.os_version }}
      os_version: ${{ matrix.os_version }}
      qt_version: ${{ matrix.qt_version }}
      shared: "ON"
      qtextcodec: 'OFF'
      ref: ${{ inputs.ref }}
      working_directory: quazip

  build-quazip-macos:
    if: true && needs.prepare.outputs.run-quazip == 'true'
    needs: [prepare]
    name: macos-${{ matrix.os_version }}-Qt-${{ matrix.qt_version }}-shared-${{ matrix.shared }}
    strategy:
      fail-fast: false
      matrix:
        os_version: [15, 14, 15-intel]
        qt_version: [6.8.2, 5.15.2]
        shared: [ON, OFF]
        exclude:
          - os_version: 14
            qt_version: 5.15.2 #Not available due to ARM arch
          - os_version: 15
            qt_version: 5.15.2 #Not available due to ARM arch
    uses: ./.github/workflows/reusable.yml
    with:
      runs_on: macos-${{ matrix.os_version }}
      os_version: ${{ matrix.os_version }}
      qt_version: ${{ matrix.qt_version }}
      shared: ${{ matrix.shared }}
      ref: ${{ inputs.ref }}
      working_directory: quazip

  build-quazip-alpine:
    timeout-minutes: 50
    if: true && needs.prepare.outputs.run-quazip == 'true'
    needs: prepare
    name: "${{ matrix.qt_version }} on ${{ matrix.runner }}"
    runs-on: "ubuntu-22.04"
    container:
      image: "${{ matrix.runner }}"
    strategy:
      matrix:
        runner:
          - "alpine:3.21"
        qt_version:
          - "qt5"
          - "qt6"
    env:
      DEBIAN_FRONTEND: noninteractive
      TEST_ZIP_UNZIP_LARGE: true
    steps:
      - name: Show OS info
        run: cat /etc/os-release
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Install build tools
        working-directory: quazip
        run: apk add --update g++ make cmake ${{ matrix.qt_version }}-qtbase-dev
      - name: Install compat
        if: ${{ matrix.qt_version == 'qt6' }}
        working-directory: quazip
        run: apk add qt6-qt5compat-dev
      - name: Show cmake version
        working-directory: quazip
        run: cmake --version
      - name: Run cmake
        working-directory: quazip
        run: cmake -B build -DQUAZIP_ENABLE_TESTS=ON
      - name: Build quazip
        working-directory: quazip
        run: cd build && VERBOSE=1 make -j8
      - name: Build tests
        working-directory: quazip
        run: cd build/qztest && VERBOSE=1 make -j8
      - name: Run tests
        working-directory: quazip
        run: build/qztest/qztest

  build-quazip-windows-x64:
    if: true && needs.prepare.outputs.run-quazip == 'true'
    needs: [prepare]
    name: Win-Qt-${{ matrix.qt_version }}-preset-${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        preset: [ conan, vcpkg ]
        qt_version: [ 5.15.2, 6.8.2 ]
    uses: ./.github/workflows/reusable-win.yml
    with:
      runs_on: "win-x64"
      arch: x64
      qt_version: ${{ matrix.qt_version }}
      preset: ${{ matrix.preset }}
      pe_str: "x86-64"
      ref: ${{ inputs.ref }}
      working_directory: quazip

  build-quazip-windows-x86:
    if: true && needs.prepare.outputs.run-quazip == 'true'
    needs: [prepare]
    name: Win-Qt-${{ matrix.qt_version }}-preset-${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        preset: [ conan_x86, vcpkg_x86 ]
        qt_version: [ 5.15.2 ]
    uses: ./.github/workflows/reusable-win.yml
    with:
      runs_on: "win-x86"
      arch: x86
      qt_version: ${{ matrix.qt_version }}
      preset: ${{ matrix.preset }}
      pe_str: "i386"
      ref: ${{ inputs.ref }}
      working_directory: quazip

  build-quazip-ubuntu-ci-extract:
    if: true && needs.prepare.outputs.run-quazip == 'true'
    name: extract-Ubuntu-${{ matrix.os_version }}-Qt-${{ matrix.qt_version }}-shared-${{ matrix.shared }}
    strategy:
      fail-fast: false
      matrix:
        os_version: [ 24.04 ]
        qt_version: [ 6.8.2 ]
        shared: [ ON ]
    uses: ./.github/workflows/reusable.yml
    needs: [ build-quazip-ubuntu, build-quazip-macos, build-quazip-windows-x64, build-quazip-windows-x86, prepare ]
    with:
      runs_on: ubuntu-${{ matrix.os_version }}
      os_version: ${{ matrix.os_version }}
      qt_version: ${{ matrix.qt_version }}
      shared: ${{ matrix.shared }}
      cross_extract: true
      ref: ${{ inputs.ref }}
      working_directory: quazip

  build-quazip-macos-ci-extract:
    if: true && needs.prepare.outputs.run-quazip == 'true'
    name: extract-macos-${{ matrix.os_version }}-Qt-${{ matrix.qt_version }}-shared-${{ matrix.shared }}
    strategy:
      fail-fast: false
      matrix:
        os_version: [ 15 ]
        qt_version: [ 6.8.2 ]
        shared: [ ON ]
    uses: ./.github/workflows/reusable.yml
    needs: [ build-quazip-ubuntu, build-quazip-macos, build-quazip-windows-x64, build-quazip-windows-x86, prepare ]
    with:
      runs_on: macos-${{ matrix.os_version }}
      os_version: ${{ matrix.os_version }}
      qt_version: ${{ matrix.qt_version }}
      shared: ${{ matrix.shared }}
      cross_extract: true
      ref: ${{ inputs.ref }}
      working_directory: quazip

  build-quazip-windows-x64-ci-extract:
    if: true && needs.prepare.outputs.run-quazip == 'true'
    name: extract-Win-Qt-${{ matrix.qt_version }}-preset-${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        preset: [ vcpkg ]
        qt_version: [ 6.8.2 ]
    uses: ./.github/workflows/reusable-win.yml
    needs: [ build-quazip-ubuntu, build-quazip-macos, build-quazip-windows-x64, build-quazip-windows-x86, prepare ]
    with:
      runs_on: "win-x64"
      arch: x64
      qt_version: ${{ matrix.qt_version }}
      preset: ${{ matrix.preset }}
      pe_str: "x86-64"
      cross_extract: true
      ref: ${{ inputs.ref }}
      working_directory: quazip

  build-quazip-fedora:
    if: true && needs.prepare.outputs.run-quazip == 'true'
    needs: prepare
    name: "${{ matrix.qt_version }} on ${{ matrix.runner }}"
    runs-on: "ubuntu-22.04"
    defaults:
      run:
        working-directory: quazip
    container:
      image: "${{ matrix.runner }}"
    strategy:
      matrix:
        runner:
          - "fedora:42"
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - name: Install build tools
        run: dnf -y install g++ make cmake qt6-qtbase-devel qt6-qt5compat-devel zlib-ng-devel zlib-ng-compat-devel
      - name: Run cmake
        run: cmake -B build -DQUAZIP_ENABLE_TESTS=ON
      - name: Build quazip
        run: cd build && VERBOSE=1 make -j8
      - name: Run tests
        run: build/qztest/qztest

  build-quazip-use-qt-zlib-ubuntu:
    timeout-minutes: 50
    env:
      BUILD_TYPE: Release
    if: true && needs.prepare.outputs.run-quazip == 'true'
    needs: prepare
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: quazip
    name: use-qt-zlib-ubuntu-${{ matrix.qt_version }}
    container: ghcr.io/cen1/qt:${{ matrix.qt_version }}
    strategy:
      fail-fast: false
      matrix:
        qt_version: [ 5.15.12, 6.4.3, 6.8.2 ]

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Configure CMake
        run: cmake -DCMAKE_BUILD_TYPE="${{env.BUILD_TYPE}}" -DBUILD_SHARED_LIBS=OFF -DQUAZIP_ENABLE_TESTS=ON -DQUAZIP_USE_QT_ZLIB=ON -DCMAKE_PREFIX_PATH="/usr/local/Qt-${{ matrix.qt_version }}" -B build

      - name: Build
        run: cmake --build build --config ${{env.BUILD_TYPE}}

      - name: Run tests
        working-directory: ${{ github.workspace }}/quazip/build
        run: ctest --verbose -C Release

  build-quazip-use-qt6-zlib-windows:
    timeout-minutes: 50
    if: true && needs.prepare.outputs.run-quazip == 'true'
    needs: prepare
    env:
      BUILD_TYPE: Release
    runs-on: windows-latest
    defaults:
      run:
        working-directory: quazip
    name: use-qt6-zlib-windows-${{ matrix.qt_version }}
    strategy:
      fail-fast: false
      matrix:
        qt_version: [ 6.8.2 ]

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - uses: TheMrMilchmann/setup-msvc-dev@79dac248aac9d0059f86eae9d8b5bfab4e95e97c
        with:
          arch: x64

      - name: Restore Qt build cache
        id: cache-qt-restore
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb
        with:
          key: windows-qt-${{ matrix.qt_version }}
          path: qt-everywhere-src-${{ matrix.qt_version }}

      - name: Restore Qt zip
        if: steps.cache-qt-restore.outputs.cache-hit != 'true'
        id: cache-qt-zip-restore
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb
        with:
          key: windows-qt-${{ matrix.qt_version }}-zip
          path: qt-everywhere-src-${{ matrix.qt_version }}.zip

      - name: Download Qt 6
        if: steps.cache-qt-restore.outputs.cache-hit != 'true' && steps.cache-qt-zip-restore.outputs.cache-hit != 'true'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          curl https://ftp.fau.de/qtproject/archive/qt/6.8/${{ matrix.qt_version }}/single/qt-everywhere-src-${{ matrix.qt_version }}.zip --output qt-everywhere-src-${{ matrix.qt_version }}.zip

      - name: Save Qt zip
        if: steps.cache-qt-restore.outputs.cache-hit != 'true' && steps.cache-qt-zip-restore.outputs.cache-hit != 'true'
        id: cache-qt-zip-save
        uses: actions/cache/save@94b89442628ad1d101e352b7ee38f30e1bef108e
        with:
          path: qt-everywhere-src-${{ matrix.qt_version }}.zip
          key: windows-qt-${{ matrix.qt_version }}-zip

      - name: Extract Qt zip
        if: steps.cache-qt-restore.outputs.cache-hit != 'true'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf qt-everywhere-src-${{ matrix.qt_version }}
          unzip -oq qt-everywhere-src-${{ matrix.qt_version }}.zip
          ls -la

      - name: Configure Qt
        if: steps.cache-qt-restore.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: qt-everywhere-src-${{ matrix.qt_version }}
        run: ./configure.bat -prefix "${{github.workspace}}/Qt" -qt-zlib ^
          -static ^
          -opensource ^
          -confirm-license ^
          -optimize-size ^
          -nomake examples ^
          -nomake tests ^
          -no-dbus ^
          -no-icu ^
          -no-fontconfig ^
          -no-opengl ^
          -no-openssl ^
          -no-gui ^
          -skip qtconnectivity ^
          -skip qtdatavis3d ^
          -skip qtdeclarative ^
          -skip qtdoc ^
          -skip qtactiveqt ^
          -skip qt3d ^
          -skip qtgraphs ^
          -skip qtgrpc ^
          -skip qtimageformats ^
          -skip qtlanguageserver ^
          -skip qtlocation ^
          -skip qthttpserver ^
          -skip qtmultimedia ^
          -skip qtopcua ^
          -skip qtpositioning ^
          -skip qtremoteobjects ^
          -skip qtscxml ^
          -skip qtsensors ^
          -skip qtserialbus ^
          -skip qtserialport ^
          -skip qtshadertools ^
          -skip qtspeech ^
          -skip qtsvg ^
          -skip qttools ^
          -skip qttranslations ^
          -skip qtwebchannel ^
          -skip qtwebengine ^
          -skip qtwebsockets ^
          -skip qtwebview ^
          -skip qtcharts ^
          -skip qtcoap ^
          -skip qtlottie ^
          -skip qtmqtt ^
          -skip qtnetworkauth ^
