  ci-cmake:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: prepare
    if: needs.prepare.outputs.run-zlib == 'true'
    defaults:
      run:
        working-directory: zlib
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC
            os: ubuntu-latest
            compiler: gcc
            cflags: -Wall -Wextra
            pkgtgt: package package_source
            cmake-args: -DMINIZIP_ENABLE_BZIP2=ON

          - name: Ubuntu GCC -O3
            os: ubuntu-latest
            compiler: gcc
            cflags: -O3 -Wall -Wextra
            pkgtgt: package package_source
            cmake-args: -DMINIZIP_ENABLE_BZIP2=ON

          - name: Ubuntu Clang
            os: ubuntu-latest
            compiler: clang
            cflags: -Wall -Wextra
            pkgtgt: package package_source
            cmake-args: -DMINIZIP_ENABLE_BZIP2=ON

          - name: Ubuntu Clang Debug
            os: ubuntu-latest
            compiler: clang
            cflags: -Wall -Wextra
            build-config: Debug
            pkgtgt: package package_source
            cmake-args: -DMINIZIP_ENABLE_BZIP2=ON

          - name: Windows MSVC Win32
            os: windows-latest
            compiler: cl
            cflags: /W3
            cmake-args: -A Win32
            pkgtgt: PACKAGE

          - name: Windows MSVC Win64
            os: windows-latest
            compiler: cl
            cflags: /W3
            cmake-args: -A x64 -DMINIZIP_ENABLE_BZIP2=OFF
            pkgtgt: PACKAGE

          - name: Windows GCC
            os: windows-latest
            compiler: gcc
            cflags: -Wall -Wextra
            cmake-args: -G Ninja -DMINIZIP_ENABLE_BZIP2=OFF
            pkgtgt: package

          - name: macOS Clang
            os: macos-latest
            compiler: clang
            cflags: -Wall -Wextra
            pkgtgt: package
            cmake-args: -DMINIZIP_ENABLE_BZIP2=ON

          - name: macOS GCC 13
            os: macos-latest
            compiler: gcc-13
            cflags: -Wall -Wextra
            pkgtgt: package
            cmake-args: -DMINIZIP_ENABLE_BZIP2=ON

          - name: macOS GCC 14
            os: macos-latest
            compiler: gcc-14
            cflags: -Wall -Wextra
            pkgtgt: package
            cmake-args: -DMINIZIP_ENABLE_BZIP2=ON

          - name: macOS GCC 15
            os: macos-latest
            compiler: gcc-15
            cflags: -Wall -Wextra
            pkgtgt: package
            cmake-args: -DMINIZIP_ENABLE_BZIP2=ON

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install packages (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install --no-progress nsis

    - name: Install packages (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt install libbz2-dev
    - name: Generate project files
      run: cmake -S . -B build ${{ matrix.cmake-args }} -D CMAKE_BUILD_TYPE=${{ matrix.build-config || 'Release' }} -DZLIB_BUILD_MINIZIP=ON
      env:
        CC: ${{ matrix.compiler }}
        CFLAGS: ${{ matrix.cflags }}

    - name: Compile source code
      run: cmake --build build --config ${{ matrix.build-config || 'Release' }}

    - name: Run test cases
      run: ctest -C Release --output-on-failure --max-width 120
      working-directory: ${{ github.workspace }}/zlib/build

    - name: create packages
      run: cmake --build build --config ${{ matrix.build-config || 'Release' }} -t ${{ matrix.pkgtgt }}

    - name: Upload build errors
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: ${{ matrix.name }} (cmake)
        path: |
          zlib/build/CMakeFiles/CMakeOutput.log
          zlib/build/CMakeFiles/CMakeError.log

  CodeQL:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.repository_owner == 'Project-Tick' && needs.prepare.outputs.should-test == 'true' && needs.prepare.outputs.is-release != 'true' && needs.prepare.outputs.is-schedule != 'true' && needs.prepare.outputs.is-pr-closed != 'true'
    env:
      SKIP_CODEQL_TOOLCACHE_CLEANUP: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: "true"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-and-quality
          languages: c, cpp, java

      - name: Setup dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: Debug
          artifact-name: Linux

      - name: Configure and Build
        run: |
          cmake --preset linux
          cmake --build --preset linux --config Debug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

