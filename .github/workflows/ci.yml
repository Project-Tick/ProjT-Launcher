    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC
            os: ubuntu-latest
            compiler: gcc
            cflags: -Wall -Wextra
            pkgtgt: package package_source
            cmake-args: -DMINIZIP_ENABLE_BZIP2=ON

          - name: Ubuntu GCC -O3
            os: ubuntu-latest
            compiler: gcc
            cflags: -O3 -Wall -Wextra
            pkgtgt: package package_source
            cmake-args: -DMINIZIP_ENABLE_BZIP2=ON

          - name: Ubuntu Clang
            os: ubuntu-latest
            compiler: clang
            cflags: -Wall -Wextra
            pkgtgt: package package_source
            cmake-args: -DMINIZIP_ENABLE_BZIP2=ON

          - name: Ubuntu Clang Debug
            os: ubuntu-latest
            compiler: clang
            cflags: -Wall -Wextra
            build-config: Debug
            pkgtgt: package package_source
            cmake-args: -DMINIZIP_ENABLE_BZIP2=ON

          - name: Windows MSVC Win32
            os: windows-latest
            compiler: cl
            cflags: /W3
            cmake-args: -A Win32
            pkgtgt: PACKAGE

          - name: Windows MSVC Win64
            os: windows-latest
            compiler: cl
            cflags: /W3
            cmake-args: -A x64 -DMINIZIP_ENABLE_BZIP2=OFF
            pkgtgt: PACKAGE

          - name: Windows GCC
            os: windows-latest
            compiler: gcc
            cflags: -Wall -Wextra
            cmake-args: -G Ninja -DMINIZIP_ENABLE_BZIP2=OFF
            pkgtgt: package

          - name: macOS Clang
            os: macos-latest
            compiler: clang
            cflags: -Wall -Wextra
            pkgtgt: package
            cmake-args: -DMINIZIP_ENABLE_BZIP2=ON

          - name: macOS GCC 13
            os: macos-latest
            compiler: gcc-13
            cflags: -Wall -Wextra
            pkgtgt: package
            cmake-args: -DMINIZIP_ENABLE_BZIP2=ON

          - name: macOS GCC 14
            os: macos-latest
            compiler: gcc-14
            cflags: -Wall -Wextra
            pkgtgt: package
            cmake-args: -DMINIZIP_ENABLE_BZIP2=ON

          - name: macOS GCC 15
            os: macos-latest
            compiler: gcc-15
            cflags: -Wall -Wextra
            pkgtgt: package
            cmake-args: -DMINIZIP_ENABLE_BZIP2=ON

    steps:
    - name: Checkout repository
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

    - name: Install packages (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install --no-progress nsis

    - name: Install packages (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt install libbz2-dev
    - name: Generate project files
      run: |
        cmake -E rm -rf build
        cmake -S . -B build ${{ matrix.cmake-args }} -D CMAKE_BUILD_TYPE=${{ matrix.build-config || 'Release' }} -DZLIB_BUILD_MINIZIP=ON -DCMAKE_C_FLAGS="" -DCMAKE_CXX_FLAGS=""
      env:
        CC: ${{ matrix.compiler }}
        CFLAGS: ${{ matrix.cflags }}

    - name: Compile source code
      run: cmake --build build --config ${{ matrix.build-config || 'Release' }}

    - name: Run test cases
      run: ctest -C Release --output-on-failure --max-width 120
      working-directory: ${{ github.workspace }}/zlib/build

    - name: create packages
      run: cmake --build build --config ${{ matrix.build-config || 'Release' }} -t ${{ matrix.pkgtgt }}

    - name: Upload build errors
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      if: failure()
      with:
        name: ${{ matrix.name }} (cmake)
        path: |
          zlib/build/CMakeFiles/CMakeOutput.log
          zlib/build/CMakeFiles/CMakeError.log

  CodeQL:
    needs: prepare
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.repository_owner == 'Project-Tick' && needs.prepare.outputs.should-test == 'true' && needs.prepare.outputs.is-release != 'true' && needs.prepare.outputs.is-schedule != 'true' && needs.prepare.outputs.is-pr-closed != 'true'
    env:
      SKIP_CODEQL_TOOLCACHE_CLEANUP: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          submodules: "true"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f67ec12472e1b361f5e1e2085f5e6f85a57e3cd6
        with:
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-and-quality
          languages: c-cpp, java
          trap-caching: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: Debug
          artifact-name: Linux

      - name: Configure and Build
        run: |
          cmake --preset linux
          cmake --build --preset linux --config Debug

      - name: Build bundled libraries (standalone)
        run: |
          set -euo pipefail

          if [ -f "zlib/CMakeLists.txt" ]; then
            cmake -S zlib -B build-codeql/zlib -DCMAKE_BUILD_TYPE=Debug -DZLIB_BUILD_TESTING=OFF
            cmake --build build-codeql/zlib --config Debug
          fi

          if [ -f "bzip2/CMakeLists.txt" ]; then
            cmake -S bzip2 -B build-codeql/bzip2 -DCMAKE_BUILD_TYPE=Debug -DENABLE_LIB_ONLY=ON -DENABLE_TESTS=OFF -DENABLE_DOCS=OFF -DENABLE_EXAMPLES=OFF
            cmake --build build-codeql/bzip2 --config Debug
          fi

          if [ -f "quazip/CMakeLists.txt" ]; then
            cmake -S quazip -B build-codeql/quazip -DCMAKE_BUILD_TYPE=Debug -DQUAZIP_QT_MAJOR_VERSION=6 -DQUAZIP_ENABLE_TESTS=OFF -DBUILD_SHARED_LIBS=OFF
            cmake --build build-codeql/quazip --config Debug
          fi

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f67ec12472e1b361f5e1e2085f5e6f85a57e3cd6
        with:
          category: "/language:c-cpp"

  build-zlib-ci-configure:
    timeout-minutes: 30
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: prepare
    if: needs.prepare.outputs.run-zlib == 'true'
    defaults:
      run:
        working-directory: zlib
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC
            os: ubuntu-latest
            compiler: gcc
            configure-args: --warn

          # Test out of source builds
          - name: Ubuntu GCC OSB
            os: ubuntu-latest
            compiler: gcc
            configure-args: --warn
            build-dir: ../build
            src-dir: ../zlib

          - name: Ubuntu GCC ARM SF
            os: ubuntu-latest
            compiler: arm-linux-gnueabi-gcc
            configure-args: --warn
            chost: arm-linux-gnueabi
            packages: qemu-system qemu-user gcc-arm-linux-gnueabi libc-dev-armel-cross
            qemu-run: qemu-arm -L /usr/arm-linux-gnueabi

          - name: Ubuntu GCC ARM HF
            os: ubuntu-latest
            compiler: arm-linux-gnueabihf-gcc
            configure-args: --warn
            chost: arm-linux-gnueabihf
            packages: qemu-system qemu-user gcc-arm-linux-gnueabihf libc-dev-armhf-cross
            qemu-run: qemu-arm -L /usr/arm-linux-gnueabihf

          - name: Ubuntu GCC AARCH64
            os: ubuntu-latest
            compiler: aarch64-linux-gnu-gcc
            configure-args: --warn
            chost: aarch64-linux-gnu
            packages: qemu-system qemu-user gcc-aarch64-linux-gnu libc-dev-arm64-cross
            qemu-run: qemu-aarch64 -L /usr/aarch64-linux-gnu

          - name: Ubuntu GCC PPC
            os: ubuntu-latest
            compiler: powerpc-linux-gnu-gcc
            configure-args: --warn --static
            chost: powerpc-linux-gnu
            packages: qemu-system qemu-user gcc-powerpc-linux-gnu libc-dev-powerpc-cross
            qemu-run: qemu-ppc -L /usr/powerpc-linux-gnu
            cflags: -static
            ldflags: -static

          - name: Ubuntu GCC PPC64
            os: ubuntu-latest
            compiler: powerpc64-linux-gnu-gcc
            configure-args: --warn --static
            chost: powerpc-linux-gnu
            packages: qemu-system qemu-user gcc-powerpc64-linux-gnu libc-dev-ppc64-cross
            qemu-run: qemu-ppc64 -L /usr/powerpc64-linux-gnu
            cflags: -static
            ldflags: -static

          - name: Ubuntu GCC PPC64LE
            os: ubuntu-latest
            compiler: powerpc64le-linux-gnu-gcc
            configure-args: --warn
            chost: powerpc64le-linux-gnu
            packages: qemu-system qemu-user gcc-powerpc64le-linux-gnu libc-dev-ppc64el-cross
            qemu-run: qemu-ppc64le -L /usr/powerpc64le-linux-gnu

          - name: Ubuntu GCC S390X
            os: ubuntu-latest
            compiler: s390x-linux-gnu-gcc
            configure-args: --warn --static
            chost: s390x-linux-gnu
            packages: qemu-system qemu-user gcc-s390x-linux-gnu libc-dev-s390x-cross
            qemu-run: qemu-s390x -L /usr/s390x-linux-gnu
            cflags: -static
            ldflags: -static

          - name: macOS GCC 13
            os: macos-latest
            compiler: gcc-13
            configure-args: --warn

          - name: macOS GCC 14
            os: macos-latest
            compiler: gcc-14
            configure-args: --warn

          - name: macOS GCC 15
            os: macos-latest
            compiler: gcc-15
            configure-args: --warn

          - name: macOS Clang
            os: macos-latest
            compiler: clang
            configure-args: --warn

    steps:
    - name: Checkout repository
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

    - name: Install packages (Ubuntu)
      if: runner.os == 'Linux' && matrix.packages
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ matrix.packages }}

    - name: Generate project files
      run: |
        [ -d ${{ matrix.build-dir || '.' }} ] || mkdir ${{ matrix.build-dir || '.' }}
        cd ${{ matrix.build-dir || '.' }}
        ${{ matrix.src-dir || '.' }}/configure ${{ matrix.configure-args }}
      env:
        CC: ${{ matrix.compiler }}
        CFLAGS: ${{ matrix.cflags }}
        LDFLAGS: ${{ matrix.ldflags }}
        CHOST: ${{ matrix.chost }}

    - name: Compile source code
      run: make -j2
      working-directory: ${{ format('zlib/{0}', matrix.build-dir || '.') }}

    - name: Run test cases
      run: |
        make test
        make cover
      working-directory: ${{ format('zlib/{0}', matrix.build-dir || '.') }}
      env:
        QEMU_RUN: ${{ matrix.qemu-run }}

    - name: Upload build errors
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      if: failure()
      with:
        name: ${{ matrix.name }} (configure)
        path: |
          ${{ matrix.build-dir || '.' }}/configure.log

  eval:
    name: System Evaluation
    needs: prepare
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.is-schedule != 'true'
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run full evaluation
        id: eval
        env:
          NIX_PATH: nixpkgs=channel:nixos-unstable
        run: |
          set -euo pipefail
          result=$(nix-build --expr '
            let
              pkgs = import <nixpkgs> {};
              evalModule = import ./ci/eval {
                inherit (pkgs) lib runCommand cmake nix jq;
              };
              eval = evalModule {};
            in eval.full
          ')
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Publish evaluation summary
        if: steps.eval.outputs.result != ''
        run: |
          summary="${{ steps.eval.outputs.result }}/summary.md"
          if [ -f "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "CI evaluation succeeded (no summary file)." >> "$GITHUB_STEP_SUMMARY"
          fi

  build-zlib-MSys:
    timeout-minutes: 10
    runs-on: windows-latest
    needs: prepare
    if: needs.prepare.outputs.run-zlib == 'true'
    strategy:
      fail-fast: false
      matrix:
        sys: [mingw32, mingw64, ucrt64, clang64]
    name: MSys - ${{ matrix.sys }}
