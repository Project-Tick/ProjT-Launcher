name: Python Atheris Fuzz

on:
  schedule:
    - cron: "0 5 * * 2"
  workflow_dispatch:
  pull_request:
    branches:
      - "develop"
      - "release-*"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt atheris
      - name: Run Atheris
        run: |
          python fuzz/meta/fuzz_meta_models.py -runs=2000
