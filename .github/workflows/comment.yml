name: Comment

on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  # React to merge bot commands with instant feedback
  react:
    name: React to commands
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: contains(github.event.comment.body, '@projt-launcher-bot merge')
    
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            ci/github-script

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd ci/github-script
          npm install
          npm ci --omit=dev

      - name: React to comment
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          retries: 3
          script: |
            const { handleMergeComment } = require('./ci/github-script/merge.js');
            const { body, node_id } = context.payload.comment;

            await handleMergeComment({
              github,
              body,
              node_id,
              reaction: 'EYES',
            });
