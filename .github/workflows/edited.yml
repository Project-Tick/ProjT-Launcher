# =============================================================================
# ProjT Launcher - Base Branch Change Handler
# =============================================================================
# Handles PR base branch changes by re-triggering CI workflows.
# =============================================================================

name: "Edited base branch"

on:
  pull_request_target:
    types: [edited]

concurrency:
  group: edited-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  base:
    name: Trigger jobs on base change
    runs-on: ubuntu-latest
    if: github.event.changes.base.ref.from && github.event.changes.base.ref.from != github.event.pull_request.base.ref
    timeout-minutes: 2
    
    steps:
      - name: Re-trigger CI by closing and reopening PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const pr_number = context.payload.pull_request.number;
            
            core.info(`Base branch changed from ${context.payload.changes.base.ref.from} to ${context.payload.pull_request.base.ref}`);
            core.info(`Re-triggering CI for PR #${pr_number}`);
            
            // Close and reopen to trigger CI
            await github.rest.pulls.update({
              ...context.repo,
              pull_number: pr_number,
              state: 'closed'
            });
            
            await github.rest.pulls.update({
              ...context.repo,
              pull_number: pr_number,
              state: 'open'
            });
            
            core.info('PR reopened successfully');
