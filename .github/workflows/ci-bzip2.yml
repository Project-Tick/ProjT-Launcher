name: CI Bzip2

# This workflow is called by ci-new.yml only.
# Do not add push/pull_request triggers here.
on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
      run-bzip2:
        description: 'Whether to run bzip2 jobs'
        required: false
        type: string
        default: 'true'

jobs:
  bzip2-debian-testing-meson:
    if: inputs.run-bzip2 == 'true'
    timeout-minutes: 10
    name: Debian (testing) - Meson
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bzip2
    container:
      image: debian:testing
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Install deps
        run: |
          apt-get update -y
          apt-get install -y gcc meson python3-setuptools python3-pytest valgrind

      - name: Build (meson)
        run: |
          meson builddir
          ninja -C builddir
          meson test -C builddir --print-errorlogs || true

      - name: Collect meson log
        run: |
          cp builddir/meson-logs/meson-log.txt . || true

      - name: Upload meson log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: bzip2-meson-log-debian-testing
          path: meson-log.txt

  bzip2-debian-testing-cmake-debug:
    if: inputs.run-bzip2 == 'true'
    timeout-minutes: 10
    name: Debian (testing) - CMake Debug
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bzip2
    container:
      image: debian:testing
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Install deps
        run: |
          apt-get update -y
          apt-get install -y gcc make python3-pytest cmake valgrind build-essential libssl-dev qt6-base-dev qt6-base-dev-tools qt6-5compat-dev qt6-networkauth-dev

      - name: Build (cmake debug)
        run: |
          mkdir builddir && cd builddir
          cmake .. -DCMAKE_BUILD_TYPE="Debug" -D ENABLE_SHARED_LIB=ON -D ENABLE_STATIC_LIB=OFF
          cmake --build .
          make check || true

      - name: Collect CMakeOutput.log
        run: |
          cp builddir/CMakeFiles/CMakeOutput.log . || true

      - name: Upload CMakeOutput.log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: bzip2-CMakeOutput-debian-debug
          path: CMakeOutput.log

