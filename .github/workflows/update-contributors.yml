name: Update contributors

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  build:
    if: github.repository_owner == 'Project-Tick'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v6

      - uses: pnpm/action-setup@v4
        name: Install pnpm

      - name: Install dependencies & update contributors
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_MEMBERS_TOKEN }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run update-contributors

      - name: Commit files
        run: |
          git config --local user.email "gitbot@yongdohyun.org.tr"
          git config --local user.name "Project-Tick-Bot"
          git add :/
          git commit -m "Update contributors" || true

      - name: Create PR
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          base: "main"
          branch: "update-contributors"
          delete-branch: true
          title: "chore: update contributors"
          body: "Automated pull request to update contributors"

      - name: Enable Pull Request Automerge
        if: steps.cpr.outputs.pull-request-operation == 'created'
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: merge
