          gpg-private-key-id: ${{ secrets.LINUX_GPG_ID }}

  build-windows-msvc:
    name: Build (${{ matrix.artifact-name }})
    needs: [project-checkout]
    permissions:
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact-name: Windows-MSVC
            cmake-preset: windows_msvc
            vcvars-arch: amd64

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    env:
      ARTIFACT_NAME: ${{ matrix.artifact-name }}-Qt6
      BUILD_PLATFORM: official
      CMAKE_PRESET: ${{ matrix.cmake-preset }}

    steps:

      - name: Set build type
        run: echo "BUILD_TYPE=${{ inputs.build-type || 'Debug' }}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v6
        with:
