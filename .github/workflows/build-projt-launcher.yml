        run: echo "VERSION=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || steps.short-version.outputs.version }}" >> $GITHUB_ENV

      - name: Package (macOS)
        if: ${{ runner.os == 'macOS' }}
        uses: ./.github/actions/package/macos
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: ${{ matrix.artifact-name }}
          apple-codesign-cert: ${{ secrets.APPLE-CODESIGN-CERT }}
          apple-codesign-password: ${{ secrets.APPLE-CODESIGN_PASSWORD }}
          apple-codesign-id: ${{ secrets.APPLE-CODESIGN_ID }}
          apple-notarize-apple-id: ${{ secrets.APPLE_NOTARIZE_APPLE_ID }}
          apple-notarize-team-id: ${{ secrets.APPLE_NOTARIZE_TEAM_ID }}
          apple-notarize-password: ${{ secrets.APPLE-NOTARIZE_PASSWORD }}
          sparkle-ed25519-key: ${{ secrets.SPARKLE-ED25519_KEY }}

  flatpak-build:
    name: Flatpak Build (${{ matrix.arch }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64

          - os: ubuntu-24.04-arm
            arch: aarch64

    runs-on: ${{ matrix.os }}

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CHECKOUT_REF }}
          submodules: true

      - name: Set short version
        id: short-version
        shell: bash
        run: |
          echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Free disk space
        shell: bash
        run: |
          df -h
          rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift || true
          rm -rf /var/lib/apt/lists/* /var/cache/apt/* || true
          if command -v apt-get >/dev/null 2>&1; then
            apt-get clean || true
          fi
          df -h

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ProjTLauncher-${{ runner.os }}-${{ steps.short-version.outputs.version }}-Flatpak.flatpak
          manifest-path: flatpak/tr.org.projecttick.ProjTLauncher.yml
          arch: ${{ matrix.arch }}

  nix-system-build:
    name: Build via Nix (${{ matrix.system }})
    needs: [flake-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          - os: macos-latest
            system: aarch64-darwin
    
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.CHECKOUT_REF }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build package via Nix (Debug)
        if: github.ref_type != 'tag'
        run: |
          nix build --no-link --print-build-logs .#packages.${{ matrix.system }}.projtlauncher-debug || \
          nix build --no-link --print-build-logs .#projtlauncher

      - name: Build package via Nix (Release)
        if: github.ref_type == 'tag'
        run: |
          nix build --no-link --print-build-logs .#packages.${{ matrix.system }}.projtlauncher || \
          nix build --no-link --print-build-logs .#projtlauncher

      - name: Install package for testing
        run: |
          nix profile install .#packages.${{ matrix.system }}.projtlauncher || \
          nix profile install .#projtlauncher || \
          echo "Package installation skipped or not available"

      - name: Run tests via Nix
        continue-on-error: true
        run: |
          nix build --no-link --print-build-logs .#checks.${{ matrix.system }}.default || \
          echo "No tests defined in flake"

      - name: Build package with result link
        id: build-result
        run: |
          # Build with result link for artifact upload
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            nix build --print-build-logs .#packages.${{ matrix.system }}.projtlauncher -o result || \
            nix build --print-build-logs .#projtlauncher -o result
          else
            nix build --print-build-logs .#packages.${{ matrix.system }}.projtlauncher-debug -o result || \
            nix build --print-build-logs .#projtlauncher -o result
          fi
          
          # Check if result exists
          if [ -L result ]; then
            echo "result-path=$(readlink -f result)" >> $GITHUB_OUTPUT
            echo "has-result=true" >> $GITHUB_OUTPUT
          else
            echo "has-result=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Nix package
        if: steps.build-result.outputs.has-result == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ProjTLauncher-Nix-${{ matrix.system }}-${{ github.sha }}
          path: result/**/*
          retention-days: 7
          if-no-files-found: warn
