    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-11-arm
            artifact-name: Windows-MinGW-arm64
            cmake-preset: windows_mingw
            msystem: CLANGARM64
            vcvars-arch: arm64

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: msys2 {0}

    env:
      ARTIFACT_NAME: ${{ matrix.artifact-name }}-Qt6
      BUILD_PLATFORM: official
      CMAKE_PRESET: ${{ matrix.cmake-preset }}

    steps:

      - name: Set build type
