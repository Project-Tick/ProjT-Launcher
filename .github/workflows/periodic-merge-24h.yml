# =============================================================================
# ProjT Launcher - Periodic Branch Merge (Daily)
# =============================================================================
# Periodically merges develop into release branches to keep them up to date.
# =============================================================================

name: "Periodic Merges (Daily)"

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      from:
        description: 'Source branch'
        required: true
        default: 'develop'
      into:
        description: 'Target branch'
        required: true
        default: 'qml_migration'

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  periodic-merge:
    name: Merge ${{ matrix.pairs.from }} → ${{ matrix.pairs.into }}
    if: github.repository_owner == 'Project-Tick'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pairs:
          - from: develop
            into: qml_migration
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge branches (auto-resolve conflicts preferring source)
        run: |
          FROM="${{ matrix.pairs.from }}"
          INTO="${{ matrix.pairs.into }}"
          
          echo "Merging $FROM into $INTO"
          
          git fetch origin "$FROM" "$INTO"
          git checkout "$INTO"
          
          # First try a standard merge preferring source changes
          if git merge --no-edit -X theirs "origin/$FROM"; then
            git push origin "$INTO"
            echo "✅ Merge successful"
            exit 0
          fi

          echo "⚠️ Merge conflicts detected; force-resolving in favor of source ($FROM) except README.md"

          # Force resolve by taking all files from source and keeping target README.md from destination
          git checkout --theirs . || true

          # Clean up delete/modify conflicts by honoring source deletions
          git status --porcelain | awk '$1 ~ /^UD/ || $1 ~ /^DU/' | while read -r _ path; do
            echo "Removing $path (deleted in $FROM)"
            git rm -f -- "$path" || true
          done

          git checkout --ours README.md || true
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit after auto-resolve"
          else
            git commit -m "Auto-resolve conflicts preferring $FROM (README kept from $INTO)"
          fi
          git push origin "$INTO"
          echo "✅ Merge forced in favor of $FROM"
