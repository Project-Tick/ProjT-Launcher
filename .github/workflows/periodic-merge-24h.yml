name: "Periodic Merges (Daily) (not needed anymore)"

on:
  # schedule:
  #   # Run daily at midnight UTC
  #   - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      from:
        description: 'Source branch'
        required: true
        default: 'develop'
        type: string
      into:
        description: 'Target branch'
        required: true
        default: 'qml_migration'
        type: string

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  periodic-merge:
    name: Merge ${{ matrix.pairs.from }} → ${{ matrix.pairs.into }}
    if: github.repository_owner == 'Project-Tick'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pairs:
          - from: develop
            into: qml_migration
    env:
      FROM: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.from || matrix.pairs.from }}
      INTO: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.into || matrix.pairs.into }}
    
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare merge branch
        id: prep
        run: |
          FROM="${FROM}"
          INTO="${INTO}"
          BRANCH="auto-merge/${INTO}-from-${FROM}-$(date +%Y%m%d%H%M%S)"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Merge branches (auto-resolve conflicts preferring source)
        run: |
          FROM="${FROM}"
          INTO="${INTO}"
          BRANCH="${{ steps.prep.outputs.branch }}"
          
          echo "Merging $FROM into $INTO"
          
          git fetch origin "$FROM" "$INTO"
          git checkout -b "$BRANCH" "origin/$INTO"
          
          # First try a standard merge preferring source changes
          if git merge --no-edit -X theirs "origin/$FROM"; then
            git push origin "$BRANCH"
            echo "✅ Merge successful"
            exit 0
          fi

          echo "⚠️ Merge conflicts detected; force-resolving in favor of source ($FROM) except README.md"

          # Force resolve by taking all files from source and keeping target README.md from destination
          git checkout --theirs . || true

          # Clean up delete/modify conflicts by honoring source deletions
          git status --porcelain | awk '$1 ~ /^UD/ || $1 ~ /^DU/' | while read -r _ path; do
            echo "Removing $path (deleted in $FROM)"
            git rm -f -- "$path" || true
          done

          git checkout --ours README.md || true
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit after auto-resolve"
          else
            git commit -m "Auto-resolve conflicts preferring $FROM (README kept from $INTO)"
          fi
          git push origin "$BRANCH"
          echo "✅ Merge forced in favor of $FROM"

      - name: Open PR for merged branch
        uses: actions/github-script@v8
        env:
          FROM: ${{ env.FROM }}
          INTO: ${{ env.INTO }}
          BRANCH: ${{ steps.prep.outputs.branch }}
        with:
          script: |
            const { FROM, INTO, BRANCH } = process.env;
            const title = `chore: Auto-merge ${FROM} into ${INTO}`;
            const body = `Automated merge from \`${FROM}\` into \`${INTO}\``;

            // If a PR with the same head/base exists, reuse it.
            const prs = await github.rest.pulls.list({
              ...context.repo,
              state: 'open',
              head: `${context.repo.owner}:${BRANCH}`,
              base: INTO,
            });

            if (prs.data.length > 0) {
              core.info(`PR already exists: ${prs.data[0].html_url}`);
              return;
            }

            const { data: pr } = await github.rest.pulls.create({
              ...context.repo,
              title,
              body,
              head: BRANCH,
              base: INTO,
              maintainer_can_modify: true,
            });

            core.info(`Created PR: ${pr.html_url}`)
