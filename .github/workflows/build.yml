
name: General Evaluation Process

on:
  push:
    branches:
      - "develop"
      - "release-*"
      - "qml_migration"
    paths:
      # Core build and source paths
      - "launcher/**"
      - "libraries/**"
      - "tests/**"
      - "buildconfig/**"
      - "cmake/**"
      - "program_info/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "ci/**"
      - ".github/**"
      - "flake.nix"
      - "shell.nix"
      - "default.nix"
      - "nix/**"
      - "flatpak/**"
      - "debian/**"
  merge_group:
  workflow_call:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Debug
  workflow_dispatch:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Debug
      version:
        description: Launcher version
        required: false
      artifact-name:
        description: Name of the uploaded artifact
        required: false
        default: Linux
      qt-version:
        description: Version of Qt to use
        required: false
        default: 6.10.0
      qt-architecture:
        description: Qt architecture
        required: false
      gpg-private-key:
        description: Private key for AppImage signing
        required: false
      gpg-private-key-id:
        description: ID for the gpg-private-key, to select the signing key
        required: false
      apple-codesign-cert:
        description: Certificate for signing macOS builds
        required: false
      apple-codesign-password:
        description: Password for signing macOS builds
        required: false
      apple-codesign-id:
        description: Certificate ID for signing macOS builds
        required: false
      apple-notarize-apple-id:
        description: Apple ID used for notarizing macOS builds
        required: false
      apple-notarize-team-id:
        description: Team ID used for notarizing macOS builds
        required: false
      apple-notarize-password:
        description: Password used for notarizing macOS builds
        required: false
      sparkle-ed25519-key:
        description: Private key for signing Sparkle updates
        required: false
      msystem:
        description: MSYS2 subsystem to use
        required: false
      windows-codesign-cert:
        description: Certificate for signing Windows builds
        required: false
      windows-codesign-password:
        description: Password for signing Windows builds
        required: false
      vcvars-arch:
        description: Visual Studio architecture to use
        required: false
        default: amd64
      ref:
        description: 'Ref (branch, tag, or SHA) to check out'
        required: false
      path:
        description: 'Path to place the repository'
        required: false
      fetch-depth:
        description: 'Fetch depth (default 0 = full history)'
        required: false
        default: '0'
      submodules:
        description: 'Checkout submodules (true/false/recursive)'
        required: false
        default: 'true'
      app_id:
        description: 'Application ID'
        required: false
      git_ref:
        description: 'Git reference'
        required: false

permissions:
  contents: read

jobs:
  prepare:
    uses: ./.github/buildsystem/buildsystem-check-prepare.yml
    with:
      build-type: ${{ github.event.inputs.build-type || 'Debug' }}
      version: ${{ github.event.inputs.version }}
      artifact-name: ${{ github.event.inputs['artifact-name'] || 'Linux' }}
      qt-version: ${{ github.event.inputs['qt-version'] || '6.10.0' }}
