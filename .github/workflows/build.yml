      gpg-private-key: ${{ github.event.inputs['gpg-private-key'] }}
      gpg-private-key-id: ${{ github.event.inputs['gpg-private-key-id'] }}
      apple-codesign-cert: ${{ github.event.inputs['apple-codesign-cert'] }}
      apple-codesign-password: ${{ github.event.inputs['apple-codesign-password'] }}
      apple-codesign-id: ${{ github.event.inputs['apple-codesign-id'] }}
      apple-notarize-apple-id: ${{ github.event.inputs['apple-notarize-apple-id'] }}
      apple-notarize-team-id: ${{ github.event.inputs['apple-notarize-team-id'] }}
      apple-notarize-password: ${{ github.event.inputs['apple-notarize-password'] }}
      sparkle-ed25519-key: ${{ github.event.inputs['sparkle-ed25519-key'] }}
      msystem: ${{ github.event.inputs.msystem }}
      windows-codesign-cert: ${{ github.event.inputs['windows-codesign-cert'] }}
      windows-codesign-password: ${{ github.event.inputs['windows-codesign-password'] }}
      vcvars-arch: ${{ github.event.inputs['vcvars-arch'] || 'amd64' }}
      ref: ${{ github.event.inputs.ref }}
      path: ${{ github.event.inputs.path }}
      fetch-depth: ${{ github.event.inputs['fetch-depth'] || '0' }}
      submodules: ${{ github.event.inputs.submodules || 'true' }}
      app_id: ${{ github.event.inputs.app_id }}
      git_ref: ${{ github.event.inputs.git_ref }}
