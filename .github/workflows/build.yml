    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact-name: Linux
            cmake-preset: linux

    runs-on: ${{ matrix.os }}

    env:
      ARTIFACT_NAME: ${{ matrix.artifact-name }}-Qt6
      BUILD_PLATFORM: official
      CMAKE_PRESET: ${{ matrix.cmake-preset }}

    steps:

      - name: Set build type
        run: echo "BUILD_TYPE=${{ inputs.build-type || github.event.inputs.build-type || 'Debug' }}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CHECKOUT_REF }}
          submodules: true

      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
