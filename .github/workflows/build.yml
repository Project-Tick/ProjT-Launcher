    needs: [flake-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          - os: macos-latest
            system: aarch64-darwin
    
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.CHECKOUT_REF }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build package via Nix (Debug)
        if: github.ref_type != 'tag'
        run: |
          nix build --no-link --print-build-logs .#packages.${{ matrix.system }}.projtlauncher-debug || \
          nix build --no-link --print-build-logs .#projtlauncher

      - name: Build package via Nix (Release)
        if: github.ref_type == 'tag'
        run: |
          nix build --no-link --print-build-logs .#packages.${{ matrix.system }}.projtlauncher || \
          nix build --no-link --print-build-logs .#projtlauncher

      - name: Install package for testing
        run: |
          nix profile install .#packages.${{ matrix.system }}.projtlauncher || \
          nix profile install .#projtlauncher || \
          echo "Package installation skipped or not available"

      - name: Run tests via Nix
        continue-on-error: true
        run: |
          nix build --no-link --print-build-logs .#checks.${{ matrix.system }}.default || \
          echo "No tests defined in flake"

      - name: Build package with result link
        id: build-result
        run: |
          # Build with result link for artifact upload
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            nix build --print-build-logs .#packages.${{ matrix.system }}.projtlauncher -o result || \
            nix build --print-build-logs .#projtlauncher -o result
          else
            nix build --print-build-logs .#packages.${{ matrix.system }}.projtlauncher-debug -o result || \
            nix build --print-build-logs .#projtlauncher -o result
          fi
          
          # Check if result exists
          if [ -L result ]; then
            echo "result-path=$(readlink -f result)" >> $GITHUB_OUTPUT
            echo "has-result=true" >> $GITHUB_OUTPUT
          else
            echo "has-result=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Nix package
        if: steps.build-result.outputs.has-result == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ProjTLauncher-Nix-${{ matrix.system }}-${{ github.sha }}
          path: result/**/*
          retention-days: 7
          if-no-files-found: warn

  eval-status:
    name: Dependency Check Status Report
    runs-on: ubuntu-latest
    needs: [verify-vcpkg, cmake-windows-mingw-preset-config, cmake-windows-msvc-preset-config, cmake-windows-mingw-arm64-preset-config, cmake-windows-msvc-arm64-preset-config, cmake-linux-preset-config, cmake-macos-preset-config]
    if: always()

    steps:
      - name: Check evaluation results
        id: check-results
        run: |
          echo "## Dependency Check Status Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow:** Dependency Check" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          deps_result='${{ needs.verify-vcpkg.result }}'
          cmake_results=(
            '${{ needs.cmake-windows-mingw-preset-config.result }}'
            '${{ needs.cmake-windows-msvc-preset-config.result }}'
            '${{ needs.cmake-windows-mingw-arm64-preset-config.result }}'
            '${{ needs.cmake-windows-msvc-arm64-preset-config.result }}'
            '${{ needs.cmake-linux-preset-config.result }}'
            '${{ needs.cmake-macos-preset-config.result }}'
          )

          cmake_status="success"
          any_cmake=false
          for r in "${cmake_results[@]}"; do
            [[ -z "$r" ]] && continue
            any_cmake=true
            if [[ "$r" == "failure" ]]; then cmake_status="failure"; break; fi
            if [[ "$r" == "cancelled" && "$cmake_status" != "failure" ]]; then cmake_status="cancelled"; fi
          done
          if [[ "$cmake_status" == "success" && "$any_cmake" == false ]]; then
            cmake_status="skipped"
          fi

          echo "**Dependencies Check:** \`$deps_result\`" >> $GITHUB_STEP_SUMMARY
          echo "**CMake Config:** \`$cmake_status\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "$deps_result" == "failure" || "$cmake_status" == "failure" ]]; then
            status="failure"; exit_code=1
            echo "**Status:** Dependency Check Failed" >> $GITHUB_STEP_SUMMARY
          elif [[ "$deps_result" == "cancelled" || "$cmake_status" == "cancelled" ]]; then
            status="cancelled"; exit_code=1
            echo "**Status:** Dependency Check Cancelled" >> $GITHUB_STEP_SUMMARY
          elif [[ "$deps_result" == "success" && ( "$cmake_status" == "success" || "$cmake_status" == "skipped" ) ]]; then
            status="success"; exit_code=0
            echo "**Status:** Dependency Check Successful" >> $GITHUB_STEP_SUMMARY
          else
            status="unknown"; exit_code=1
            echo "**Status:** Unknown" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Full Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

          echo "status=$status" >> $GITHUB_OUTPUT
          exit $exit_code

  build-status:
    name: Build Status Report
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows-msvc, build-windows-msvc-arm64, build-windows-mingw, build-windows-mingw-arm64, build-macos]
    if: always()
    
    steps:
      - name: Check build results
        id: check-results
        run: |
          echo "## Build Status Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow:** Build" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check individual build results
          build_linux_result='${{ needs.build-linux.result }}'
          build_linux_arm64_result='${{ needs.build-linux-arm64.result }}'
          build_windows_msvc_result='${{ needs.build-windows-msvc.result }}'
          build_windows_msvc_arm64_result='${{ needs.build-windows-msvc-arm64.result }}'
          build_windows_mingw_result='${{ needs.build-windows-mingw.result }}'
          build_windows_mingw_arm64_result='${{ needs.build-windows-mingw-arm64.result }}'
          build_macos_result='${{ needs.build-macos.result }}'
          
          echo "**Build Results:**" >> $GITHUB_STEP_SUMMARY
          echo "- Linux: \`$build_linux_result\`" >> $GITHUB_STEP_SUMMARY
          echo "- Linux: \`$build_linux_arm64_result\`" >> $GITHUB_STEP_SUMMARY
          echo "- Windows MSVC: \`$build_windows_msvc_result\`" >> $GITHUB_STEP_SUMMARY
          echo "- Windows MSVC ARM64: \`$build_windows_msvc_arm64_result\`" >> $GITHUB_STEP_SUMMARY
          echo "- Windows MinGW: \`$build_windows_mingw_result\`" >> $GITHUB_STEP_SUMMARY
          echo "- Windows MinGW ARM64: \`$build_windows_mingw_arm64_result\`" >> $GITHUB_STEP_SUMMARY
          echo "- macOS: \`$build_macos_result\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Determine overall status
          if [[ "$build_linux_result" == "failure" ]] || [[ "$build_windows_msvc_result" == "failure" ]] || [[ "$build_windows_msvc_arm64_result" == "failure" ]] || [[ "$build_windows_mingw_result" == "failure" ]] || [[ "$build_windows_mingw_arm64_result" == "failure" ]] || [[ "$build_macos_result" == "failure" ]]; then
            status="failure"
            echo "**Status:** Build Failed" >> $GITHUB_STEP_SUMMARY
            exit_code=1
          elif [[ "$build_linux_result" == "cancelled" ]] || [[ "$build_windows_msvc_result" == "cancelled" ]] || [[ "$build_windows_msvc_arm64_result" == "cancelled" ]] || [[ "$build_windows_mingw_result" == "cancelled" ]] || [[ "$build_windows_mingw_arm64_result" == "cancelled" ]] || [[ "$build_macos_result" == "cancelled" ]]; then
            status="cancelled"
            echo "**Status:** Build Cancelled" >> $GITHUB_STEP_SUMMARY
            exit_code=1
          elif [[ "$build_linux_result" == "success" ]] && [[ "$build_windows_msvc_result" == "success" ]] && [[ "$build_windows_msvc_arm64_result" == "success" ]] && [[ "$build_windows_mingw_result" == "success" ]] && [[ "$build_windows_mingw_arm64_result" == "success" ]] && [[ "$build_macos_result" == "success" ]]; then
            status="success"
            echo "**Status:** Build Successful" >> $GITHUB_STEP_SUMMARY
            exit_code=0
          else
            status="unknown"
            echo "**Status:** Unknown" >> $GITHUB_STEP_SUMMARY
            exit_code=1
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Run ID:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run Number:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Actor:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Full Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          
          echo "status=$status" >> $GITHUB_OUTPUT
          exit $exit_code
      
      - name: Report final status
        if: always()
        run: |
          echo "Final build status: ${{ steps.check-results.outputs.status }}"

