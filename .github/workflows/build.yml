name: General Evaluation Process

on:
  workflow_call:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Debug
      force-prepare-yes:
        description: Force prepare job to enable tests/builds (used by release workflow)
        type: boolean
        default: false
      ref:
        description: 'Ref (branch, tag, or SHA) to check out'
        type: string
        required: false
  workflow_dispatch:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Debug
      force-prepare-yes:
        description: Force prepare job to enable tests/builds (used by release workflow)
        type: boolean
        default: false
      version:
        description: Launcher version
        required: true
      artifact-name:
        description: Name of the uploaded artifact
        required: true
        default: Linux
      qt-version:
        description: Version of Qt to use
        required: true
        default: 6.10.0
      qt-architecture:
        description: Qt architecture
        required: false
      gpg-private-key:
        description: Private key for AppImage signing
        required: false
      gpg-private-key-id:
        description: ID for the gpg-private-key, to select the signing key
        required: false
      apple-codesign-cert:
        description: Certificate for signing macOS builds
        required: false
      apple-codesign-password:
        description: Password for signing macOS builds
        required: false
      apple-codesign-id:
        description: Certificate ID for signing macOS builds
        required: false
      apple-notarize-apple-id:
        description: Apple ID used for notarizing macOS builds
        required: false
      apple-notarize-team-id:
        description: Team ID used for notarizing macOS builds
        required: false
      apple-notarize-password:
        description: Password used for notarizing macOS builds
        required: false
      sparkle-ed25519-key:
        description: Private key for signing Sparkle updates
        required: false
      msystem:
        description: MSYS2 subsystem to use
        required: false
      windows-codesign-cert:
        description: Certificate for signing Windows builds
        required: false
      windows-codesign-password:
        description: Password for signing Windows builds
        required: false
      vcvars-arch:
        description: Visual Studio architecture to use
        required: true
        default: amd64
      ref:
        description: 'Ref (branch, tag, or SHA) to check out'
        required: false
      path:
        description: 'Path to place the repository'
        required: false
      fetch-depth:
        description: 'Fetch depth (default 0 = full history)'
        required: false
        default: '0'
      submodules:
        description: 'Checkout submodules (true/false/recursive)'
        required: false
        default: 'true'
      app_id:
        description: 'Application ID'
        required: true
      git_ref:
        description: 'Git reference'
        required: true

permissions:
  contents: read

env:
  CHECKOUT_REF: ${{ inputs.ref || github.event.inputs.ref || github.event.pull_request.merge_commit_sha || github.event.pull_request.head.sha || github.sha }}
  CMAKE_CONFIGURE_ARGS: -Uqrencode_repo* -UWITH_TESTS -UWITH_TOOLS -UWITH_PNG -UBUILD_TESTING

jobs:
  prepare:
    name: Prepare Workflow
    runs-on: ubuntu-latest
    outputs:
      should-test: ${{ steps.check.outputs.should-test }}
      mergedSha: ${{ github.event.pull_request.head.sha || github.sha }}
      changed-files: ${{ steps.collect.outputs.changed-files }}
    
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.CHECKOUT_REF }}

      - name: Check for testable and buildable changes
        id: check
        env:
          FORCE_PREPARE_YES: ${{ inputs.force-prepare-yes || github.event.inputs.force-prepare-yes || 'false' }}
        run: |
          # Force the prepare job to green when explicitly requested (e.g., release workflow)
          if [ "$FORCE_PREPARE_YES" = "true" ]; then
            echo "should-test=true" >> $GITHUB_OUTPUT
            echo "Force flag enabled — running test/build."
            exit 0
          fi

          # Always test on pull requests (including workflow_call carrying PR payload)
          if [ -n "${{ github.event.pull_request.number || '' }}" ]; then
            echo "should-test=true" >> $GITHUB_OUTPUT
            echo "Pull request context detected — forcing test/build."
            exit 0
          fi

          # Always run for Dependabot pushes (branches like dependabot/*)
          if [ "${{ github.actor }}" = "dependabot[bot]" ] || [[ "${{ github.ref }}" =~ refs/heads/dependabot/ ]]; then
            echo "should-test=true" >> $GITHUB_OUTPUT
            echo "Dependabot update detected — forcing test/build."
            exit 0
          fi

          # Check if test-relevant files changed for push or dispatch
          regex="^(launcher|libraries|tests|buildconfig|cmake|program_info)/|CMakeLists.txt|.*\.cpp|.*\.h|.*\.ui"

          changed=$(git diff --name-only HEAD~1 | grep -E "$regex" || true)
          changed_count=$(printf "%s\n" "$changed" | sed '/^$/d' | wc -l)

          # Always run on manual dispatch or merge queue
          if [ "$changed_count" -gt 0 ] || [ "${{ github.event_name }}" == "workflow_dispatch" ] || [ "${{ github.event_name }}" == "merge_group" ]; then
            echo "should-test=true" >> $GITHUB_OUTPUT
            echo "Relevant changes detected or manual/queue trigger."
            printf "Changed:\n%s\n" "$changed"
          else
            echo "should-test=false" >> $GITHUB_OUTPUT
            echo "No relevant changes."
          fi

      - name: Collect changed files
        id: collect
        run: |
          git fetch --no-tags --prune --depth=100 origin +refs/heads/*:refs/remotes/origin/*
          base_ref=${{ github.event.pull_request.base.ref || github.event.before || 'origin/develop' }}
          git diff --name-only "$base_ref"...HEAD > changed.txt || true
          changed_files=$(cat changed.txt | tr '\n' ',' | sed 's/,$//')
          echo "changed-files=$changed_files" >> $GITHUB_OUTPUT

  flake-check:
    name: Flake Check
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.CHECKOUT_REF }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31.9.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake.nix syntax and outputs
        run: |
          nix flake show --all-systems

      - name: Run flake checks
        run: |
          nix flake check --show-trace

  project-checkout:
    needs: [prepare]
    name: Project Checkout Submodules
    runs-on: ubuntu-latest

    steps:
      - name: Resolve inputs safely
        id: resolved
        run: |
          # Resolve fetch-depth
          if [ -z "${{ github.event.inputs.fetch-depth }}" ]; then
            echo "depth=0" >> $GITHUB_OUTPUT
          else
            echo "depth=${{ github.event.inputs.fetch-depth }}" >> $GITHUB_OUTPUT
          fi

          # Resolve ref
          echo "ref=${{ env.CHECKOUT_REF }}" >> $GITHUB_OUTPUT

          # Resolve path (default repo root)
          if [ -z "${{ github.event.inputs.path }}" ]; then
            echo "path=." >> $GITHUB_OUTPUT
          else
            echo "path=${{ github.event.inputs.path }}" >> $GITHUB_OUTPUT
          fi

          # Resolve submodules
          if [ -z "${{ github.event.inputs.submodules }}" ]; then
            echo "submodules=recursive" >> $GITHUB_OUTPUT
          else
            echo "submodules=${{ github.event.inputs.submodules }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ steps.resolved.outputs.depth }}
          ref: ${{ steps.resolved.outputs.ref }}
          submodules: ${{ steps.resolved.outputs.submodules }}
          path: ${{ steps.resolved.outputs.path }}

      - name: Mark repo as safe directory
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Validate checkout state
        run: |
          echo "Checked out commit:"
          git -C "${{ steps.resolved.outputs.path }}" rev-parse HEAD

          echo "Submodule status:"
          git -C "${{ steps.resolved.outputs.path }}" submodule status || true

  cmake-linux-preset-config:
    name: Verify CMake Configuration (${{ matrix.artifact-name }})
    needs: [project-checkout]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    permissions:
      # Required for vcpkg binary cache
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact-name: Linux
            cmake-preset: linux

    defaults:
      run:
        shell: bash

    env:
      ARTIFACT_NAME: ${{ matrix.artifact-name }}-Qt6
      BUILD_PLATFORM: official
      BUILD_TYPE: Debug
      CMAKE_PRESET: ${{ matrix.cmake-preset }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.CHECKOUT_REF }}
          submodules: true
          
      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: ${{ matrix.artifact-name }}

      - name: Clean build directory for builds
        run: |
          rm -rf build

      - name: Configure CMake
        run: |
          cmake --preset "$CMAKE_PRESET" $CMAKE_CONFIGURE_ARGS
        continue-on-error: false

      - name: Report configuration status
        run: |
          if [ -f "build/CMakeCache.txt" ] || [ -d "out" ]; then
            echo "CMake configuration completed"
            echo "## CMake Configuration Successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "WARNING: CMake configuration may have issues"
            echo "## CMake Configuration Issues" >> $GITHUB_STEP_SUMMARY
          fi

