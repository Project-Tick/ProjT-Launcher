
name: General Evaluation Process

on:
  push:
    branches:
      - "develop"
      - "release-*"
      - "qml_migration"
    paths:
      # Core build and source paths
      - "launcher/**"
      - "libraries/**"
      - "tests/**"
      - "buildconfig/**"
      - "cmake/**"
      - "program_info/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "ci/**"
      - ".github/**"
      - "flake.nix"
      - "shell.nix"
      - "default.nix"
      - "nix/**"
      - "flatpak/**"
      - "debian/**"
  merge_group:
  workflow_call:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Debug
  workflow_dispatch:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Debug
      version:
        description: Launcher version
        required: true
      artifact-name:
        description: Name of the uploaded artifact
        required: true
        default: Linux
      qt-version:
        description: Version of Qt to use
        required: true
        default: 6.10.0
      qt-architecture:
        description: Qt architecture
        required: false
      gpg-private-key:
        description: Private key for AppImage signing
        required: false
      gpg-private-key-id:
        description: ID for the gpg-private-key, to select the signing key
        required: false
      apple-codesign-cert:
        description: Certificate for signing macOS builds
        required: false
      apple-codesign-password:
        description: Password for signing macOS builds
        required: false
      apple-codesign-id:
        description: Certificate ID for signing macOS builds
        required: false
      apple-notarize-apple-id:
        description: Apple ID used for notarizing macOS builds
        required: false
      apple-notarize-team-id:
        description: Team ID used for notarizing macOS builds
        required: false
      apple-notarize-password:
        description: Password used for notarizing macOS builds
        required: false
      sparkle-ed25519-key:
        description: Private key for signing Sparkle updates
        required: false
      msystem:
        description: MSYS2 subsystem to use
        required: false
      windows-codesign-cert:
        description: Certificate for signing Windows builds
        required: false
      windows-codesign-password:
        description: Password for signing Windows builds
        required: false
      vcvars-arch:
        description: Visual Studio architecture to use
        required: true
        default: amd64
      ref:
        description: 'Ref (branch, tag, or SHA) to check out'
        required: false
      path:
        description: 'Path to place the repository'
        required: false
      fetch-depth:
        description: 'Fetch depth (default 0 = full history)'
        required: false
        default: '0'
      submodules:
        description: 'Checkout submodules (true/false/recursive)'
        required: false
        default: 'true'
      app_id:
        description: 'Application ID'
        required: true
      git_ref:
        description: 'Git reference'
        required: true

permissions:
  contents: read

jobs:
  prepare:
    uses: ./.github/workflows/buildsystem/check/prepare.yml
    secrets: inherit

  verify-vcpkg:
    needs: prepare
    uses: ./.github/workflows/buildsystem/check/verify-vcpkg.yml
    secrets: inherit

  flake-check:
    needs: prepare
    uses: ./.github/workflows/buildsystem/check/flake-check.yml
    secrets: inherit

  project-checkout:
    needs: prepare
    uses: ./.github/workflows/buildsystem/check/project-checkout.yml
    secrets: inherit

  cmake-linux-preset-config:
    needs: project-checkout
    uses: ./.github/workflows/buildsystem/cmake-preset-config/linux/linux.yml
    permissions:
      packages: write
    secrets: inherit

  cmake-linux-arm64-preset-config:
    needs: project-checkout
    uses: ./.github/workflows/buildsystem/cmake-preset-config/linux/linux-arm64.yml
    permissions:
      packages: write
    secrets: inherit

  cmake-windows-mingw-preset-config:
    needs: [verify-vcpkg, project-checkout]
    uses: ./.github/workflows/buildsystem/cmake-preset-config/windows/mingw.yml
    permissions:
      packages: write
    secrets: inherit

  cmake-windows-mingw-arm64-preset-config:
    needs: [verify-vcpkg, project-checkout]
    uses: ./.github/workflows/buildsystem/cmake-preset-config/windows/mingw-arm64.yml
    permissions:
      packages: write
    secrets: inherit

  cmake-windows-msvc-preset-config:
    needs: [verify-vcpkg, project-checkout]
    uses: ./.github/workflows/buildsystem/cmake-preset-config/windows/msvc.yml
    permissions:
      packages: write
    secrets: inherit

  cmake-windows-msvc-arm64-preset-config:
    needs: [verify-vcpkg, project-checkout]
    uses: ./.github/workflows/buildsystem/cmake-preset-config/windows/msvc-arm64.yml
    permissions:
      packages: write
    secrets: inherit

  cmake-macos-preset-config:
    needs: project-checkout
    uses: ./.github/workflows/buildsystem/cmake-preset-config/macos/macos.yml
    permissions:
      packages: write
    secrets: inherit

  CodeQL:
    needs: project-checkout
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/buildsystem/code-scanning/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write
    secrets: inherit

  build-linux:
    needs: cmake-linux-preset-config
    uses: ./.github/workflows/buildsystem/buildsystem/linux/linux.yml
    permissions:
      packages: write
    secrets: inherit
    with:
      should-test: ${{ needs.prepare.outputs.should-test }}

  build-linux-arm64:
    needs: cmake-linux-arm64-preset-config
    uses: ./.github/workflows/buildsystem/buildsystem/linux/linux-arm64.yml
    permissions:
      packages: write
    secrets: inherit
    with:
      should-test: ${{ needs.prepare.outputs.should-test }}

  build-windows-msvc:
    needs: cmake-windows-msvc-preset-config
    uses: ./.github/workflows/buildsystem/buildsystem/windows/msvc.yml
    permissions:
      packages: write
    secrets: inherit
    with:
      should-test: ${{ needs.prepare.outputs.should-test }}

  build-windows-msvc-arm64:
    needs: cmake-windows-msvc-arm64-preset-config
    uses: ./.github/workflows/buildsystem/buildsystem/windows/msvc-arm64.yml
    permissions:
      packages: write
    secrets: inherit
    with:
      should-test: ${{ needs.prepare.outputs.should-test }}

  build-windows-mingw:
    needs: cmake-windows-mingw-preset-config
    uses: ./.github/workflows/buildsystem/buildsystem/windows/mingw.yml
    permissions:
      packages: write
    secrets: inherit
    with:
      should-test: ${{ needs.prepare.outputs.should-test }}

  build-windows-mingw-arm64:
    needs: cmake-windows-mingw-arm64-preset-config
    uses: ./.github/workflows/buildsystem/buildsystem/windows/mingw-arm64.yml
    permissions:
      packages: write
    secrets: inherit
    with:
      should-test: ${{ needs.prepare.outputs.should-test }}

  build-macos:
    needs: cmake-macos-preset-config
    uses: ./.github/workflows/buildsystem/buildsystem/macos/macos.yml
    permissions:
      packages: write
    secrets: inherit
    with:
      should-test: ${{ needs.prepare.outputs.should-test }}

  flatpak-build:
    needs: prepare
    uses: ./.github/workflows/buildsystem/buildsystem/flatpak/flatpak.yml
    secrets: inherit

  nix-system-build:
    needs: flake-check
    uses: ./.github/workflows/buildsystem/buildsystem/nix/system-build.yml
    secrets: inherit

  eval-status:
    needs:
      - verify-vcpkg
      - cmake-windows-mingw-preset-config
      - cmake-windows-msvc-preset-config
      - cmake-windows-mingw-arm64-preset-config
      - cmake-windows-msvc-arm64-preset-config
      - cmake-linux-preset-config
      - cmake-macos-preset-config
    uses: ./.github/workflows/buildsystem/status/eval.yml
    secrets: inherit
    with:
      verify-vcpkg-result: ${{ needs.verify-vcpkg.result }}
      cmake-windows-mingw-preset-config-result: ${{ needs.cmake-windows-mingw-preset-config.result }}
      cmake-windows-msvc-preset-config-result: ${{ needs.cmake-windows-msvc-preset-config.result }}
      cmake-windows-mingw-arm64-preset-config-result: ${{ needs.cmake-windows-mingw-arm64-preset-config.result }}
      cmake-windows-msvc-arm64-preset-config-result: ${{ needs.cmake-windows-msvc-arm64-preset-config.result }}
      cmake-linux-preset-config-result: ${{ needs.cmake-linux-preset-config.result }}
      cmake-macos-preset-config-result: ${{ needs.cmake-macos-preset-config.result }}

  codeql-status:
    needs: CodeQL
    uses: ./.github/workflows/buildsystem/status/codeql.yml
    secrets: inherit
    with:
      codeql-result: ${{ needs.CodeQL.result }}

  build-status:
    needs:
      - build-linux
      - build-linux-arm64
      - build-windows-msvc
      - build-windows-msvc-arm64
      - build-windows-mingw
      - build-windows-mingw-arm64
      - build-macos
    uses: ./.github/workflows/buildsystem/status/build.yml
    secrets: inherit
    with:
      build-linux-result: ${{ needs.build-linux.result }}
      build-linux-arm64-result: ${{ needs.build-linux-arm64.result }}
      build-windows-msvc-result: ${{ needs.build-windows-msvc.result }}
      build-windows-msvc-arm64-result: ${{ needs.build-windows-msvc-arm64.result }}
      build-windows-mingw-result: ${{ needs.build-windows-mingw.result }}
      build-windows-mingw-arm64-result: ${{ needs.build-windows-mingw-arm64.result }}
      build-macos-result: ${{ needs.build-macos.result }}

  test-status:
    needs:
      - build-linux
      - build-linux-arm64
      - build-windows-msvc
      - build-windows-msvc-arm64
      - build-windows-mingw
      - build-windows-mingw-arm64
      - build-macos
    uses: ./.github/workflows/buildsystem/status/test.yml
    secrets: inherit
    with:
      macos-result: ${{ needs.build-macos.result }}
      linux-result: ${{ needs.build-linux.result }}
      linux-arm64-result: ${{ needs.build-linux-arm64.result }}
      windows-msvc-result: ${{ needs.build-windows-msvc.result }}
      windows-msvc-arm64-result: ${{ needs.build-windows-msvc-arm64.result }}
      windows-mingw-result: ${{ needs.build-windows-mingw.result }}
      windows-mingw-arm64-result: ${{ needs.build-windows-mingw-arm64.result }}
