name: Zlib mingw/cygwin

on:
  push:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref (branch, tag, or SHA) to check out"
        required: false
concurrency:
  group: msys-cygwin-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  MSys:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        sys: [mingw32, mingw64, ucrt64, clang64]
    name: MSys - ${{ matrix.sys }}
    defaults:
      run:
        shell: msys2 {0}
        working-directory: zlib
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ inputs.ref || github.ref }}
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.sys }}
        update: true
        install: >-
          make
        pacboy: >-
          toolchain:p
          cmake:p
    - name: Configure
      run: |
        cmake -G"Unix Makefiles" \
          -S "$(cygpath -u "$GITHUB_WORKSPACE")/zlib" \
          -B "$(cygpath -u "$GITHUB_WORKSPACE")/zlib/build" \
          -DCMAKE_VERBOSE_MAKEFILE=ON \
          -DCMAKE_BUILD_TYPE=Release \
          -DMINIZIP_ENABLE_BZIP2=ON
    - name: Build
      run: cmake --build "$(cygpath -u "$GITHUB_WORKSPACE")/zlib/build" --config Release
    - name: Run tests
      run: ctest --output-on-failure --test-dir "$(cygpath -u "$GITHUB_WORKSPACE")/zlib/build" -C Release

  cygwin:
    strategy:
      fail-fast: false
    runs-on: windows-latest
    defaults:
      run:
        shell: C:\cygwin\bin\bash.exe --login -o igncr '{0}'
        working-directory: zlib
    name: Cygwin
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ inputs.ref || github.ref }}
    - name: Setup cygwin
      uses: cygwin/cygwin-install-action@master
      with:
        packages: >-
          cmake
          cygwin-devel
          gcc-core
          gcc-g++
          ninja
    - name: Configure
      run: |
        cmake -S "$(cygpath -u "$GITHUB_WORKSPACE")/zlib" \
          -B "$(cygpath -u "$GITHUB_WORKSPACE")/zlib/build" \
          -DCMAKE_BUILD_TYPE=Release \
          -DZLIB_BUILD_MINIZIP=ON \
          -DMINIZIP_ENABLE_BZIP2=OFF \
          -G Ninja
    - name: Build
      run: cmake --build "$(cygpath -u "$GITHUB_WORKSPACE")/zlib/build" --config Release -v -j1
    - name: Run tests
      run: ctest --output-on-failure --test-dir "$(cygpath -u "$GITHUB_WORKSPACE")/zlib/build" -C Release
