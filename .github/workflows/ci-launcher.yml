name: CI Launcher

on:
  workflow_call:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Debug
      ref:
        description: 'Ref (branch, tag, or SHA) to check out'
        type: string
        required: false
      output-root:
        description: Root directory for build outputs
        type: string
        required: false
        default: ""
      enable-windows-arm64:
        description: Enable Windows MSVC ARM64 build
        type: boolean
        required: false
        default: false
      qt-architecture:
        description: Qt architecture
        type: string
        required: false
  workflow_dispatch:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Debug
      force-prepare-yes:
        description: Force prepare job to enable tests/builds
        type: boolean
        default: false
      version:
        description: Launcher version
        required: true
      artifact-name:
        description: Name of the uploaded artifact
        required: true
        default: Linux
      output-root:
        description: Root directory for build outputs
        required: false
        default: ""
      qt-version:
        description: Version of Qt to use
        required: true
        default: 6.10.0
      qt-architecture:
        description: Qt architecture
        required: false
      gpg-private-key:
        description: Private key for AppImage signing
        required: false
      gpg-private-key-id:
        description: ID for the gpg-private-key, to select the signing key
        required: false
      apple-codesign-cert:
        description: Certificate for signing macOS builds
        required: false
      apple-codesign-password:
        description: Password for signing macOS builds
        required: false
      apple-codesign-id:
        description: Certificate ID for signing macOS builds
        required: false
      apple-notarize-apple-id:
        description: Apple ID used for notarizing macOS builds
        required: false
      apple-notarize-team-id:
        description: Team ID used for notarizing macOS builds
        required: false
      apple-notarize-password:
        description: Password used for notarizing macOS builds
        required: false
      sparkle-ed25519-key:
        description: Private key for signing Sparkle updates
        required: false
      msystem:
        description: MSYS2 subsystem to use
        required: false
      windows-codesign-cert:
        description: Certificate for signing Windows builds
        required: false
      windows-codesign-password:
        description: Password for signing Windows builds
        required: false
      vcvars-arch:
        description: Visual Studio architecture to use
        required: true
        default: amd64
      ref:
        description: 'Ref (branch, tag, or SHA) to check out'
        required: false
      path:
        description: 'Path to place the repository'
        required: false
      fetch-depth:
        description: 'Fetch depth (default 0 = full history)'
        required: false
        default: '0'

permissions:
  contents: read

env:
  NODE_NO_WARNINGS: 1
  CHECKOUT_REF: ${{ inputs.ref || github.event.inputs.ref || github.event.pull_request.merge_commit_sha || github.event.pull_request.head.sha || github.sha }}
  OUTPUT_ROOT: ${{ inputs.output-root || github.event.inputs.output-root || format('{0}/build/out', github.workspace) }}

jobs:
  build-launcher:
    environment: ${{ inputs.environment || '' }}
    name: Build (${{ matrix.artifact-name }})
    permissions:
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact-name: Linux
            target-platform: linux
            target-arch: x86_64
            qt-architecture: linux_gcc_64
            qt-modules: qtimageformats qtnetworkauth qtwebchannel qtwebengine qtpositioning qtserialport
            qt-version: 6.10.2

          - os: ubuntu-24.04-arm
            artifact-name: Linux-aarch64
            target-platform: linux
            target-arch: aarch64
            qt-architecture: linux_gcc_arm64
            qt-modules: qtimageformats qtnetworkauth qtwebchannel qtwebengine qtpositioning qtserialport
            qt-version: 6.10.2

          # Windows MSVC builds
          - os: windows-2022
            artifact-name: Windows-MSVC
            target-platform: windows
            windows-toolchain: msvc
            vcvars-arch: amd64
            qt-architecture: win64_msvc2022_64
            qt-modules: qtimageformats qtnetworkauth qtwebchannel qtwebengine qtpositioning qtserialport
            qt-version: 6.10.2

          - os: windows-2025
            artifact-name: Windows-MSVC-2025
            target-platform: windows
            windows-toolchain: msvc
            vcvars-arch: amd64
            qt-architecture: win64_msvc2022_64
            qt-modules: qtimageformats qtnetworkauth qtwebchannel qtwebengine qtpositioning qtserialport
            qt-version: 6.10.2

          - os: windows-11-arm
            artifact-name: Windows-MSVC-arm64
            target-platform: windows
            windows-toolchain: msvc
            target-arch: aarch64
            vcvars-arch: arm64
            qt-architecture: win64_msvc2022_arm64
            qt-modules: qtimageformats qtnetworkauth qtpositioning qtserialport
            qt-version: 6.10.2

          # Windows MinGW builds
          - os: windows-2022
            artifact-name: Windows-MinGW-w64
            target-platform: windows
            windows-toolchain: mingw
            msystem: MINGW64
            vcvars-arch: amd64_x86

          - os: windows-2025
            artifact-name: Windows-MinGW-w64-2025
            target-platform: windows
            windows-toolchain: mingw
            msystem: MINGW64
            vcvars-arch: amd64_x86

          - os: windows-11-arm
            artifact-name: Windows-MinGW-arm64
            target-platform: windows
            windows-toolchain: mingw
            target-arch: aarch64
            msystem: CLANGARM64
            vcvars-arch: arm64

          # macOS builds
          - os: macos-15
            artifact-name: macOS-15-universal
            target-platform: macos
            target-arch: universal
            macosx-deployment-target: 12.0
            qt-architecture: clang_64
            qt-modules: qtimageformats qtnetworkauth qtpositioning qtserialport qtwebengine qtwebchannel
            qt-version: 6.10.2

          - os: macos-26
            artifact-name: macOS-26-universal
            target-platform: macos
            target-arch: universal
            macosx-deployment-target: 12.0
            qt-architecture: clang_64
            qt-modules: qtimageformats qtnetworkauth qtpositioning qtserialport qtwebengine qtwebchannel
            qt-version: 6.10.2

          - os: macos-15
            artifact-name: macOS-15-arm64
            target-platform: macos
            target-arch: aarch64
            macosx-deployment-target: 12.0
            qt-architecture: clang_64
            qt-modules: qtimageformats qtnetworkauth qtpositioning qtserialport qtwebengine qtwebchannel
            qt-version: 6.10.2

          - os: macos-26
            artifact-name: macOS-arm64
            target-platform: macos
            target-arch: aarch64
            macosx-deployment-target: 12.0
            qt-architecture: clang_64
            qt-modules: qtimageformats qtnetworkauth qtpositioning qtserialport qtwebengine qtwebchannel
            qt-version: 6.10.2

          - os: macos-15-intel
            artifact-name: macOS-intel
            target-platform: macos
            target-arch: x86_64
            macosx-deployment-target: 12.0
            qt-architecture: clang_64
            qt-modules: qtimageformats qtnetworkauth qtpositioning qtserialport qtwebengine qtwebchannel
            qt-version: 6.10.2

    runs-on: ${{ matrix.os }}

    env:
      ARTIFACT_NAME: ${{ matrix.artifact-name }}
      BUILD_PLATFORM: official
      TARGET_PLATFORM: ${{ matrix.target-platform }}
      TARGET_ARCH: ${{ matrix.target-arch || 'x86_64' }}
      WINDOWS_TOOLCHAIN: ${{ matrix.windows-toolchain || 'mingw' }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx-deployment-target }}
      MSYS_NO_PATHCONV: ${{ matrix.windows-toolchain == 'msvc' && '1' || '' }}
      MSYS2_ARG_CONV_EXCL: ${{ matrix.windows-toolchain == 'msvc' && '*' || '' }}

    defaults:
      run:
        shell: ${{ matrix.msystem && 'msys2 {0}' || 'bash' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CHECKOUT_REF }}
          submodules: true
          fetch-depth: 1

      - name: Setup Dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          artifact-name: ${{ matrix.artifact-name }}
          msystem: ${{ matrix.msystem }}
          vcvars-arch: ${{ matrix.vcvars-arch }}
          qt-architecture: ${{ matrix.qt-architecture }}
          qt-version: ${{ matrix.qt-version || inputs.qt-version || '6.10.0' }}
          qt-modules: ${{ matrix.qt-modules || '' }}

      - name: Set build type
        run: echo "BUILD_TYPE=${{ inputs.build-type || 'Debug' }}" >> $GITHUB_ENV

      # Windows MSVC Setup
      - name: Setup MSVC Environment (Windows MSVC)
        if: runner.os == 'Windows' && matrix.windows-toolchain == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.vcvars-arch }}

      # Configure with Make system
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: |
          ./configure \
            --platform=linux \
            --arch=${{ matrix.target-arch || 'x86_64' }} \
            --build=${{ env.BUILD_TYPE }} \
            --qt-prefix="${{ steps.setup-dependencies.outputs.qt-path }}" \
            --with-tests

      - name: Configure (Windows MSVC)
        if: runner.os == 'Windows' && matrix.windows-toolchain == 'msvc'
        shell: bash
        run: |
          ./configure \
            --platform=windows \
            --build=${{ env.BUILD_TYPE }} \
            --arch=${{ matrix.target-arch || 'x86_64' }} \
            --qt-prefix="${{ steps.setup-dependencies.outputs.qt-path }}" \
            --with-tests

      - name: Configure (Windows MinGW)
        if: runner.os == 'Windows' && matrix.windows-toolchain == 'mingw'
        run: |
          if [ -n "${MSYSTEM:-}" ]; then
            msys_lc="$(echo "${MSYSTEM}" | tr '[:upper:]' '[:lower:]')"
            msys_bin="/${msys_lc}/bin"
            export PATH="${msys_bin}:$PATH"
            if [ -x "${msys_bin}/gcc" ] && [ -x "${msys_bin}/g++" ]; then
              export CC="${msys_bin}/gcc"
              export CXX="${msys_bin}/g++"
              export AR="${msys_bin}/ar"
              export RANLIB="${msys_bin}/ranlib"
            elif [ -x "${msys_bin}/clang" ] && [ -x "${msys_bin}/clang++" ]; then
              export CC="${msys_bin}/clang"
              export CXX="${msys_bin}/clang++"
              if [ -x "${msys_bin}/llvm-ar" ] && [ -x "${msys_bin}/llvm-ranlib" ]; then
                export AR="${msys_bin}/llvm-ar"
                export RANLIB="${msys_bin}/llvm-ranlib"
              else
                export AR="${msys_bin}/ar"
                export RANLIB="${msys_bin}/ranlib"
              fi
            fi
            hash -r
          fi
          export NO_CCACHE=1
          ./configure \
            --platform=windows \
            --arch=${{ matrix.target-arch || 'x86_64' }} \
            --build=${{ env.BUILD_TYPE }} \
            --with-tests

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          ./configure \
            --platform=macos \
            --arch=${{ matrix.target-arch || 'universal' }} \
            --build=${{ env.BUILD_TYPE }} \
            --qt-prefix="${{ steps.setup-dependencies.outputs.qt-path }}" \
            --with-tests

      # Build with Make
      - name: Build (Linux/macOS/MinGW)
        if: runner.os != 'Windows' || matrix.windows-toolchain == 'mingw'
        run: |
          if [ "${RUNNER_OS}" = "Windows" ] && [ "${WINDOWS_TOOLCHAIN}" = "mingw" ] && [ -n "${MSYSTEM:-}" ]; then
            msys_lc="$(echo "${MSYSTEM}" | tr '[:upper:]' '[:lower:]')"
            msys_bin="/${msys_lc}/bin"
            export PATH="${msys_bin}:$PATH"
            if [ -x "${msys_bin}/gcc" ] && [ -x "${msys_bin}/g++" ]; then
              export CC="${msys_bin}/gcc"
              export CXX="${msys_bin}/g++"
              export AR="${msys_bin}/ar"
              export RANLIB="${msys_bin}/ranlib"
            elif [ -x "${msys_bin}/clang" ] && [ -x "${msys_bin}/clang++" ]; then
              export CC="${msys_bin}/clang"
              export CXX="${msys_bin}/clang++"
              if [ -x "${msys_bin}/llvm-ar" ] && [ -x "${msys_bin}/llvm-ranlib" ]; then
                export AR="${msys_bin}/llvm-ar"
                export RANLIB="${msys_bin}/llvm-ranlib"
              else
                export AR="${msys_bin}/ar"
                export RANLIB="${msys_bin}/ranlib"
              fi
            fi
            export NO_CCACHE=1
            hash -r
          fi
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)

      - name: Build (Windows MSVC)
        if: runner.os == 'Windows' && matrix.windows-toolchain == 'msvc'
        shell: bash
        run: |
          make -j${NUMBER_OF_PROCESSORS:-4}

      # Run Tests
      - name: Run Tests (Linux/macOS/MinGW)
        if: runner.os != 'Windows' || matrix.windows-toolchain == 'mingw'
        run: |
          if [ "${RUNNER_OS}" = "Windows" ] && [ "${WINDOWS_TOOLCHAIN}" = "mingw" ] && [ -n "${MSYSTEM:-}" ]; then
            msys_lc="$(echo "${MSYSTEM}" | tr '[:upper:]' '[:lower:]')"
            msys_bin="/${msys_lc}/bin"
            export PATH="${msys_bin}:$PATH"
            if [ -x "${msys_bin}/gcc" ] && [ -x "${msys_bin}/g++" ]; then
              export CC="${msys_bin}/gcc"
              export CXX="${msys_bin}/g++"
              export AR="${msys_bin}/ar"
              export RANLIB="${msys_bin}/ranlib"
            elif [ -x "${msys_bin}/clang" ] && [ -x "${msys_bin}/clang++" ]; then
              export CC="${msys_bin}/clang"
              export CXX="${msys_bin}/clang++"
              if [ -x "${msys_bin}/llvm-ar" ] && [ -x "${msys_bin}/llvm-ranlib" ]; then
                export AR="${msys_bin}/llvm-ar"
                export RANLIB="${msys_bin}/llvm-ranlib"
              else
                export AR="${msys_bin}/ar"
                export RANLIB="${msys_bin}/ranlib"
              fi
            fi
            export NO_CCACHE=1
            hash -r
          fi
          make test TEST_VERBOSE=1

      - name: Run Tests (Windows MSVC)
        if: runner.os == 'Windows' && matrix.windows-toolchain == 'msvc'
        shell: bash
        run: |
          make test TEST_VERBOSE=1

      # Upload Artifacts
      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: build-${{ matrix.artifact-name }}
          path: build/

      - name: Upload test results
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.artifact-name }}
          path: build/tests/

      - name: Get short version
        id: short-version
        shell: bash
        run: |
          echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Package
      - name: Package (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/package/linux
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: ${{ matrix.artifact-name }}
          qt-version: ${{ steps.setup-dependencies.outputs.qt-version }}
          gpg-private-key: ${{ secrets.LINUX_GPG_KEY }}
          gpg-private-key-id: ${{ secrets.LINUX_GPG_ID }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/package/windows
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: ${{ matrix.artifact-name }}
          windows-codesign-cert: ${{ secrets.WINDOWS_CODESIGN_CERT }}
          windows-codesign-password: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
          msystem: ${{ matrix.msystem }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        uses: ./.github/actions/package/macos
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: ${{ matrix.artifact-name }}
          apple-codesign-cert: ${{ secrets.APPLE-CODESIGN-CERT }}
          apple-codesign-password: ${{ secrets.APPLE-CODESIGN_PASSWORD }}
          apple-codesign-id: ${{ secrets.APPLE-CODESIGN_ID }}
          apple-notarize-apple-id: ${{ secrets.APPLE_NOTARIZE_APPLE_ID }}
          apple-notarize-team-id: ${{ secrets.APPLE_NOTARIZE_TEAM_ID }}
          apple-notarize-password: ${{ secrets.APPLE-NOTARIZE_PASSWORD }}
          sparkle-ed25519-key: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
