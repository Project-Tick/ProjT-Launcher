# Backport workflow for releasing changes to stable branches

name: Backport

on:
  pull_request:
    types: [closed, labeled]

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  backport:
    name: Backport to Release Branch
    # Only run if PR is merged and has backport label
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'backport')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Extract target branch from label
        id: target
        run: |
          # Extract version from label like "backport/release-1.0" -> "release-1.0"
          label=$(echo "${{ github.event.pull_request.labels[*].name }}" | grep -o "backport/release-[0-9.]*" | head -1)
          if [ -z "$label" ]; then
            echo "No valid backport label found"
            exit 0
          fi
          target_branch="${label#backport/}"
          echo "target_branch=$target_branch" >> "$GITHUB_OUTPUT"
          echo "Creating backport to: $target_branch"

      - name: Create backport PR
        if: steps.target.outputs.target_branch != ''
        uses: actions/github-script@v8
        with:
          script: |
            const branch = '${{ steps.target.outputs.target_branch }}';
            const originalPR = context.payload.pull_request.number;
            const originalTitle = context.payload.pull_request.title;
            
            try {
              // Check if target branch exists
              await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: branch
              });
              
              // Create backport PR
              const response = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[backport ${branch}] ${originalTitle}`,
                body: `Backport of #${originalPR} to ${branch}\n\nPlease review and test before merging.`,
                head: `backport/${branch}/${originalPR}`,
                base: branch
              });
              
              console.log(`Created backport PR: #${response.data.number}`);
            } catch (error) {
              console.log(`Target branch ${branch} does not exist or already has a backport PR`);
            }
