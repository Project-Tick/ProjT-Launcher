name: CI Website

# This workflow is called by ci-new.yml only.
# Do not add push/pull_request triggers here.
on:
  workflow_call:
    inputs:
      run-website:
        required: true
        type: string
      is-pr:
        required: true
        type: string

jobs:
  build-website:
    if: inputs.run-website == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@65d868f8d4d85d7d4abb7de0875cde3fcc8798f5
        with:
          node-version: ${{ matrix.node-version }}

      - uses: pnpm/action-setup@1e1c8eafbd745f64b1ef30a7d7ed7965034c486c

      - name: Install Doxygen and Poxy for toml++ docs
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen python3-pip
          pip3 install --user poxy
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Handbook pages sync removed — site builds directly from website-root/handbook

      - name: Install dependencies & build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # ─────────────────────────────────────────────────────────────
      # POST-BUILD: Copy raw handbook markdown for direct access
      # ─────────────────────────────────────────────────────────────
      - name: Copy handbook raw markdown to _site
        run: |
          mkdir -p _site/handbook/raw
          cp docs/handbook/*.md _site/handbook/raw/ 2>/dev/null || true
          echo "✅ Raw handbook files copied"

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: ./_site

  deploy-website:
    if: inputs.run-website == 'true' && github.repository_owner == 'Project-Tick' && github.event_name == 'push'
    timeout-minutes: 5
    needs: [build-website]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@854d7aa1b99e4509c4d1b53d69b7ba4eaf39215a
