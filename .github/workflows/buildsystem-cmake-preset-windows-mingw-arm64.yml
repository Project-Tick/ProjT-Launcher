name: General Evaluation Process

on:
  workflow_call:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Debug

permissions:
  contents: read

jobs:
  cmake-windows-mingw-arm64-preset-config:
    name: Verify CMake Configuration (${{ matrix.artifact-name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    permissions:
      # Required for vcpkg binary cache
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-11-arm
            artifact-name: Windows-MinGW-arm64
            cmake-preset: windows_mingw
            msystem: CLANGARM64
            vcvars-arch: arm64

    defaults:
      run:
        shell: msys2 {0}

    env:
      ARTIFACT_NAME: ${{ matrix.artifact-name }}-Qt6
      BUILD_PLATFORM: official
      BUILD_TYPE: Debug
      CMAKE_PRESET: ${{ matrix.cmake-preset }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx-deployment-target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Enter VS Developer shell
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.vcvars-arch }}
          vsversion: 2022

      - name: Setup MSYS2 (MinGW)
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            git
          pacboy: >-
            toolchain:p
            ccache:p
            cmake:p
            extra-cmake-modules:p
            ninja:p
            qt6-base:p
            qt6-svg:p
            qt6-imageformats:p
            qt6-5compat:p
            qt6-networkauth:p
            qt6-declarative:p
            cmark:p
            tomlplusplus:p
            quazip-qt6:p

      - name: List pacman packages (MinGW)
        shell: msys2 {0}
        run: |
          pacman -Qe

      - name: Retrieve ccache cache (MinGW)
        uses: actions/cache@v5.0.1
        with:
          path: '${{ github.workspace }}\.ccache'
          key: ${{ runner.os }}-mingw-w64-ccache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-mingw-w64-ccache

      - name: Setup ccache (MinGW)
        shell: msys2 {0}
        run: |
          ccache --set-config=cache_dir='${{ github.workspace }}\.ccache'
          ccache --set-config=max_size='500M'
          ccache --set-config=compression=true
          ccache -p  # Show config

      - name: Clean build directory for builds
        run: |
          rm -rf build
          git clean -fdx libraries/zlib/

      - name: Configure CMake
        run: |
          cmake --preset "$CMAKE_PRESET"
        continue-on-error: false

      - name: Report configuration status
        run: |
          if [ -f "build/CMakeCache.txt" ] || [ -d "out" ]; then
            echo "CMake configuration completed"
            echo "## CMake Configuration Successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "WARNING: CMake configuration may have issues"
            echo "## CMake Configuration Issues" >> $GITHUB_STEP_SUMMARY
          fi
