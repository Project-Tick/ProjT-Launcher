name: Zlib OSS-Fuzz
on: [pull_request]
concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  scope:
    name: Scope Gate
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - name: Check PR template scope
        id: scope
        uses: actions/github-script@v8
        with:
          script: |
            const body = context.payload.pull_request?.body ?? "";
            const selected = /- \[[xX]\]\s+Zlib(\s|$)/.test(body);
            core.setOutput("run", selected ? "true" : "false");

  Fuzzing:
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.run == 'true'
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Fetch base branch
      if: github.event_name == 'pull_request'
      run: git fetch origin "${{ github.base_ref }}" --depth=1

    - name: Build Fuzzers
      uses: google/oss-fuzz/infra/cifuzz/actions/build_fuzzers@master
      with:
        oss-fuzz-project-name: 'zlib'
        project-src-path: .
        bad-build-check: false
        dry-run: false

    - name: Run Fuzzers
      uses: google/oss-fuzz/infra/cifuzz/actions/run_fuzzers@master
      with:
        oss-fuzz-project-name: 'zlib'
        project-src-path: .
        bad-build-check: false
        fuzz-seconds: 300
        dry-run: false

    - name: Upload Crash
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: artifacts
        path: ./out/artifacts
