name: CI Lint

# This workflow is called by ci-new.yml only.
# Do not add push/pull_request triggers here.
on:
  workflow_call:
    inputs:
      should-test:
        required: true
        type: string
      is-schedule:
        required: true
        type: string
      is-release:
        required: true
        type: string
      is-pr-closed:
        required: true
        type: string
      run-bot:
        required: true
        type: string
      run-meta:
        required: true
        type: string
      run-branding:
        required: true
        type: string
      head-ref:
        required: true
        type: string

jobs:
  clang-lint:
    timeout-minutes: 5
    name: Clang Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: ${{ inputs.head-ref }}

      - name: Check C++ formatting
        run: |
          if command -v clang-format &> /dev/null; then
            find launcher libraries -name "*.cpp" -o -name "*.h" | head -100 | while read file; do
              if ! clang-format --dry-run --Werror "$file" 2>/dev/null; then
                echo "Format issue: $file"
              fi
            done
          fi

  markdown-lint:
    timeout-minutes: 5
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: nosborn/github-action-markdown-cli@1a79194d2cebd7ebdf9f8079ab17f7761b14aec0
        with:
          files: .

  bot-smoke:
    timeout-minutes: 5
    name: Bot Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: actions/setup-node@65d868f8d4d85d7d4abb7de0875cde3fcc8798f5
        with:
          node-version: '20'
      - name: Check bot syntax
        run: node -c bot/index.js

  meta-smoke:
    timeout-minutes: 5
    name: Meta Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: actions/setup-python@4f41a90a1f38628c7ccc608d05fbafe701bc20ae
        with:
          python-version: '3.11'
      - name: Compile meta sources
        run: python -m compileall meta

  branding-check:
    timeout-minutes: 5
    name: Branding Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: actions/setup-python@4f41a90a1f38628c7ccc608d05fbafe701bc20ae
        with:
          python-version: '3.11'
      - name: Validate SVG assets
        run: |
          python - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          paths = []
          paths.extend(glob.glob("program_info/**/*.svg", recursive=True))
          paths.extend(glob.glob("website/img/**/*.svg", recursive=True))
          paths.extend(glob.glob("public/**/*.svg", recursive=True))

          if not paths:
            print("No SVG assets found to validate.")
            sys.exit(0)

          failures = []
          for path in paths:
            try:
              ET.parse(path)
            except Exception as exc:
              failures.append((path, str(exc)))

          if failures:
            for path, err in failures:
              print(f"Invalid SVG: {path}: {err}")
            sys.exit(1)
          print(f"Validated {len(paths)} SVG assets.")
          PY

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.repository_owner == 'Project-Tick'
    env:
      SKIP_CODEQL_TOOLCACHE_CLEANUP: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          submodules: "true"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4bdb89f48054571735e3792627da6195c57459e2
        with:
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-and-quality
          languages: c-cpp, java
          trap-caching: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: Debug
          artifact-name: Linux

      - name: Configure and Build
        run: |
          cmake --preset linux
          cmake --build --preset linux --config Debug

      - name: Build bundled libraries (standalone)
        run: |
          set -euo pipefail

          if [ -f "zlib/CMakeLists.txt" ]; then
            cmake -S zlib -B build-codeql/zlib -DCMAKE_BUILD_TYPE=Debug -DZLIB_BUILD_TESTING=OFF
            cmake --build build-codeql/zlib --config Debug
          fi

          if [ -f "bzip2/CMakeLists.txt" ]; then
            cmake -S bzip2 -B build-codeql/bzip2 -DCMAKE_BUILD_TYPE=Debug -DENABLE_LIB_ONLY=ON -DENABLE_TESTS=OFF -DENABLE_DOCS=OFF -DENABLE_EXAMPLES=OFF
            cmake --build build-codeql/bzip2 --config Debug
          fi

          if [ -f "quazip/CMakeLists.txt" ]; then
            cmake -S quazip -B build-codeql/quazip -DCMAKE_BUILD_TYPE=Debug -DQUAZIP_QT_MAJOR_VERSION=6 -DQUAZIP_ENABLE_TESTS=OFF -DBUILD_SHARED_LIBS=OFF
            cmake --build build-codeql/quazip --config Debug
          fi

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@4bdb89f48054571735e3792627da6195c57459e2
        with:
          category: "/language:c-cpp"

  eval:
    name: System Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run full evaluation
        id: eval
        env:
          NIX_PATH: nixpkgs=channel:nixos-unstable
        run: |
          set -euo pipefail
          result=$(nix-build --expr '
            let
              pkgs = import <nixpkgs> {};
              evalModule = import ./ci/eval {
                inherit (pkgs) lib runCommand cmake nix jq;
              };
              eval = evalModule {};
            in eval.full
          ')
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Publish evaluation summary
        if: steps.eval.outputs.result != ''
        run: |
          summary="${{ steps.eval.outputs.result }}/summary.md"
          if [ -f "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "CI evaluation succeeded (no summary file)." >> "$GITHUB_STEP_SUMMARY"
          fi
