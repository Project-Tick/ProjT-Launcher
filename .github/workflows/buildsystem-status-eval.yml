name: General Evaluation Process

on:
  workflow_call:
    inputs:
      should-test:
        description: Whether to run build/tests
        required: false
        default: 'true'
        type: string
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Debug
      version:
        description: Launcher version
        required: false
      artifact-name:
        description: Name of the uploaded artifact
        required: false
        default: Linux
      qt-version:
        description: Version of Qt to use
        required: false
        default: 6.10.0
      qt-architecture:
        description: Qt architecture
        required: false
      gpg-private-key:
        description: Private key for AppImage signing
        required: false
      gpg-private-key-id:
        description: ID for the gpg-private-key, to select the signing key
        required: false
      apple-codesign-cert:
        description: Certificate for signing macOS builds
        required: false
      apple-codesign-password:
        description: Password for signing macOS builds
        required: false
      apple-codesign-id:
        description: Certificate ID for signing macOS builds
        required: false
      apple-notarize-apple-id:
        description: Apple ID used for notarizing macOS builds
        required: false
      apple-notarize-team-id:
        description: Team ID used for notarizing macOS builds
        required: false
      apple-notarize-password:
        description: Password used for notarizing macOS builds
        required: false
      sparkle-ed25519-key:
        description: Private key for signing Sparkle updates
        required: false
      msystem:
        description: MSYS2 subsystem to use
        required: false
      windows-codesign-cert:
        description: Certificate for signing Windows builds
        required: false
      windows-codesign-password:
        description: Password for signing Windows builds
        required: false
      vcvars-arch:
        description: Visual Studio architecture to use
        required: false
        default: amd64
      ref:
        description: 'Ref (branch, tag, or SHA) to check out'
        required: false
      path:
        description: 'Path to place the repository'
        required: false
      fetch-depth:
        description: 'Fetch depth (default 0 = full history)'
        required: false
        default: '0'
      submodules:
        description: 'Checkout submodules (true/false/recursive)'
        required: false
        default: 'true'
      app_id:
        description: 'Application ID'
        required: false
      git_ref:
        description: 'Git reference'
        required: false

permissions:
  contents: read

jobs:
  eval-status:
    name: Dependency Check Status Report
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check evaluation results
        id: check-results
        run: |
          echo "## Dependency Check Status Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow:** Dependency Check" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          deps_result='${{ inputs.verify-vcpkg-result }}'
          cmake_results=(
            '${{ inputs.cmake-windows-mingw-preset-config-result }}'
            '${{ inputs.cmake-windows-msvc-preset-config-result }}'
            '${{ inputs.cmake-windows-mingw-arm64-preset-config-result }}'
            '${{ inputs.cmake-windows-msvc-arm64-preset-config-result }}'
            '${{ inputs.cmake-linux-preset-config-result }}'
            '${{ inputs.cmake-macos-preset-config-result }}'
          )

          cmake_status="success"
          any_cmake=false
          for r in "${cmake_results[@]}"; do
            [[ -z "$r" ]] && continue
            any_cmake=true
            if [[ "$r" == "failure" ]]; then cmake_status="failure"; break; fi
            if [[ "$r" == "cancelled" && "$cmake_status" != "failure" ]]; then cmake_status="cancelled"; fi
          done
          if [[ "$cmake_status" == "success" && "$any_cmake" == false ]]; then
            cmake_status="skipped"
          fi

          echo "**Dependencies Check:** \`$deps_result\`" >> $GITHUB_STEP_SUMMARY
          echo "**CMake Config:** \`$cmake_status\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "$deps_result" == "failure" || "$cmake_status" == "failure" ]]; then
            status="failure"; exit_code=1
            echo "**Status:** Dependency Check Failed" >> $GITHUB_STEP_SUMMARY
          elif [[ "$deps_result" == "cancelled" || "$cmake_status" == "cancelled" ]]; then
            status="cancelled"; exit_code=1
            echo "**Status:** Dependency Check Cancelled" >> $GITHUB_STEP_SUMMARY
          elif [[ "$deps_result" == "success" && ( "$cmake_status" == "success" || "$cmake_status" == "skipped" ) ]]; then
            status="success"; exit_code=0
            echo "**Status:** Dependency Check Successful" >> $GITHUB_STEP_SUMMARY
          else
            status="unknown"; exit_code=1
            echo "**Status:** Unknown" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Full Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

          echo "status=$status" >> $GITHUB_OUTPUT
          exit $exit_code
