name: Build Eleventy

on:
  merge_group:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - develop

jobs:
  build:
    if: github.repository_owner == 'Project-Tick'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - uses: pnpm/action-setup@v4

      - name: Install dependencies & build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    # Only deploy on pushes to develop; skip PRs/merge_group explicitly
    if: ${{ github.repository_owner == 'Project-Tick' && github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' }}
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
