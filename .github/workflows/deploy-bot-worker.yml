name: Deploy Bot Worker

on:
  push:
    branches: [develop]
    paths:
      - "bot/**"
      - ".github/workflows/deploy-bot-worker.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-bot-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Project-Tick'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJT_BOT_GITHUB_TOKEN: ${{ secrets.PROJT_BOT_GITHUB_TOKEN }}
      PROJT_BOT_WEBHOOK_SECRET: ${{ secrets.PROJT_BOT_WEBHOOK_SECRET }}
      PROJT_BOT_ADMIN_TOKEN: ${{ secrets.PROJT_BOT_ADMIN_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate required secrets
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PROJT_BOT_GITHUB_TOKEN PROJT_BOT_WEBHOOK_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub Actions secret: $name" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "" >&2
            echo "Note: Cloudflare API token needs Workers edit permissions to deploy + upload secrets." >&2
            exit 1
          fi

      - name: Deploy to Cloudflare Workers (no admin token)
        if: ${{ env.PROJT_BOT_ADMIN_TOKEN == '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: bot
          command: deploy
          secrets: |
            GITHUB_TOKEN
            GITHUB_WEBHOOK_SECRET
        env:
          GITHUB_TOKEN: ${{ env.PROJT_BOT_GITHUB_TOKEN }}
          GITHUB_WEBHOOK_SECRET: ${{ env.PROJT_BOT_WEBHOOK_SECRET }}

      - name: Deploy to Cloudflare Workers (with admin token)
        if: ${{ env.PROJT_BOT_ADMIN_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: bot
          command: deploy
          secrets: |
            GITHUB_TOKEN
            GITHUB_WEBHOOK_SECRET
            ADMIN_TOKEN
        env:
          GITHUB_TOKEN: ${{ env.PROJT_BOT_GITHUB_TOKEN }}
          GITHUB_WEBHOOK_SECRET: ${{ env.PROJT_BOT_WEBHOOK_SECRET }}
          ADMIN_TOKEN: ${{ env.PROJT_BOT_ADMIN_TOKEN }}
