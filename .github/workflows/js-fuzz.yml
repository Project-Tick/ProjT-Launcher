name: JS Fast-Check Fuzz

on:
  schedule:
    - cron: "0 5 * * 4"
  workflow_dispatch:
  pull_request:
    branches:
      - "develop"
      - "release-*"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
        working-directory: bot
      - name: Run fast-check fuzz
        run: node fuzz/bot/fastcheck.test.js
