name: JS Fast-Check Fuzz

on:
  schedule:
    - cron: "0 5 * * 4"
  workflow_dispatch:
  pull_request:
    branches:
      - "develop"
      - "release-*"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Run fast-check
        run: npm test
