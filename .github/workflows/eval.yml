name: Eval

on:
  merge_group:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref (branch, tag, or SHA) to check out"
        required: false

permissions: {}

defaults:
  run:
    shell: bash
    working-directory: .

jobs:
  eval:
    name: System Evaluation
    runs-on: ubuntu-latest
    environment: ci-core-heavy
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run full evaluation
        id: eval
        env:
          NIX_PATH: nixpkgs=channel:nixos-unstable
        run: |
          set -euo pipefail
          result=$(nix-build --expr '
            let
              pkgs = import <nixpkgs> {};
              evalModule = import ./ci/eval {
                inherit (pkgs) lib runCommand cmake nix jq;
              };
              eval = evalModule {};
            in eval.full
          ')
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Publish evaluation summary
        if: steps.eval.outputs.result != ''
        run: |
          summary="${{ steps.eval.outputs.result }}/summary.md"
          if [ -f "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "CI evaluation succeeded (no summary file)." >> "$GITHUB_STEP_SUMMARY"
          fi
