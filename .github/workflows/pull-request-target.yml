# =============================================================================
# ProjT Launcher - Pull Request Workflow
# =============================================================================
# Main workflow for PR validation, builds, and automation.
# =============================================================================

name: General Evaluation Process for Pull Requests

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Prepare PR information
  prepare:
    name: Prepare
    if: github.event.action != 'edited' || github.event.changes.base.ref.from != github.event.pull_request.base.ref
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    outputs:
      baseBranch: ${{ steps.prepare.outputs.base }}
      headBranch: ${{ steps.prepare.outputs.head }}
      mergedSha: ${{ steps.prepare.outputs.mergedSha }}
      targetSha: ${{ steps.prepare.outputs.targetSha }}
      mergeable: ${{ steps.prepare.outputs.mergeable }}
    
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            ci/github-script
            ci/supportedBranches.js

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd ci/github-script
          npm install
          npm ci --omit=dev

      - name: Prepare PR information
        id: prepare
        uses: actions/github-script@v8
        with:
          retries: 3
          script: |
            const prepare = require('./ci/github-script/prepare.js');
            
            const result = await prepare({
              github,
              context,
              core,
              dry: context.eventName === 'pull_request',
            });
            
            if (result) {
              core.setOutput('base', JSON.stringify(result.base));
              core.setOutput('head', JSON.stringify(result.head));
              core.setOutput('mergedSha', result.mergedSha);
              core.setOutput('targetSha', result.targetSha);
              core.setOutput('mergeable', result.mergeable);
            }

  # Validate commits
  check:
    name: Check
    needs: [prepare]
    if: needs.prepare.outputs.baseBranch
    uses: ./.github/workflows/check.yml
    permissions:
      pull-requests: write
    with:
      baseBranch: ${{ needs.prepare.outputs.baseBranch }}
      headBranch: ${{ needs.prepare.outputs.headBranch }}
      mergedSha: ${{ needs.prepare.outputs.mergedSha }}
      targetSha: ${{ needs.prepare.outputs.targetSha }}

  # Code formatting check
  lint:
    name: Lint
    needs: [prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check C++ formatting
        run: |
          if command -v clang-format &> /dev/null; then
            find launcher libraries -name "*.cpp" -o -name "*.h" | head -100 | while read file; do
              if ! clang-format --dry-run --Werror "$file" 2>/dev/null; then
                echo "Format issue: $file"
              fi
            done
          fi

  # Build on all platforms
  build:
    name: Build
    needs: [prepare]
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ needs.prepare.outputs.mergedSha }}

  # PR summary
  summary:
    name: Summary
    needs: [prepare, check, lint, build]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    
    steps:
      - name: Generate summary
        run: |
          echo "## PR Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Prepare | ${{ needs.prepare.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Check | ${{ needs.check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Post PR summary comment
        if: ${{ github.event_name == 'pull_request_target' }}
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const marker = '<!-- projt-bot:pr-summary -->';

            function badge(result) {
              switch (result) {
                case 'success': return '✅ success';
                case 'failure': return '❌ failure';
                case 'cancelled': return '⚠️ cancelled';
                case 'skipped': return '⏭️ skipped';
                default: return `❓ ${result}`;
              }
            }

            const rows = [
              ['Prepare', badge(process.env.PREPARE_RESULT)],
              ['Check', badge(process.env.CHECK_RESULT)],
              ['Lint', badge(process.env.LINT_RESULT)],
              ['Build', badge(process.env.BUILD_RESULT)],
            ];

            const body = [
              marker,
              '## PR CI Summary',
              '',
              `Run: ${process.env.RUN_URL}`,
              '',
              '| Job | Result |',
              '|-----|--------|',
              ...rows.map(([name, res]) => `| ${name} | ${res} |`),
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find(
              (c) => c.user?.login === 'github-actions[bot]' && typeof c.body === 'string' && c.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: prNumber,
                body,
              });
            }
