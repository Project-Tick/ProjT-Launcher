name: General Evaluation Process for Pull Requests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Prepare PR information
  prepare:
    name: Prepare
    if: github.event.action != 'edited' || github.event.changes.base.ref.from != github.event.pull_request.base.ref
    runs-on: ubuntu-latest
    environment: ci-core-heavy
    permissions:
      pull-requests: write
    outputs:
      baseBranch: ${{ steps.prepare.outputs.base }}
      headBranch: ${{ steps.prepare.outputs.head }}
      mergedSha: ${{ steps.prepare.outputs.mergedSha }}
      targetSha: ${{ steps.prepare.outputs.targetSha }}
      mergeable: ${{ steps.prepare.outputs.mergeable }}
      headSha: ${{ steps.prepare.outputs.headSha }}
    
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            ci/github-script
            ci/supportedBranches.js

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd ci/github-script
          npm install
          npm ci --omit=dev

      - name: Prepare PR information
        id: prepare
        uses: actions/github-script@v8
        with:
          retries: 3
          script: |
            const prepare = require('./ci/github-script/prepare.js');
            
            const result = await prepare({
              github,
              context,
              core,
              dry: context.eventName === 'pull_request',
            });
            
            if (result) {
              core.setOutput('base', JSON.stringify(result.base));
              core.setOutput('head', JSON.stringify(result.head));
              core.setOutput('mergedSha', result.mergedSha);
              core.setOutput('targetSha', result.targetSha);
              core.setOutput('mergeable', result.mergeable);
              core.setOutput('headSha', result.headSha);
            }

  # Validate commits
  check:
    name: Check
    needs: [prepare]
    if: needs.prepare.outputs.baseBranch
    uses: ./.github/workflows/check.yml
    environment: ci-core-heavy
    permissions:
      pull-requests: write
    with:
      baseBranch: ${{ needs.prepare.outputs.baseBranch }}
      headBranch: ${{ needs.prepare.outputs.headBranch }}
      mergedSha: ${{ needs.prepare.outputs.headSha }}
      targetSha: ${{ needs.prepare.outputs.targetSha }}

  # Code formatting check
  lint:
    name: Lint
    needs: [prepare]
    runs-on: ubuntu-latest
    environment: ci-core-heavy
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.headSha }}

      - name: Check C++ formatting
        run: |
          if command -v clang-format &> /dev/null; then
            find launcher libraries -name "*.cpp" -o -name "*.h" | head -100 | while read file; do
              if ! clang-format --dry-run --Werror "$file" 2>/dev/null; then
                echo "Format issue: $file"
              fi
            done
          fi

  # Build on all platforms
  build:
    name: Build
    needs: [prepare]
    uses: ./.github/workflows/build.yml
    environment: ci-core-heavy
    permissions:
      contents: read
      packages: write
      pages: write
      id-token: write
    with:
      ref: ${{ needs.prepare.outputs.headSha }}

  # PR summary
  summary:
    name: Summary
    needs: [prepare, check, lint, build]
    if: always()
    runs-on: ubuntu-latest
    environment: ci-core-heavy
    permissions: {}
    
    steps:
      - name: Generate summary
        run: |
          echo "## PR Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Prepare | ${{ needs.prepare.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Check | ${{ needs.check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY

  unlock:
    if: github.event_name != 'pull_request' && always()
    # Modify this list to add or remove jobs from required status checks.
    needs:
      - check
      - build
    runs-on: ubuntu-latest
    environment: ci-core-heavy
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@v8
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        with:
          script: |
            const { serverUrl, repo, runId, payload } = context
            const target_url =
              `${serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${runId}`
            await github.rest.repos.createCommitStatus({
              ...repo,
              sha: payload.merge_group.head_sha,
              // WARNING:
              // Do NOT change the name of this, otherwise the rule will not catch it anymore.
              // This would prevent all PRs from merging.
              context: 'no PR failures',
              state: JSON.parse(process.env.RESULTS).every(result => result == 'success') ? 'success' : 'error',
              target_url,
            })
