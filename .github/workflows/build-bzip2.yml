name: Build bzip2

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
  workflow_dispatch: {}

jobs:
  debian-testing-meson:
    name: Debian (testing) - Meson
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bzip2
    container:
      image: debian:testing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install deps
        run: |
          apt-get update -y
          apt-get install -y gcc meson python3-setuptools python3-pytest valgrind

      - name: Build (meson)
        run: |
          meson builddir
          ninja -C builddir
          meson test -C builddir --print-errorlogs || true

      - name: Collect meson log
        run: |
          cp builddir/meson-logs/meson-log.txt . || true

      - name: Upload meson log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meson-log
          path: meson-log.txt

  debian-testing-cmake-debug:
    name: Debian (testing) - CMake Debug
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bzip2
    container:
      image: debian:testing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install deps
        run: |
          apt-get update -y
          apt-get install -y gcc make python3-pytest cmake valgrind build-essential libssl-dev qt6-base-dev qt6-base-dev-tools qt6-5compat-dev qt6-networkauth-dev

      - name: Build (cmake debug)
        run: |
          mkdir builddir && cd builddir
          cmake .. -DCMAKE_BUILD_TYPE="Debug" -D ENABLE_SHARED_LIB=ON -D ENABLE_STATIC_LIB=OFF
          cmake --build .
          make check || true

      - name: Collect CMakeOutput.log
        run: |
          cp builddir/CMakeFiles/CMakeOutput.log . || true

      - name: Upload CMakeOutput.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CMakeOutput.log
          path: CMakeOutput.log

