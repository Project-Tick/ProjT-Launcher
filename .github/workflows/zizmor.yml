# =============================================================================
# ProjT Launcher - Zizmor Security Scan
# =============================================================================
# Runs zizmor against workflow files to catch risky patterns.
# =============================================================================

name: Zizmor

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/zizmor.yml"
  push:
    branches: [develop, main, master]
    paths:
      - ".github/workflows/**"
      - ".github/zizmor.yml"
  schedule:
    - cron: "0 4 * * 1" # weekly on Monday

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run zizmor
        uses: woodruffw/zizmor-action@v0.3.0
        with:
          config-path: .github/zizmor.yml

