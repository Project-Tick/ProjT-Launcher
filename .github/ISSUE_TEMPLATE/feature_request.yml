name: Feature request
description: Suggest an idea in Project Tick's monorepo (detached forks are maintained here)
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. This repo is a monorepo and all detached forks are maintained by Project Tick.

  - type: checkboxes
    attributes:
      label: Pre-checks
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: This is not already covered by docs or existing features.
          required: true
        - label: I understand all code here (including detached forks) is maintained by Project Tick and should be requested here, not upstream.
          required: true

  - type: checkboxes
    attributes:
      label: Scope (select all that apply)
      options:
        - label: Launcher (C++/Qt)
        - label: Website (Eleventy)
        - label: Bot (Cloudflare Workers)
        - label: Metadata Generator (Python)
        - label: Quazip
        - label: bzip2
        - label: Docs
        - label: CI
        - label: Tools
        - label: Branding
        - label: Launcher Java System
        - label: JavaCheck
        - label: libnbtplusplus
        - label: Zlib
        - label: libqrencode
        - label: cmark
        - label: tomlplusplus
        - label: Packages
        - label: Other (describe in Summary)

  - type: checkboxes
    attributes:
      label: Package type (if Packages is selected)
      options:
        - label: NixOS
        - label: Flatpak
        - label: AUR
        - label: AppImage
        - label: Other (describe in Summary)

  - type: input
    id: affected_paths
    attributes:
      label: Affected paths
      description: Paths in this repo (examples: launcher/, website/, bot/, meta/, docs/, ci/).
      placeholder: launcher/ui/, website/projtlauncher/, .github/workflows/

  - type: input
    id: user_impact
    attributes:
      label: User impact
      description: Who benefits and how often.
      placeholder: All users on Linux, power users, website visitors...

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: Describe the problem and why it matters.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you think this could work at a high level.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered, with pros/cons.

  - type: textarea
    id: risks
    attributes:
      label: Compatibility and risks
      description: Potential impact on behavior, data, or platforms.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What would make this feature complete or acceptable.

  - type: dropdown
    id: contribution
    attributes:
      label: Would you like to contribute?
      options:
        - I can work on this
        - I would like guidance
        - I cannot contribute right now

  - type: markdown
    attributes:
      value: |
        ## Component-specific context
        Fill out only the sections that apply to your selected scope.

  - type: textarea
    id: launcher_context
    attributes:
      label: Launcher context
      description: UX flow, screens, settings, and expected behavior changes.

  - type: textarea
    id: website_context
    attributes:
      label: Website context
      description: Page path and content structure changes.

  - type: textarea
    id: bot_context
    attributes:
      label: Bot context
      description: Worker name, triggers, and expected behavior.

  - type: textarea
    id: meta_context
    attributes:
      label: Metadata generator context
      description: Command or pipeline changes and inputs/outputs.

  - type: textarea
    id: docs_context
    attributes:
      label: Docs context
      description: Docs path, scope, and target audience.

  - type: textarea
    id: ci_context
    attributes:
      label: CI context
      description: Workflow file, jobs, and expected impact.

  - type: textarea
    id: packaging_context
    attributes:
      label: Packaging context
      description: Distro/package details and desired changes.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Links, screenshots, or examples.
