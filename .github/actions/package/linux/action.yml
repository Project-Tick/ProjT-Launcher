name: Package for Linux
description: Create Linux packages for ProjT Launcher

inputs:
  version:
    description: Launcher version
    required: true
  build-type:
    description: Type for the build
    required: true
    default: Debug
  artifact-name:
    description: Name of the uploaded artifact
    required: true
    default: Linux
  qt-version:
    description: Version of Qt to use
    required: true
  gpg-private-key:
    description: Private key for AppImage signing
    required: false
  gpg-private-key-id:
    description: ID for the gpg-private-key, to select the signing key
    required: false

runs:
  using: composite

  steps:
    - name: Setup build variables
      shell: bash
      run: |
        # Fixup architecture naming for AppImages
        dpkg_arch="$(dpkg-architecture -q DEB_HOST_ARCH_CPU)"
        case "$dpkg_arch" in
          "amd64")
            APPIMAGE_ARCH="x86_64"
            ;;
          "arm64")
            APPIMAGE_ARCH="aarch64"
            ;;
          *)
            echo "# 🚨 The Debian architecture \"$dpkg_arch\" is not recognized!" >> "$GITHUB_STEP_SUMMARY"
            exit 1
            ;;
        esac
        echo "APPIMAGE_ARCH=$APPIMAGE_ARCH" >> "$GITHUB_ENV"

        # Used for the file paths of libraries
        echo "DEB_HOST_MULTIARCH=$(dpkg-architecture -q DEB_HOST_MULTIARCH)" >> "$GITHUB_ENV"

    - name: Package AppImage
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        BUILD_DIR: build
        INSTALL_APPIMAGE_DIR: install-appdir
        LINUX_GPG_KEY: ${{ inputs.gpg-private-key }}
      run: |
        set -euo pipefail

        install_root="${{ env.INSTALL_APPIMAGE_DIR }}/usr"
        if [ -f "${{ env.BUILD_DIR }}/cmake_install.cmake" ]; then
          cmake --install ${{ env.BUILD_DIR }} --config ${{ inputs.build-type }} --prefix "$install_root"
        else
          make DESTDIR="${{ env.INSTALL_APPIMAGE_DIR }}" PREFIX=/usr install
          mkdir -p "$install_root/share/metainfo" "$install_root/share/icons/hicolor/scalable/apps" "$install_root/share/applications"
          if [ -f program_info/org.projecttick.ProjTLauncher.metainfo.xml.in ]; then
            sed \
              -e "s,@Launcher_Name@,ProjTLauncher,g" \
              -e "s,@Launcher_DisplayName@,ProjT Launcher,g" \
              -e "s,@Launcher_Domain@,projecttick.org,g" \
              program_info/org.projecttick.ProjTLauncher.metainfo.xml.in > "$install_root/share/metainfo/org.projecttick.ProjTLauncher.metainfo.xml" || true
          fi
          if [ -f program_info/org.projecttick.ProjTLauncher.svg ]; then
            cp program_info/org.projecttick.ProjTLauncher.svg "$install_root/share/icons/hicolor/scalable/apps/org.projecttick.ProjTLauncher.svg"
          fi
          cat > "$install_root/share/applications/org.projecttick.ProjTLauncher.desktop" <<'EOF'
        [Desktop Entry]
        Type=Application
        Name=ProjT Launcher
        Exec=projtlauncher
        Icon=org.projecttick.ProjTLauncher
        Categories=Game;
        EOF
        fi

        if [ -f "${{ env.INSTALL_APPIMAGE_DIR }}/usr/share/metainfo/org.projecttick.ProjTLauncher.metainfo.xml" ]; then
          mv ${{ env.INSTALL_APPIMAGE_DIR }}/usr/share/metainfo/org.projecttick.ProjTLauncher.metainfo.xml ${{ env.INSTALL_APPIMAGE_DIR }}/usr/share/metainfo/org.projecttick.ProjTLauncher.appdata.xml
        fi
        export "NO_APPSTREAM=1" # we have to skip appstream checking because appstream on ubuntu 20.04 is outdated

        export OUTPUT="ProjTLauncher-Linux-$APPIMAGE_ARCH.AppImage"

        chmod +x linuxdeploy-*.AppImage

        mkdir -p ${{ env.INSTALL_APPIMAGE_DIR }}/usr/lib
        mkdir -p ${{ env.INSTALL_APPIMAGE_DIR }}/usr/plugins/iconengines

        cp -r ${{ runner.workspace }}/Qt/${{ inputs.qt-version }}/gcc_*64/plugins/iconengines/* ${{ env.INSTALL_APPIMAGE_DIR }}/usr/plugins/iconengines 2>/dev/null || true

        cp /usr/lib/"$DEB_HOST_MULTIARCH"/libcrypto.so.* ${{ env.INSTALL_APPIMAGE_DIR }}/usr/lib/ 2>/dev/null || true
        cp /usr/lib/"$DEB_HOST_MULTIARCH"/libssl.so.* ${{ env.INSTALL_APPIMAGE_DIR }}/usr/lib/ 2>/dev/null || true
        cp /usr/lib/"$DEB_HOST_MULTIARCH"/libOpenGL.so.0* ${{ env.INSTALL_APPIMAGE_DIR }}/usr/lib/ 2>/dev/null || true

        LD_LIBRARY_PATH="${LD_LIBRARY_PATH}:${{ env.INSTALL_APPIMAGE_DIR }}/usr/lib"
        export LD_LIBRARY_PATH

        chmod +x AppImageUpdate-"$APPIMAGE_ARCH".AppImage
        cp AppImageUpdate-"$APPIMAGE_ARCH".AppImage ${{ env.INSTALL_APPIMAGE_DIR }}/usr/bin

        export UPDATE_INFORMATION="gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|latest|ProjTLauncher-Linux-$APPIMAGE_ARCH.AppImage.zsync"

        if [ '${{ inputs.gpg-private-key-id }}' != '' ]; then
          export SIGN=1
          export SIGN_KEY=${{ inputs.gpg-private-key-id }}
          GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          export GNUPGHOME

          # Private key import
          printf '%s' "$LINUX_GPG_KEY" > "$GNUPGHOME/private.key"
          chmod 600 "$GNUPGHOME/private.key"

          gpg --batch --yes --pinentry-mode loopback --import "$GNUPGHOME/private.key"

          #FIX: gpg.conf and gpg-agent.conf so signing never requires TTY
          echo "pinentry-mode loopback" >> "$GNUPGHOME/gpg.conf"
          echo "allow-loopback-pinentry" >> "$GNUPGHOME/gpg-agent.conf"

          # Restart gpg-agent to apply configs
          gpgconf --kill gpg-agent
          gpg-connect-agent reloadagent /bye

        else
          echo ":warning: Skipped code signing for Linux AppImage, as gpg key was not present." >> $GITHUB_STEP_SUMMARY
        fi


        app_icon="${{ env.INSTALL_APPIMAGE_DIR }}/usr/share/icons/hicolor/scalable/apps/org.projecttick.ProjTLauncher.svg"
        if [ ! -f "$app_icon" ]; then
          app_icon=""
        fi
        if [ -n "$app_icon" ]; then
          ./linuxdeploy-"$APPIMAGE_ARCH".AppImage --appdir ${{ env.INSTALL_APPIMAGE_DIR }} --output appimage --plugin qt -i "$app_icon"
        else
          ./linuxdeploy-"$APPIMAGE_ARCH".AppImage --appdir ${{ env.INSTALL_APPIMAGE_DIR }} --output appimage --plugin qt
        fi

        mv "ProjTLauncher-Linux-$APPIMAGE_ARCH.AppImage" "ProjTLauncher-Linux-${{ env.VERSION }}-${{ inputs.build-type }}-$APPIMAGE_ARCH.AppImage"

    - name: Package portable tarball
      shell: bash
      env:
        BUILD_DIR: build

        CMAKE_PRESET: ${{ inputs.cmake-preset }}

        INSTALL_PORTABLE_DIR: install-portable
      run: |
        set -euo pipefail
        if [ -f "${{ env.BUILD_DIR }}/cmake_install.cmake" ]; then
          cmake --install ${{ env.BUILD_DIR }} --config ${{ inputs.build-type }} --prefix ${{ env.INSTALL_PORTABLE_DIR }}
          cmake --install ${{ env.BUILD_DIR }} --config ${{ inputs.build-type }} --prefix ${{ env.INSTALL_PORTABLE_DIR }} --component portable
        else
          make DESTDIR="${{ env.INSTALL_PORTABLE_DIR }}" PREFIX= install
        fi

        for l in $(find ${{ env.INSTALL_PORTABLE_DIR }} -type f); do l=${l#$(pwd)/}; l=${l#${{ env.INSTALL_PORTABLE_DIR }}/}; l=${l#./}; echo $l; done > ${{ env.INSTALL_PORTABLE_DIR }}/manifest.txt
        cd ${{ env.INSTALL_PORTABLE_DIR }}
        tar -czf ../ProjTLauncher-portable.tar.gz *

    - name: Upload binary tarball
      uses: actions/upload-artifact@v5
      with:
        name: ProjTLauncher-${{ inputs.artifact-name }}-Qt6-Portable-${{ inputs.version }}-${{ inputs.build-type }}
        path: ProjTLauncher-portable.tar.gz

    - name: Upload AppImage
      uses: actions/upload-artifact@v5
      with:
        name: ProjTLauncher-${{ runner.os }}-${{ inputs.version }}-${{ inputs.build-type }}-${{ env.APPIMAGE_ARCH }}.AppImage
        path: ProjTLauncher-${{ runner.os }}-${{ inputs.version }}-${{ inputs.build-type }}-${{ env.APPIMAGE_ARCH }}.AppImage

    - name: Upload AppImage Zsync
      uses: actions/upload-artifact@v5
      with:
        name: ProjTLauncher-${{ runner.os }}-${{ inputs.version }}-${{ inputs.build-type }}-${{ env.APPIMAGE_ARCH }}.AppImage.zsync
        path: ProjTLauncher-${{ runner.os }}-${{ env.APPIMAGE_ARCH }}.AppImage.zsync
