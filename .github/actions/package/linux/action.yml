name: Package for Linux
description: Create Linux packages for ProjT Launcher

inputs:
  version:
    description: Launcher version
    required: true
  build-type:
    description: Type for the build
    required: true
    default: Debug
  artifact-name:
    description: Name of the uploaded artifact
    required: true
    default: Linux
  cmake-preset:
    description: Base CMake preset previously used for the build
    required: true
    default: linux
  qt-version:
    description: Version of Qt to use
    required: true
  gpg-private-key:
    description: Private key for AppImage signing
    required: false
  gpg-private-key-id:
    description: ID for the gpg-private-key, to select the signing key
    required: false

runs:
  using: composite

  steps:
    - name: Setup build variables
      shell: bash
      run: |
        # Fixup architecture naming for AppImages
        dpkg_arch="$(dpkg-architecture -q DEB_HOST_ARCH_CPU)"
        case "$dpkg_arch" in
          "amd64")
            APPIMAGE_ARCH="x86_64"
            ;;
          "arm64")
            APPIMAGE_ARCH="aarch64"
            ;;
          *)
            echo "# 🚨 The Debian architecture \"$deb_arch\" is not recognized!" >> "$GITHUB_STEP_SUMMARY"
            exit 1
            ;;
        esac
        echo "APPIMAGE_ARCH=$APPIMAGE_ARCH" >> "$GITHUB_ENV"

        # Used for the file paths of libraries
        echo "DEB_HOST_MULTIARCH=$(dpkg-architecture -q DEB_HOST_MULTIARCH)" >> "$GITHUB_ENV"

    - name: Package AppImage
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        BUILD_DIR: build
        INSTALL_APPIMAGE_DIR: install-appdir
        LINUX_GPG_KEY: ${{ inputs.gpg-private-key }}
      run: |
        cmake --install ${{ env.BUILD_DIR }} --prefix ${{ env.INSTALL_APPIMAGE_DIR }}/usr

        # Move jars to /usr/jars for AppImage
        # BACKUP: mv ${{ env.INSTALL_APPIMAGE_DIR }}/usr/share/ProjTLauncher ${{ env.INSTALL_APPIMAGE_DIR }}/usr/jars
        # Safer copy: ensure target exists, search for ProjTLaunch jars and copy them into usr/jars
        mkdir -p ${{ env.INSTALL_APPIMAGE_DIR }}/usr/jars
        echo "Listing top-level install and install-appdir for debugging..."
        ls -la "${{ runner.workspace }}/install" || true
        ls -la "${{ env.INSTALL_APPIMAGE_DIR }}" || true
        found=0
        # If upstream CMake put an entire directory, copy it first
        if [ -d "${{ env.INSTALL_APPIMAGE_DIR }}/usr/share/ProjTLauncher" ]; then
          cp -a "${{ env.INSTALL_APPIMAGE_DIR }}/usr/share/ProjTLauncher" "${{ env.INSTALL_APPIMAGE_DIR }}/usr/jars/" && found=$((found+1)) || echo "Warning: failed to copy ProjTLauncher dir" >> $GITHUB_STEP_SUMMARY
        fi

        # Also check top-level install/jars placed by CMake
        if [ -d "${{ runner.workspace }}/install/jars" ]; then
          echo "Top-level install/jars exists, listing..."
          ls -la "${{ runner.workspace }}/install/jars" || true
          while IFS= read -r jar; do
            echo "Found top-level jar: $jar"
            target_dir="${{ env.INSTALL_APPIMAGE_DIR }}/usr/jars"
            mkdir -p "$target_dir"
            cp -a "$jar" "$target_dir/" && found=$((found+1)) || echo "Warning: failed to cp $jar -> $target_dir" >> $GITHUB_STEP_SUMMARY
          done < <(find "${{ runner.workspace }}/install/jars" -type f \( -iname 'ProjTLaunch*.jar' -o -iname 'ProjTLaunchLegacy*.jar' \) -print)
        fi

        # Find individual jars (including ProjTLaunch.jar and ProjTLaunchLegacy.jar)
        while IFS= read -r jar; do
          echo "Found jar: $jar"
          # compute a target directory under usr/jars that preserves relative layout
          relpath="${jar#${{ env.INSTALL_APPIMAGE_DIR }}/}"
          target_dir="${{ env.INSTALL_APPIMAGE_DIR }}/usr/jars/$(dirname "$relpath")"
          mkdir -p "$target_dir"
          cp -a "$jar" "$target_dir/" && found=$((found+1)) || echo "Warning: failed to cp $jar -> $target_dir" >> $GITHUB_STEP_SUMMARY
        done < <(find "${{ env.INSTALL_APPIMAGE_DIR }}" -type f \( -iname 'ProjTLaunch*.jar' -o -iname 'ProjTLaunchLegacy*.jar' -o -path '*/ProjTLauncher/*.jar' \) -print)

        if [ "$found" -eq 0 ]; then
          echo ":warning: No ProjTLaunch jars were found under ${{ env.INSTALL_APPIMAGE_DIR }} (tried find). Please check CMake install paths." >> $GITHUB_STEP_SUMMARY
        else
          echo "Copied $found jar(s) to ${{ env.INSTALL_APPIMAGE_DIR }}/usr/jars"
        fi

        mv ${{ env.INSTALL_APPIMAGE_DIR }}/usr/share/metainfo/tr.org.yongdohyun.ProjTLauncher.metainfo.xml ${{ env.INSTALL_APPIMAGE_DIR }}/usr/share/metainfo/tr.org.yongdohyun.ProjTLauncher.appdata.xml
        export "NO_APPSTREAM=1" # we have to skip appstream checking because appstream on ubuntu 20.04 is outdated

        export OUTPUT="ProjTLauncher-Linux-$APPIMAGE_ARCH.AppImage"

        chmod +x linuxdeploy-*.AppImage

        mkdir -p ${{ env.INSTALL_APPIMAGE_DIR }}/usr/lib
        mkdir -p ${{ env.INSTALL_APPIMAGE_DIR }}/usr/plugins/iconengines

        cp -r ${{ runner.workspace }}/Qt/${{ inputs.qt-version }}/gcc_*64/plugins/iconengines/* ${{ env.INSTALL_APPIMAGE_DIR }}/usr/plugins/iconengines

        cp /usr/lib/"$DEB_HOST_MULTIARCH"/libcrypto.so.* ${{ env.INSTALL_APPIMAGE_DIR }}/usr/lib/
        cp /usr/lib/"$DEB_HOST_MULTIARCH"/libssl.so.* ${{ env.INSTALL_APPIMAGE_DIR }}/usr/lib/
        cp /usr/lib/"$DEB_HOST_MULTIARCH"/libOpenGL.so.0* ${{ env.INSTALL_APPIMAGE_DIR }}/usr/lib/

        LD_LIBRARY_PATH="${LD_LIBRARY_PATH}:${{ env.INSTALL_APPIMAGE_DIR }}/usr/lib"
        export LD_LIBRARY_PATH

        chmod +x AppImageUpdate-"$APPIMAGE_ARCH".AppImage
        cp AppImageUpdate-"$APPIMAGE_ARCH".AppImage ${{ env.INSTALL_APPIMAGE_DIR }}/usr/bin

        export UPDATE_INFORMATION="gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|latest|ProjTLauncher-Linux-$APPIMAGE_ARCH.AppImage.zsync"

        if [ '${{ inputs.gpg-private-key-id }}' != '' ]; then
          export SIGN=1
          export SIGN_KEY=${{ inputs.gpg-private-key-id }}
          GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          export GNUPGHOME

          # Private key import
          printf '%s' "$LINUX_GPG_KEY" > "$GNUPGHOME/private.key"
          chmod 600 "$GNUPGHOME/private.key"

          gpg --batch --yes --pinentry-mode loopback --import "$GNUPGHOME/private.key"

          #FIX: gpg.conf and gpg-agent.conf so signing never requires TTY
          echo "pinentry-mode loopback" >> "$GNUPGHOME/gpg.conf"
          echo "allow-loopback-pinentry" >> "$GNUPGHOME/gpg-agent.conf"

          # Restart gpg-agent to apply configs
          gpgconf --kill gpg-agent
          gpg-connect-agent reloadagent /bye

        else
          echo ":warning: Skipped code signing for Linux AppImage, as gpg key was not present." >> $GITHUB_STEP_SUMMARY
        fi


        ./linuxdeploy-"$APPIMAGE_ARCH".AppImage --appdir ${{ env.INSTALL_APPIMAGE_DIR }} --output appimage --plugin qt -i ${{ env.INSTALL_APPIMAGE_DIR }}/usr/share/icons/hicolor/scalable/apps/tr.org.yongdohyun.ProjTLauncher.svg

        mv "ProjTLauncher-Linux-$APPIMAGE_ARCH.AppImage" "ProjTLauncher-Linux-${{ env.VERSION }}-${{ inputs.build-type }}-$APPIMAGE_ARCH.AppImage"

    - name: Package portable tarball
      shell: bash
      env:
        BUILD_DIR: build

        CMAKE_PRESET: ${{ inputs.cmake-preset }}

        INSTALL_PORTABLE_DIR: install-portable
      run: |
        cmake --install ${{ env.BUILD_DIR }} --prefix ${{ env.INSTALL_PORTABLE_DIR }}
        cmake --install ${{ env.BUILD_DIR }} --prefix ${{ env.INSTALL_PORTABLE_DIR }} --component portable

        # Move jars to /jars for portable
        # BACKUP: mv ${{ env.INSTALL_PORTABLE_DIR }}/share/ProjTLauncher ${{ env.INSTALL_PORTABLE_DIR }}/jars
        mkdir -p ${{ env.INSTALL_PORTABLE_DIR }}/jars
        echo "Listing top-level install and install-portable for debugging..."
        ls -la "${{ runner.workspace }}/install" || true
        ls -la "${{ env.INSTALL_PORTABLE_DIR }}" || true
        echo "Searching for ProjTLaunch jars under ${{ env.INSTALL_PORTABLE_DIR }}..."
        found=0
        if [ -d "${{ env.INSTALL_PORTABLE_DIR }}/share/ProjTLauncher" ]; then
          cp -a "${{ env.INSTALL_PORTABLE_DIR }}/share/ProjTLauncher" "${{ env.INSTALL_PORTABLE_DIR }}/jars/" && found=$((found+1)) || echo "Warning: failed to copy ProjTLauncher dir" >> $GITHUB_STEP_SUMMARY
        fi
        # Also check top-level install/jars placed by CMake
        if [ -d "${{ runner.workspace }}/install/jars" ]; then
          echo "Top-level install/jars exists, listing..."
          ls -la "${{ runner.workspace }}/install/jars" || true
          while IFS= read -r jar; do
            echo "Found top-level jar: $jar"
            target_dir="${{ env.INSTALL_PORTABLE_DIR }}/jars"
            mkdir -p "$target_dir"
            cp -a "$jar" "$target_dir/" && found=$((found+1)) || echo "Warning: failed to cp $jar -> $target_dir" >> $GITHUB_STEP_SUMMARY
          done < <(find "${{ runner.workspace }}/install/jars" -type f \( -iname 'ProjTLaunch*.jar' -o -iname 'ProjTLaunchLegacy*.jar' \) -print)
        fi
        while IFS= read -r jar; do
          echo "Found jar: $jar"
          relpath="${jar#${{ env.INSTALL_PORTABLE_DIR }}/}"
          target_dir="${{ env.INSTALL_PORTABLE_DIR }}/jars/$(dirname "$relpath")"
          mkdir -p "$target_dir"
          cp -a "$jar" "$target_dir/" && found=$((found+1)) || echo "Warning: failed to cp $jar -> $target_dir" >> $GITHUB_STEP_SUMMARY
        done < <(find "${{ env.INSTALL_PORTABLE_DIR }}" -type f \( -iname 'ProjTLaunch*.jar' -o -iname 'ProjTLaunchLegacy*.jar' -o -path '*/ProjTLauncher/*.jar' \) -print)
        if [ "$found" -eq 0 ]; then
          echo ":warning: No ProjTLaunch jars were found under ${{ env.INSTALL_PORTABLE_DIR }}. Check CMake install/component layout." >> $GITHUB_STEP_SUMMARY
        else
          echo "Copied $found jar(s) to ${{ env.INSTALL_PORTABLE_DIR }}/jars"
        fi

        for l in $(find ${{ env.INSTALL_PORTABLE_DIR }} -type f); do l=${l#$(pwd)/}; l=${l#${{ env.INSTALL_PORTABLE_DIR }}/}; l=${l#./}; echo $l; done > ${{ env.INSTALL_PORTABLE_DIR }}/manifest.txt
        cd ${{ env.INSTALL_PORTABLE_DIR }}
        tar -czf ../ProjTLauncher-portable.tar.gz *

    - name: Upload binary tarball
      uses: actions/upload-artifact@v5
      with:
        name: ProjTLauncher-${{ inputs.artifact-name }}-Qt6-Portable-${{ inputs.version }}-${{ inputs.build-type }}
        path: ProjTLauncher-portable.tar.gz

    - name: Upload AppImage
      uses: actions/upload-artifact@v5
      with:
        name: ProjTLauncher-${{ runner.os }}-${{ inputs.version }}-${{ inputs.build-type }}-${{ env.APPIMAGE_ARCH }}.AppImage
        path: ProjTLauncher-${{ runner.os }}-${{ inputs.version }}-${{ inputs.build-type }}-${{ env.APPIMAGE_ARCH }}.AppImage

    - name: Upload AppImage Zsync
      uses: actions/upload-artifact@v5
      with:
        name: ProjTLauncher-${{ runner.os }}-${{ inputs.version }}-${{ inputs.build-type }}-${{ env.APPIMAGE_ARCH }}.AppImage.zsync
        path: ProjTLauncher-${{ runner.os }}-${{ env.APPIMAGE_ARCH }}.AppImage.zsync
