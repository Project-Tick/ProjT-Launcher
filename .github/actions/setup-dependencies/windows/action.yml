name: Setup Windows Dependencies

inputs:
  build-type:
    description: Type for the build
    required: true
    default: Debug
  msystem:
    description: MSYS2 subsystem to use
    required: false
  vcvars-arch:
    description: Visual Studio architecture to use
    required: true
    default: amd64

runs:
  using: composite

  steps:
    # NOTE: Installed on MinGW as well for SignTool
    - name: Enter VS Developer shell
      if: ${{ runner.os == 'Windows' }}
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ inputs.vcvars-arch }}
        vsversion: 2022

    - name: Setup Java (MSVC)
      uses: actions/setup-java@v5
      with:
        # NOTE(@getchoo): We should probably stay on Zulu.
        # Temurin doesn't have Java 17 builds for WoA
        distribution: zulu
        java-version: 17

    - name: Setup vcpkg environment (MSVC)
      if: ${{ inputs.msystem == '' }}
      shell: bash
      run: |
        echo "CMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"

    - name: Setup MSYS2 (MinGW)
      if: ${{ inputs.msystem != '' }}
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ inputs.msystem }}
        update: true
        install: >-
          git
        pacboy: >-
          toolchain:p
          ccache:p
          cmake:p
          extra-cmake-modules:p
          ninja:p
          qt6-base:p
          qt6-svg:p
          qt6-imageformats:p
          qt6-5compat:p
          qt6-networkauth:p
          cmark:p
          tomlplusplus:p
          quazip-qt6:p

    - name: Install NSIS (MSVC)
      if: ${{ runner.os == 'Windows' && inputs.msystem == '' }}
      shell: powershell
      run: choco install nsis -y

    - name: Install NSIS (MinGW)
      if: ${{ runner.os == 'Windows' && inputs.msystem != '' }}
      shell: msys2 {0}
      run: pacman -S --needed --noconfirm mingw-w64-x86_64-nsis

    - name: Add NSIS to PATH
      if: ${{ runner.os == 'Windows'}}
      shell: powershell
      run: |
        $nsisPath = "C:\Program Files (x86)\NSIS"
        echo "NSIS_PATH=$nsisPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "$nsisPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: List pacman packages (MinGW)
      if: ${{ inputs.msystem != '' }}
      shell: msys2 {0}
      run: |
        pacman -Qe
