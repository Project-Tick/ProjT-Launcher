name: Setup Dependencies
description: Install and setup dependencies for building ProjT Launcher

inputs:
  build-type:
    description: Type for the build
    required: true
    default: Debug
  artifact-name:
    description: Name of the uploaded artifact
    required: true
  msystem:
    description: MSYS2 subsystem to use
    required: false
  vcvars-arch:
    description: Visual Studio architecture to use
    required: false
  qt-architecture:
    description: Qt architecture
    required: false
  qt-version:
    description: Version of Qt to use
    required: true
    default: 6.10.0
  qt-modules:
    description: Qt modules to install
    required: false
    default: qtimageformats qtnetworkauth qtwebchannel qtwebengine qtpositioning qtserialport

outputs:
  build-type:
    description: Type of build used
    value: ${{ inputs.build-type }}
  qt-version:
    description: Version of Qt used
    value: ${{ inputs.qt-version }}
  qt-path:
    description: Resolved Qt installation prefix
    value: ${{ steps.resolve-qt-path.outputs.qt-path }}

runs:
  using: composite

  steps:
    - name: Setup Linux dependencies
      if: ${{ runner.os == 'Linux' }}
      uses: ./.github/actions/setup-dependencies/linux

    - name: Setup macOS dependencies
      if: ${{ runner.os == 'macOS' }}
      uses: ./.github/actions/setup-dependencies/macos
      with:
        build-type: ${{ inputs.build-type }}

    - name: Setup Windows dependencies
      if: ${{ runner.os == 'Windows' }}
      uses: ./.github/actions/setup-dependencies/windows
      with:
        build-type: ${{ inputs.build-type }}
        msystem: ${{ inputs.msystem }}
        vcvars-arch: ${{ inputs.vcvars-arch }}

    - name: Install Qt
      id: install-qt
      if: ${{ inputs.qt-architecture != '' || inputs.msystem == '' }}
      uses: jurplel/install-qt-action@v4
      with:
        aqtversion: "==3.1.*"
        version: ${{ inputs.qt-version }}
        arch: ${{ inputs.qt-architecture }}
        modules: ${{ inputs.qt-modules }}
        cache: ${{ inputs.build-type == 'Debug' }}

    - name: Resolve Qt path
      id: resolve-qt-path
      shell: bash
      run: |
        qt_path=""

        # Preferred: explicit output from install-qt-action.
        if [ -n "${{ steps.install-qt.outputs.dir }}" ]; then
          qt_path="${{ steps.install-qt.outputs.dir }}"
        fi

        # Fallback: environment variables that may be exported by the action.
        if [ -z "$qt_path" ] && [ -n "${QT_ROOT_DIR:-}" ]; then
          qt_path="${QT_ROOT_DIR}"
        fi
        if [ -z "$qt_path" ] && [ -n "${QTDIR:-}" ]; then
          qt_path="${QTDIR}"
        fi
        if [ -z "$qt_path" ] && [ -n "${Qt6_DIR:-}" ]; then
          case "${Qt6_DIR}" in
            */lib/cmake/Qt6) qt_path="${Qt6_DIR%/lib/cmake/Qt6}" ;;
            *) qt_path="${Qt6_DIR}" ;;
          esac
        fi

        echo "qt-path=$qt_path" >> "$GITHUB_OUTPUT"
