# Used by `.github/workflows/bot.yml` (actions/labeler@v5).
# Applies labels to PRs based on changed files.

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**/*
          - ci/**/*
          - .clang-format
          - .clang-tidy
          - .editorconfig
          - .gitattributes
          - .gitmodules
          - .markdownlint.yaml
          - .markdownlintignore
          - renovate.json

packaging:
  - changed-files:
      - any-glob-to-any-file:
          - debian/**/*
          - flatpak/**/*
          - nix/**/*
          - buildconfig/**/*
          - vcpkg.json
          - vcpkg-configuration.json
          - ci/vcpkg-ports/**/*
          - ci/vcpkg-triplets/**/*
          - flake.nix
          - flake.lock
          - default.nix
          - shell.nix

Linux:
  - changed-files:
      - any-glob-to-any-file:
          - debian/**/*
          - flatpak/**/*
          - nix/**/*
          - libraries/systeminfo/src/sys_unix.cpp
          - libraries/systeminfo/src/distroutils.cpp

macOS:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.mm"
          - libraries/systeminfo/src/sys_apple.cpp
          - launcher/updater/MacSparkleUpdater.h
          - launcher/updater/MacSparkleUpdater.mm

Windows:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.rc"
          - "**/*.iss"
          - "**/*.exe.manifest"
          - libraries/systeminfo/src/sys_win32.cpp
