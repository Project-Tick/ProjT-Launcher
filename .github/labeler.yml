# Used by `.github/workflows/bot.yml` (actions/labeler@v5).
# Applies labels to PRs based on changed files.

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**/*
          - ci/**/*
          - .clang-format
          - .clang-tidy
          - .editorconfig
          - .gitattributes
          - .gitmodules
          - .markdownlint.yaml
          - .markdownlintignore
          - renovate.json

ci-scripts:
  - changed-files:
      - any-glob-to-any-file:
          - ci/github-script/**/*
          - .github/workflows/**/*.yml

ci-config:
  - changed-files:
      - any-glob-to-any-file:
          - ci/pinned.json
          - ci/supportedSystems.json
          - ci/supportedBranches.js
          - ci/default.nix
          - ci/eval/**/*

launcher:
  - changed-files:
      - any-glob-to-any-file:
          - launcher/**/*.{cpp,h,mm,qml,ui,json,yml,xml,js}
          - launcher/**/*.sh
          - launcher/**/*.bat
          - launcher/**/*.ps1
          - launcher/CMakeLists.txt

launcher-ui:
  - changed-files:
      - any-glob-to-any-file:
          - launcher/ui/**/*
          - launcher/resources/**/*
          - launcher/qtquick/**/*
          - launcher/resources/**/*
          - launcher/icons/**/*
          - launcher/news/**/*

launcher-updater:
  - changed-files:
      - any-glob-to-any-file:
          - launcher/updater/**/*

launcher-modplatform:
  - changed-files:
      - any-glob-to-any-file:
          - launcher/modplatform/**/*
          - launcher/minecraft/**/*
          - launcher/minecraft/**/*
          - launcher/launch/**/*

launcher-settings:
  - changed-files:
      - any-glob-to-any-file:
          - launcher/settings/**/*
          - launcher/tasks/**/*
          - launcher/meta/**/*
          - launcher/logs/**/*
          - launcher/tools/**/*
          - launcher/console/**/*

launcher-java:
  - changed-files:
      - any-glob-to-any-file:
          - launcher/java/**/*
          - launcher/launch/**/*

launcher-network:
  - changed-files:
      - any-glob-to-any-file:
          - launcher/net/**/*
          - launcher/filelink/**/*
          - launcher/console/**/*

libraries:
  - changed-files:
      - any-glob-to-any-file:
          - libraries/**/*.{cpp,h,mm}
          - libraries/**/CMakeLists.txt
          - libraries/**/CMakeLists.txt.in
          - libraries/**/README.md
          - libraries/systeminfo/**/*
          - libraries/qdcss/**/*
          - libraries/rainbow/**/*
          - libraries/tomlplusplus/**/*
          - libraries/libnbtplusplus/**/*
          - libraries/quazip/**/*
          - libraries/murmur2/**/*
          - libraries/qrcodegenerator/**/*
          - libraries/LocalPeer/**/*
          - libraries/launcher/**/*
          - libraries/gamemode/**/*
          - libraries/javacheck/**/*

build-system:
  - changed-files:
      - any-glob-to-any-file:
          - CMakeLists.txt
          - CMakePresets.json
          - cmake/**/*
          - buildconfig/**/*
          - vcpkg.json
          - vcpkg-configuration.json
          - vcpkg-ports/**/*
          - vcpkg-triplets/**/*

packaging:
  - changed-files:
      - any-glob-to-any-file:
          - debian/**/*
          - flatpak/**/*
          - nix/**/*
          - buildconfig/**/*
          - vcpkg.json
          - vcpkg-configuration.json
          - ci/vcpkg-ports/**/*
          - ci/vcpkg-triplets/**/*
          - flake.nix
          - flake.lock
          - default.nix
          - shell.nix
          - program_info/**/*

docs:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**/*
          - README.md
          - CONTRIBUTING.md
          - CODE_OF_CONDUCT.md
          - SECURITY.md
          - .github/workflows/README.md

tests:
  - changed-files:
      - any-glob-to-any-file:
          - tests/**/*
          - ci/github-script/test/**/*

scripts:
  - changed-files:
      - any-glob-to-any-file:
          - scripts/**/*
          - tools/**/*
          - launcher/tools/**/*

translations:
  - changed-files:
      - any-glob-to-any-file:
          - launcher/translations/**/*
          - launcher/resources/translations/**/*
          - translations/**/*.{po,pot,ts,txt,json}

Linux:
  - changed-files:
      - any-glob-to-any-file:
          - debian/**/*
          - flatpak/**/*
          - nix/**/*
          - libraries/systeminfo/src/sys_unix.cpp
          - libraries/systeminfo/src/distroutils.cpp

macOS:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.mm"
          - libraries/systeminfo/src/sys_apple.cpp
          - launcher/updater/MacSparkleUpdater.h
          - launcher/updater/MacSparkleUpdater.mm

Windows:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.rc"
          - "**/*.iss"
          - "**/*.exe.manifest"
          - libraries/systeminfo/src/sys_win32.cpp
