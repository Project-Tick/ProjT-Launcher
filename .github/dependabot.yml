version: 2

updates:
  # Keep GitHub Actions up to date
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: "UTC"
    labels: ["11.dependencies", "1.main-ci-changes"]
    rebase-strategy: auto
    commit-message:
      prefix: "deps"
      include: scope
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Update CI helper scripts (npm) in ci/github-script
  - package-ecosystem: npm
    directory: /ci/github-script
    schedule:
      interval: weekly
      day: tuesday
      time: "03:00"
      timezone: "UTC"
    labels: ["11.dependencies", "1.main-ci-changes", "12.npm"]
    open-pull-requests-limit: 5
    rebase-strategy: auto
    versioning-strategy: increase
    commit-message:
      prefix: "deps"
      include: scope
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
