version: 2

updates:
  # Keep GitHub Actions up to date
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 * * * *"
      timezone: "UTC"
    labels: ["11.dependencies", "1.main-ci-changes"]
    rebase-strategy: auto
    commit-message:
      prefix: "deps"
      include: scope
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Update CI helper scripts (npm) in ci/github-script
  - package-ecosystem: npm
    directory: "/ci/github-script"
    schedule:
      interval: cron
      cronjob: "0 * * * *"
      timezone: "UTC"
    labels: ["11.dependencies", "1.main-ci-changes", "12.npm"]
    open-pull-requests-limit: 5
    rebase-strategy: auto
    versioning-strategy: increase
    commit-message:
      prefix: "deps"
      include: scope
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Keep vcpkg manifest in sync
  - package-ecosystem: vcpkg
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 * * * *"
      timezone: "UTC"
    labels: ["11.dependencies", "15.vcpkg"]
    rebase-strategy: auto
    commit-message:
      prefix: "deps"
      include: scope

  # Monitor git submodules
  - package-ecosystem: gitsubmodule
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 * * * *"
      timezone: "UTC"
    ignore:
      - dependency-name: libraries/zlib
    labels: ["11.dependencies", "16.submodules"]
    rebase-strategy: auto
    commit-message:
      prefix: "deps"
      include: scope
